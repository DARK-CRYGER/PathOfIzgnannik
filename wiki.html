<title>Справочник Изгнанника</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Лист бестиария при свечах: тёмная кожа, латунь, цвета редкостей PoE. Единая тёмная тема, как в самой игре. */
:root{--bg:#14100d;--panel:#1d1713;--panel2:#251d17;--line:#3a2f26;--fg:#eadcc2;--muted:#a8977f;--gold:#c9a24a;--gold2:#e6c57a;
  --magic:#8888ff;--umod:#c99a6a;--uspec:#e0a46a;--rare:#ffff77;--unique:#d6874a;--cur:#c8b98a;--good:#7fbf6a;--bad:#d9654b;
  --ff-d:'Alegreya SC',Georgia,serif;--ff-b:'Alegreya Sans',system-ui,sans-serif;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--ff-b);margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1{font:800 clamp(26px,5vw,40px)/1.1 var(--ff-d);color:var(--gold2);margin:0 0 4px;text-wrap:balance}
h2{font:700 22px var(--ff-d);color:var(--gold2);margin:26px 0 8px;text-wrap:balance}
h3{font:700 17px var(--ff-d);color:var(--fg);margin:18px 0 6px}
.lead{color:var(--muted);max-width:68ch;margin:0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
nav button{font:700 14px var(--ff-d);letter-spacing:.03em;background:var(--panel);color:var(--muted);border:1px solid var(--line);padding:8px 12px;cursor:pointer}
nav button.on{color:var(--gold2);border-color:var(--gold)}
nav button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.tools input,.tools select{background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:8px 10px;font:inherit;min-width:0}
.tools input{flex:1 1 220px}
.tbl{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font:700 12px var(--ff-b);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{text-align:right;white-space:nowrap}
.dim{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:11px;letter-spacing:.04em;border:1px solid var(--line);color:var(--muted);padding:0 6px;margin:1px 2px 1px 0;white-space:nowrap}
.tag.g{border-color:#6b5426;color:var(--gold2)}.tag.r{border-color:#5e5a2a;color:var(--rare)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.uq{background:var(--panel);border:1px solid #5a3a22;display:flex;flex-direction:column;min-width:0}
.uq .hd{text-align:center;padding:8px 10px 6px;border-bottom:1px solid #5a3a22;background:linear-gradient(#2a1c12,#1d1713)}
.uq .hd b{display:block;font:700 17px var(--ff-d);color:var(--unique)}
.uq .hd small{color:var(--muted)}
.uq ul{list-style:none;margin:0;padding:8px 12px 10px;color:var(--umod);font-size:14px;text-align:center}
.uq li+li{margin-top:2px}
.uq li.u{color:var(--uspec);font-style:italic}
.uq li.u.first{border-top:1px solid #5a3a22;margin-top:6px;padding-top:6px}
.uq.pin{border-color:var(--gold)}
.uq.pin .hd{border-color:var(--gold)}
.src{font-size:12px;color:var(--gold2);text-align:center;padding:0 10px 8px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 70px;gap:10px;align-items:center}
.bar .t{height:12px;background:var(--panel2);border:1px solid var(--line);position:relative}
.bar .t i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#8a6a2a,var(--gold2))}
.bar b{font:700 14px var(--ff-d);color:var(--cur)}
.note{border-left:3px solid var(--gold);padding:8px 12px;background:var(--panel);color:var(--fg);margin:10px 0;max-width:78ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);padding:10px 12px;min-width:0}
.card b{font:700 15px var(--ff-d);color:var(--gold2)}
.r-magic{color:var(--magic)}.r-rare{color:var(--rare)}.r-unique{color:var(--unique)}
.empty{padding:14px;color:var(--muted)}
/* карточки предметов — как в игре */
.gcard{background:#0f0b09;border:1px solid #4a3c30;text-align:center;font-size:13px;min-width:0;display:flex;flex-direction:column}
.gcard .card{border:0;background:none}
.card .hd{padding:10px 8px 8px;border-bottom:1px solid #4a3c30;font:700 16px/1.2 var(--ff-d)}
.card .hd small{display:block;font:500 13px var(--ff-d);opacity:.85}
.card .bd{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px}
.card .sep{height:1px;background:#4a3c30;margin:5px 20%}
.card .mod{color:#8f9fe6}.card.r-unique .mod{color:#c99a6a}
.card .umod{color:#e0a46a;font-style:italic;font-weight:700}
.gcard .card{color:var(--fg)}.card.r-unique .hd{color:#cf7a3b}.card .num{text-align:center}
.card .small{font-size:12px}.card .dim{color:var(--muted)}
.gcard .alt{border-top:1px dashed #4a3c30;padding:6px 10px 8px;font-size:12px;color:var(--muted);text-align:left;margin-top:auto}
.gcard.pin{border-color:var(--gold)}.gcard .src{padding:0 10px 8px;margin:0}
@media (max-width:520px){.bar{grid-template-columns:1fr 60px}.bar .t{grid-column:1/-1;grid-row:2}}
nav .sh{display:none}
/* телефон: таблицы превращаются в карточки, вкладки — в нижнюю панель */
@media (max-width:640px){
  .wrap{padding-block:14px 90px}
  h1{font-size:26px}.lead{font-size:14px}
  nav{position:fixed;left:0;right:0;bottom:0;top:auto;margin:0;z-index:20;border-top:1px solid var(--line);border-bottom:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#0f0b09}
  nav button{padding:10px 2px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding-block:8px;margin:8px 0 2px}
  .tbl{border:0;background:none;overflow:visible}
  .tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;width:auto}
  .tbl tr:first-child{display:none}
  .tbl tr{background:var(--panel);border:1px solid var(--line);margin-bottom:8px;padding:6px 10px}
  .tbl td{border:0;padding:3px 0;display:flex;gap:10px;justify-content:space-between;align-items:baseline;text-align:right}
  .tbl td::before{content:attr(data-l);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;flex:none;max-width:45%}
  .tbl td:first-child{display:block;text-align:left;font-size:15px;padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:2px}
  .tbl td:first-child::before{display:none}
  .tbl td.num{text-align:right}
  .tbl td.wide{display:block;text-align:left}.tbl td.wide::before{display:block;max-width:none;margin-bottom:2px}
  .tbl td:empty{display:none}
  .grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}
  .note{font-size:14px}
  .bars{gap:12px}.bar{row-gap:4px}
  nav .lg{display:none}nav .sh{display:inline}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div class="wrap">
  <h1>Справочник Изгнанника</h1>
  <p class="lead">Базы предметов, все свойства с диапазонами значений, уникальные предметы и шансы добычи в Path of Izgnannik. Данные взяты прямо из кода игры, версия 4.5.</p>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

  <select id="slot" aria-label="База"><option value="">Все базы</option>${bases.map(s=>`<option ${st.slot===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>

  const A=C.reg.filter(u=>f(u)&&(!st.us||u.st===st.us)),F=C.flask.filter(f),P=C.pin.filter(f),G=[...new Set(C.pin.map(x=>x.gn))];
  return `<h2>Уникальные предметы</h2>
  <div class="note">Карточки — как в игре: сверху собственные свойства базы (урон, защита, блок, собственное свойство), ниже свойства предмета, жирным курсивом — особое свойство уникального. Урон, защита, собственное свойство и плоские значения зависят от уровня предмета — выберите его. Уникальные падают с любого врага, из тайников и сокровищницы лабиринта, из богатого ларца. Предметы пинакл-боссов падают только с них, всегда 84 уровня.</div>

    <select id="il" aria-label="Уровень предмета">${[20,40,60,84].map(x=>`<option value="${x}" ${x==L?'selected':''}>Уровень предмета ${x}</option>`).join('')}</select></div>
  <h3>Обычные · ${A.length}</h3><div class="grid">${A.map(u=>cardOf(u,(STN[u.st]||'')+' · выпадает с ур. предмета '+u.minL)).join('')||'<p class="empty">Нет совпадений</p>'}</div>
  <h3>Уникальные флаконы · ${F.length}</h3><div class="grid">${F.map(u=>cardOf(u)).join('')||'<p class="empty">Нет совпадений</p>'}</div>
  ${G.map(g=>{const l=P.filter(x=>x.gn===g);return l.length?`<h3>${esc(g)} · пинакл</h3><div class="grid">${l.map(u=>cardOf({...u,c:{[L]:u.c[84]}},'Только с босса «'+g+'»',1)).join('')}</div>`:'';}).join('')}`;
}
function drops(){
  const max=Math.max(...D.orbs.map(o=>o.share));
  const bar=(n,v,s)=>`<div class="bar"><b>${n}</b><div class="t"><i style="width:${v/max*100}%"></i></div><span class="num">${s}</span></div>`;
  return `<h2>Сферы ремесла</h2>
  <div class="note">Обычный враг роняет сферу с шансом <b>6% × (1 + 0,6 × число его свойств)</b>: синий (1 свойство) — 9,6%, жёлтый с 3 свойствами — 16,8%. Босс роняет 2–4 сферы. Какая именно сфера — по весам ниже.</div>
  <div class="bars">${D.orbs.map(o=>bar(esc(o.n),o.share,o.share.toFixed(1)+'%')).join('')}</div>
  <div class="tbl" style="margin-top:12px"><table><tr><th>Сфера</th><th>Действие</th><th class="num">Вес</th><th class="num">Доля</th><th class="num">С синего врага</th></tr>
  ${D.orbs.map(o=>`<tr><td><b style="color:var(--cur)">${esc(o.n)}</b></td><td>${esc(o.d)}</td><td class="num">${o.w}</td><td class="num">${o.share.toFixed(1)}%</td><td class="num">${(9.6*o.share/100).toFixed(2)}%</td></tr>`).join('')}</table></div>
  <p class="dim">Ещё сферы дают: ларец чародея (5–8 сфер), пинакл-боссы (4 сферы: возвышения, божественная, хаоса), тайники и сокровищница лабиринта.</p>
  <p class="dim"><b style="color:var(--cur)">Сфера временного костыля</b> не входит в общий набор: она падает только с волшебных (синих) врагов с шансом 0,35%. <b style="color:var(--cur)">Зеркало Каландры</b> — самая редкая сфера, в 500 раз реже божественной; копия предмета неизменяема, у исходного предмета появляется счётчик копий.</p>

  <h2>Свойства врагов</h2>
  <div class="note">Волшебный враг получает 1 свойство, редкий — 2–3. Все враги могут наносить критические удары: обычные 5%, волшебные 6%, редкие 8%, боссы 7%, множитель ×1,5. Свойство предметов «меньше доп. урона от критических ударов» снижает именно эту добавку. Боссы и «Размашистые» враги бьют сразу нескольких — героя и приспешников рядом.</div>
  <div class="tbl"><table><tr><th>Свойство</th><th>Что делает</th></tr>${D.emods.map(m=>`<tr><td><b>${esc(m.n)}</b>${m.aura?' <span class="tag r">аура</span>':''}</td><td>${esc(m.d)}</td></tr>`).join('')}</table></div>

  <h2>Подземелье</h2>
  <div class="note">Убежище → «Подземелье». Волны без конца, пока герой жив: монстры с 83 уровня, с каждой волной сильнее, врагов в волне от 3 до 15, каждая 10-я волна — с боссом. Золото, вещи и сферы с монстров — 35% от обычного; каждые 5 волн — награда сферами, каждые 10 — карта. Смерть не отнимает опыт. На экране подземелья — Dungeon master ♂: игрок, прошедший больше всего волн.</div>

  <h2>Предметы</h2>
  <div class="note">Обычный враг роняет предмет с шансом <b>13% × (1 + 0,6 × свойства)</b>, с 2+ свойствами — ещё один с шансом 50%. Босс роняет 3 предмета, первый с шансом 35% уникальный.</div>
  <div class="tbl"><table><tr><th>Редкость предмета</th><th class="num">Без бонусов</th><th class="num">+100% редкости</th></tr>
    <tr><td class="r-unique"><b>Уникальный</b></td><td class="num">1,1%</td><td class="num">2,2%</td></tr>
    <tr><td class="r-rare"><b>Редкий</b></td><td class="num">8,9%</td><td class="num">17,8%</td></tr>
    <tr><td class="r-magic"><b>Волшебный</b></td><td class="num">32%</td><td class="num">64%</td></tr>
    <tr><td><b>Обычный</b></td><td class="num">58%</td><td class="num">16%</td></tr></table></div>
  <p class="dim">Редкость найденных предметов складывается: свойства на вещах и в древе, +30% за каждое свойство врага, +100% у босса, +40% в лабиринте, на картах +50% и ещё 5% за тир, проклятия и метки с бонусом добычи.</p>
  <h3>Какой слот выпадет</h3>
  <div class="bars">${[['Броня (шлем, нагрудник, перчатки, обувь)',36],['Оружие',20],['Бижутерия (амулет, кольца, пояс)',20],['Флаконы',18],['Щит или колчан',6]].map(([n,v])=>`<div class="bar"><b>${n}</b><div class="t"><i style="width:${v/36*100}%"></i></div><span class="num">${v}%</span></div>`).join('')}</div>
  <p class="dim">Оружие в 45% случаев — тип вашего класса. Среди уникальных 18% — флаконы.</p>

  <h2>Карты и прочее</h2>
  <div class="tbl"><table><tr><th>Что</th><th>Где</th><th class="num">Шанс</th></tr>
    <tr><td><b>Карта 1 тира</b></td><td>V акт кампании, обычный враг</td><td class="num">1,2% × (1 + 0,6 × свойства)</td></tr>
    <tr><td><b>Карта 1 тира</b></td><td>Босс V акта</td><td class="num">60%</td></tr>
    <tr><td><b>Карта тира N</b></td><td>Карта N, обычный враг (80% тир N, 20% тир N+1)</td><td class="num">1% × (1 + 0,5 × свойства)</td></tr>
    <tr><td><b>Карта</b></td><td>Босс карты N: тир N+1 с шансом 30%, иначе N; ещё одна карта N</td><td class="num">100% + 15%</td></tr>
    <tr><td><b>Карта хранителей</b> (Создателя, Древнего, Сируса)</td><td>Карты 14–16 тира: босс / обычный враг</td><td class="num">7% / 0,12% × (1 + свойства)</td></tr>
    <tr><td><b>Карта хранителей</b></td><td>Ларец картографа на карте 14+</td><td class="num">10%</td></tr>
    <tr><td><b>Фрагмент хранителя</b></td><td>Босс карты хранителей (+25% уникальный)</td><td class="num">100%</td></tr>
    <tr><td><b>Подношение богине</b></td><td>Карты 5+ тира: босс / обычный враг</td><td class="num">15% / 0,1% × (1 + свойства)</td></tr>
    <tr><td><b>Камень умения</b></td><td>Кампания и лабиринт: босс / обычный враг. На картах камни не падают</td><td class="num">50% / 2% × (1 + 0,5 × свойства)</td></tr>
    <tr><td><b>Уникальный пинакл-босса</b></td><td>Создатель, Древний, Сирус</td><td class="num">1 предмет, 35% — второй</td></tr></table></div>

  <h2>Ларцы и алтари</h2><p class="dim">После волны на карте с шансом 16% появляется событие: ларец (60%) или алтарь (40%). Ларец вызывает 2 волны охраны, алтарь — одну, под своей силой.</p>
  <div class="cards">${Object.values(D.boxes).map(b=>`<div class="card"><b>${esc(b.n)}</b><br><span class="dim">${esc(b.d)}</span></div>`).join('')}</div>
  <div class="tbl" style="margin-top:10px"><table><tr><th>Алтарь</th><th>Охрана</th><th>Бафф до конца карты</th></tr>${Object.values(D.altars).map(a=>`<tr><td><b>${esc(a.n)}</b></td><td>${esc(a.mon)}</td><td>${a.buff.map(esc).join(', ')}</td></tr>`).join('')}</table></div>`;
}
function label(root){root.querySelectorAll('.tbl table').forEach(tb=>{const rows=tb.querySelectorAll('tr');if(!rows.length)return;const H=[...rows[0].children].map(th=>th.textContent.trim());
    rows.forEach((r,i)=>{if(!i)return;[...r.children].forEach((td,j)=>{td.dataset.l=H[j]||'';if(td.textContent.length>28||td.querySelector('.tag,br'))td.classList.add('wide');});});});}
function render(){nav();const m=document.getElementById('main');m.innerHTML=({bases,mods,uniques,drops})[tab]();label(m);
  const q=document.getElementById('q');if(q)q.oninput=()=>{st.q=q.value;const pos=q.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos);};
  const s=document.getElementById('slot');if(s)s.onchange=()=>{st.slot=s.value;render();};
  const il=document.getElementById('il');if(il)il.onchange=()=>{st.il=il.value;render();}; const us=document.getElementById('us');if(us)us.onchange=()=>{st.us=us.value;render();};
  const u=document.getElementById('uq');if(u)u.oninput=()=>{st.uq=u.value;const pos=u.selectionStart;render();const n=document.getElementById('uq');n.focus();n.setSelectionRange(pos,pos);};}
render();
</script>
