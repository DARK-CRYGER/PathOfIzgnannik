<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Path of Izgnannik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone shell (max 520px); sticky hero bar on top, tab bar fixed to the bottom; combat fills one screen. Single dark world: tarnished bronze on soot. */
:root{
  color-scheme: dark;
  --bg:#14100d; --bg2:#1c1612; --panel:#221b16; --panel2:#2b221b; --line:#3d3128; --line2:#57463a;
  --fg:#eadcc2; --muted:#a8977f; --dim:#76695a;
  --gold:#c9a24a; --gold2:#e6c57a;
  --str:#cf5f4b; --dex:#6fae55; --int:#5d8fde;
  --r-normal:#d9d3c5; --r-magic:#8c8cff; --r-rare:#e9d46b; --r-unique:#cf7a3b; --r-gem:#2fb3a3;
  --fire:#e5793a; --cold:#7cc3e8; --light:#f0d75a; --chaos:#b56fd1; --phys:#d4c7b0;
  --good:#7fb069; --bad:#d0533f; --boss:#f0a070;
  --ff-d:"Alegreya SC", "Palatino Linotype", Georgia, serif;
  --ff-b:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --vh: var(--tg-viewport-stable-height, 100dvh);
}
*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--ff-b);margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  background-image:radial-gradient(120% 60% at 50% -10%, #2a1f17 0%, transparent 60%);background-attachment:fixed}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100%;padding-inline:14px;padding-block:0 96px;position:relative}
#app.fight{padding-block:0 10px}
h1,h2,h3{font-family:var(--ff-d);font-weight:700;text-wrap:balance;margin:0;letter-spacing:.02em}
.eyebrow{font:500 12px/1.2 var(--ff-d);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1;min-width:0}
.boss-t{color:var(--boss)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 75%, transparent);padding-block:10px 12px;display:flex;gap:10px;align-items:center}
.sigil{width:40px;height:40px;flex:none;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center;font:800 18px var(--ff-d);color:var(--gold2);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.top .who{min-width:0;flex:1}
.top .who b{font:700 16px var(--ff-d);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:5px;background:var(--panel2);margin-top:4px;position:relative;overflow:hidden}
.xpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#8a6a2a,var(--gold2))}
.gold{font:700 14px var(--ff-d);color:var(--gold2);white-space:nowrap}
.pts{background:var(--gold);color:#1b140d;font:800 13px var(--ff-d);padding:6px 9px;border:0;min-height:32px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#100c09f2;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:9px 2px 11px;font:600 12px var(--ff-d);letter-spacing:.05em;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;min-height:56px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.tabs button.on{color:var(--gold2)}
.tabs button.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--gold)}
.tabs .dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;background:var(--gold2);border-radius:50%}

/* panels & buttons */
.panel{background:var(--panel);border:1px solid var(--line);padding:14px;position:relative;min-width:0}
.panel.framed{box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--line)}
.ph{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ph h2{font-size:18px}
.btn{background:linear-gradient(#3a2d22,#2a2018);border:1px solid var(--line2);padding:10px 14px;font:700 14px var(--ff-d);letter-spacing:.04em;color:var(--fg);min-height:44px}
.btn.pri{background:linear-gradient(#a8823a,#7a5b22);border-color:#d8b56a;color:#1a120a}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-height:36px;font-size:13px}
.btn.danger{border-color:var(--bad);color:#ff9a88}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.full{width:100%}
.seg{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:var(--panel);border:1px solid var(--line);padding:8px 12px;font:700 14px var(--ff-d);color:var(--muted);min-height:40px}
.seg button.on{color:var(--gold2);border-color:var(--gold)}
.seg button:disabled{opacity:.35}
.tag{display:inline-block;font:600 11px var(--ff-b);padding:2px 6px;border:1px solid var(--line2);color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.tag.boss{color:var(--boss);border-color:#7a3b22}
.tag.ok{color:var(--good);border-color:#3b5530}
.tag.new{color:var(--gold2);border-color:#6a5326}
.tag.lock{color:var(--dim)}
.notice{font-size:13px;color:var(--muted);border-left:2px solid var(--gold);padding-left:10px;margin:0}

/* class select */
.hero{padding-block:28px 8px}
.hero h1{font-size:38px;line-height:1;color:var(--gold2);font-weight:800}
.hero p{color:var(--muted);margin:10px 0 0;max-width:40ch}
.cls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.cls{background:var(--panel);border:1px solid var(--line);padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px}
.cls.on{border-color:var(--gold);background:var(--panel2)}
.cls b{font:700 17px var(--ff-d)}
.cls small{color:var(--muted);font-size:12px}
.attrbar{display:flex;height:6px;gap:2px}
.attrbar i{display:block}
.input{width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--fg);padding:10px 12px;font:16px var(--ff-b)}
.chiplist{display:flex;flex-wrap:wrap;gap:4px}

/* map */
.cta{display:flex;align-items:center;gap:12px;background:linear-gradient(#3a2b1a,#261c14);border:1px solid var(--gold);padding:12px 14px;width:100%;text-align:left;min-height:64px}
.cta b{font:700 17px var(--ff-d);color:var(--gold2);display:block}
.cta .arrow{font:800 22px var(--ff-d);color:var(--gold2)}
.loc{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px;background:var(--panel);border:1px solid var(--line)}
.loc .lv{font:800 17px var(--ff-d);color:var(--gold2);text-align:center;border-right:1px solid var(--line);padding-right:10px;line-height:1.1}
.loc .lv small{display:block;font:500 10px var(--ff-d);color:var(--muted);letter-spacing:.1em}
.loc b{font:700 16px var(--ff-d)}
.loc.locked{opacity:.45}
.pips{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.pips i{width:14px;height:6px;background:var(--line);display:block}
.pips i.on{background:var(--gold)}
.pips i.cur{background:var(--gold2);box-shadow:0 0 0 1px var(--gold2)}
.pips i.boss{width:20px;background:#5a2a1c}
.pips i.boss.on{background:var(--boss)}
.tiers{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.tier{background:var(--panel);border:1px solid var(--line);padding:8px 4px;text-align:center;min-height:56px}
.tier b{font:800 18px var(--ff-d);display:block;color:var(--gold2)}
.tier small{font-size:11px;color:var(--muted)}
.tier:disabled{opacity:.35}

/* combat */
.cb-head{display:flex;align-items:center;gap:8px;padding-block:calc(8px + env(safe-area-inset-top,0px)) 6px}
.cb-head h2{font-size:17px;line-height:1.1}
.field{display:flex;flex-direction:column;gap:3px;background:linear-gradient(#1a1410,#120e0b);border:1px solid var(--line);padding:6px}
.lane{display:grid;grid-template-columns:20px 1fr;gap:6px;align-items:stretch;min-height:22px}
.lane .ll{writing-mode:vertical-rl;transform:rotate(180deg);font:600 10px/1 var(--ff-d);letter-spacing:.08em;color:var(--dim);text-align:center;border-right:1px solid var(--line);padding-left:4px}
.lane.has .ll{color:var(--muted)}
.lane.inr .ll{color:var(--gold2);border-color:var(--gold)}
.lane .ens{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.lane .empty-l{font-size:11px;color:var(--dim);align-self:center}
.en{flex:1 1 30%;max-width:100%;min-width:0;background:var(--panel);border:1px solid var(--line);padding:5px 6px 4px;text-align:left;position:relative;display:flex;flex-direction:column;gap:3px}
.en.tgt{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.en.dead{opacity:.2;filter:grayscale(1)}
.en.elite{background:linear-gradient(var(--panel),#2a2410)}
.en.boss{background:linear-gradient(#2c1612,var(--panel));border-color:#6e2e20;flex-basis:100%}
.en.oor{opacity:.55}
.en .nm{font:700 12px/1.15 var(--ff-d);display:flex;gap:4px;align-items:center;min-width:0}
.en .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.bar{height:9px;background:#0d0a08;border:1px solid #000;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;transition:width .2s}
.bar .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 9px/1 var(--ff-b);color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}
.hpb i{background:linear-gradient(#c84a3a,#7e2219)}
.esb i{background:linear-gradient(#cfe0ee,#7d9ab3)}
.mpb i{background:linear-gradient(#5585cf,#26467c)}
.rgb i{background:linear-gradient(#f08a3a,#a3461c)}
.chips{display:flex;gap:3px;flex-wrap:wrap;min-height:13px}
.chip{font:600 9px/1.3 var(--ff-b);padding:0 4px;border:1px solid}
.log{background:#0f0b09;border:1px solid var(--line);padding:5px 8px;font-size:12px;height:62px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;margin-block:6px}
.log div{opacity:.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.log div:nth-last-child(-n+2){opacity:1}
.me{display:grid;gap:3px;position:relative}
.me .bar{height:15px}.me .bar .t{font-size:11px}
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:6px}
.sk{background:linear-gradient(#30251c,#211913);border:1px solid var(--line2);padding:7px 8px;text-align:left;min-height:58px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.sk b{font:700 14px/1.1 var(--ff-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk .why{color:#e0907e}
.sk:disabled{opacity:.42}
.sk.empty{border-style:dashed;color:var(--dim);justify-content:center;align-items:center}
.act-row{display:grid;grid-template-columns:1fr 1.3fr 1.1fr 1fr;gap:5px;margin-top:5px}
.act-row .btn{padding:6px 4px;font-size:13px;min-height:46px}
.btn.toggle.on{border-color:var(--gold2);color:var(--gold2)}
.float{position:absolute;left:50%;top:20%;transform:translateX(-50%);font:800 16px var(--ff-d);pointer-events:none;text-shadow:0 1px 0 #000,0 0 6px #000;animation:fl .9s ease-out forwards;white-space:nowrap;z-index:3}
.float.crit{font-size:21px;color:var(--gold2)}
@keyframes fl{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-28px)}}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* gems */
.slot{background:var(--panel);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.slot.locked{opacity:.5}
.socks{display:flex;gap:6px;flex-wrap:wrap}
.gemb{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line2);padding:6px 10px 6px 6px;min-height:46px;text-align:left;min-width:0;width:100%}
.gemb.half{flex:1 1 140px;width:auto}
.gemb.bad{border-color:#6e2e20}
.gemb.off{opacity:.5}
.gem{width:26px;height:26px;flex:none;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);position:relative}
.gem.sup{clip-path:circle(50%)}
.gem.aura{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.gem::after{content:"";position:absolute;inset:5px;background:#ffffff40;clip-path:inherit}
.gemb .gt{min-width:0;display:flex;flex-direction:column;flex:1}
.gemb .gt b{font:700 13px/1.15 var(--ff-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gemb .gt small{font-size:11px;color:var(--muted)}
.emptys{flex:1 1 60px;max-width:110px;height:46px;border:1px dashed var(--line2);background:transparent;display:grid;place-items:center;color:var(--dim);font-size:20px}
.summary{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.summary b{color:var(--fg)}
.list{display:flex;flex-direction:column;gap:6px}
.resbar{height:12px;background:#0d0a08;border:1px solid #000;display:flex;overflow:hidden}
.resbar i{display:block;height:100%;background:linear-gradient(#5585cf,#26467c);border-right:1px solid #000}

/* items */
.irow{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:8px 10px;text-align:left;min-width:0;min-height:44px;width:100%}
.irow .sl{font:500 11px var(--ff-d);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.irow .in{min-width:0;font:700 14px var(--ff-d);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow.up{box-shadow:inset 3px 0 0 var(--good)}
.bag{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.bag .irow{grid-template-columns:1fr;gap:2px}
.r-normal{color:var(--r-normal)}.r-magic{color:var(--r-magic)}.r-rare{color:var(--r-rare)}.r-unique{color:var(--r-unique)}.r-gem{color:var(--r-gem)}
.card{background:#0f0b09;border:1px solid var(--line2);text-align:center;font-size:13px}
.card .hd{padding:10px 8px 8px;border-bottom:1px solid var(--line2);font:700 16px/1.2 var(--ff-d)}
.card .hd small{display:block;font:500 13px var(--ff-d);opacity:.85}
.card .bd{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px}
.card .sep{height:1px;background:var(--line2);margin:5px 20%}
.card .mod{color:#8f9fe6}
.card.r-unique .mod{color:#c99a6a}
.cmp{font-size:12px;display:flex;flex-direction:column;gap:2px}
.cmp .up{color:var(--good)} .cmp .dn{color:var(--bad)}

/* tree */
.treebox{height:calc(var(--vh) - 330px);min-height:300px;overflow:hidden;background:radial-gradient(circle at 50% 50%,#1d1712,#0f0c0a 70%);border:1px solid var(--line);touch-action:none;position:relative}
.treebox svg{display:block;width:100%;height:100%}
.tzoom{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:4px}
.tzoom button{width:40px;height:40px;background:#1c1612e6;border:1px solid var(--line2);font:700 18px var(--ff-d);color:var(--fg)}
.statl{display:flex;flex-direction:column;gap:2px;font-size:14px}
.statl span{color:#8f9fe6}

/* sheet */
.sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}
.sheet div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding-block:3px;font-size:14px;min-width:0}
.sheet div span:first-child{color:var(--muted)}
.sheet div span:last-child{font-variant-numeric:tabular-nums;font-weight:700}

/* modal + toast */
.ov{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--gold);border-bottom:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 40px #000;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.modal h2{color:var(--gold2);font-size:22px}
.grab{width:40px;height:4px;background:var(--line2);margin:-8px auto 0}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;background:#1d150f;border:1px solid var(--gold);color:var(--gold2);padding:8px 14px;font:700 14px var(--ff-d);animation:tin .25s;max-width:92vw;text-align:center;pointer-events:none}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}
.choice{display:grid;gap:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v3 ===== */
.gold-t{color:var(--gold2)} .bad-t{color:#e0907e} .good-t{color:var(--good)} .r-cur{color:#d9c58f}
.en.r-magic{border-color:#4a4a9a}.en.r-magic .nmt{color:var(--r-magic)}
.en.r-rare{border-color:#8a7a2a;background:linear-gradient(var(--panel),#2a2410)}.en.r-rare .nmt{color:var(--r-rare)}
.en.r-boss{background:linear-gradient(#2c1612,var(--panel));border-color:#6e2e20;flex-basis:100%}.en.r-boss .nmt{color:var(--boss)}
.en.acting{box-shadow:0 0 0 2px var(--bad) inset}
.intent{font:600 10px/1.2 var(--ff-b);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.intent.warn{color:#e3b07a}.intent.bad{color:#ff8a75;font-weight:700}.intent.ok{color:var(--good)}
.log{width:100%;text-align:left;cursor:pointer;height:52px}
.buffs{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;min-height:16px}
.order{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;font:600 11px var(--ff-b);margin-top:5px;padding:4px 6px;background:#0f0b09;border:1px solid var(--line);white-space:nowrap}
.order::-webkit-scrollbar{display:none}
.order span{color:var(--muted)}.order span.cur{color:var(--gold2);text-decoration:underline;text-underline-offset:3px}
.order i{font-style:normal;color:var(--dim)}
.skills.one{grid-template-columns:1fr}
.flasks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:5px}
.fl{position:relative;background:#1a1410;border:1px solid var(--line2);min-height:44px;padding:4px 2px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;overflow:hidden;min-width:0}
.fl b{font:700 11px/1.1 var(--ff-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fl small{font-size:10px;color:var(--muted)}
.fl i{position:absolute;left:0;bottom:0;height:3px;background:var(--good)}
.fl.r-magic{border-color:#4a4a9a}.fl.r-unique{border-color:#8a5a2a}
.fl.on{box-shadow:0 0 0 1px var(--gold2) inset}
.fl:disabled{opacity:.45}
.act-row{grid-template-columns:1fr 1.4fr 1fr}
.journal{max-height:62vh;overflow:auto;font-size:12.5px;line-height:1.45;background:#0f0b09;border:1px solid var(--line);padding:8px 10px;-webkit-user-select:text;user-select:text}
.jt{font:700 11px var(--ff-d);letter-spacing:.1em;color:var(--gold);text-transform:uppercase;margin-top:8px;border-top:1px solid var(--line);padding-top:4px}
.jt:first-child{margin-top:0;border-top:0}
.jl{color:var(--fg)}
.umod{color:#e0a46a;font-style:italic}

const FLAT_SCALE=new Set(['life','mana','es','armour','eva','armF','evaF','esF']);
/* значения уникальных: проценты растут с уровнем предмета; эти свойства не растут */
const U_NOSCALE=new Set(['str','dex','int','allAttr','gemLvl','gemLvlM','gemLvlR','gemLvlS','gemLvlMn','gemLvlFire','gemLvlCold','gemLvlLight','gemLvlChaos','gemLvlPhys','minionN','minionDur','plusProj','reach','block','spellBlock','dmgMore','minionMore','acc','mreg']);
const uPct=il=>Math.min(1.4,Math.max(.6,.55+il/100));
function uVal(k,v,il){if(String(k).startsWith('u_')||String(k).startsWith('ex_')&&v===1)return v;
  if(Array.isArray(v))return v.map(x=>Math.max(1,R(x*(1+il/25))));
  if(FLAT_SCALE.has(k)&&v>0)return R(v*(1+il/40));
  if(U_NOSCALE.has(k)||v<0)return v;
  const x=v*uPct(il);return Math.abs(v)<3?R(x*10)/10:R(x);}
function wcOf(it){if(!it||it.slot!=='weapon')return null;return it.wc||WEAP[it.wk].wc[0];}
function modAllowed(k,it){
  const m=MODS[k];if(!m||!m.on.includes(it.slot))return false;
  if(it.slot==='weapon'){const wc=wcOf(it);if(!m.wc||!(m.wc.includes(wc)||(wc==='summon'&&m.wc.includes('caster')&&!m.noSum)))return false;}
  if(m.dt){if(!it.dt)return false;if(m.dt.length===2){if(it.dt!==m.dt)return false;}else if(!DT_K[it.dt].includes(m.dt))return false;}
  if(m.minL&&it.ilvl<m.minL)return false;
  return true;
}
/* итоговая защита брони с локальными свойствами */
function itemDef(it){
  if(!it.def)return null;const d={...it.def},m=k=>itStat(it,k);
  if(d.armour!=null)d.armour=(d.armour+m('armF'))*(1+(m('armL')+m('aeL')+m('asL'))/100);
  if(d.eva!=null)d.eva=(d.eva+m('evaF'))*(1+(m('evaL')+m('aeL')+m('eeL'))/100);
  if(d.es!=null)d.es=(d.es+m('esF'))*(1+(m('esL')+m('eeL')+m('asL'))/100);
  for(const k in d)d[k]=R(d[k]);return d;
}

function ascSmall(s){
  for(const k in s){if(BOOL_EX.has(k))continue;const v=s[k];if(typeof v!=='number')continue;
    const sv=k==='regen'||k==='leech'?R(v/3*10)/10:(v<0?Math.min(-1,R(v/3)):Math.max(1,R(v/3)));return {[k]:sv};}
  return {lifeP:4};
}
/* граф возвышения: старт в центре, 7 ветвей «малый → значимый», как в PoE */
const ASC_POS=(()=>{const P={start:[0,0]};for(let i=0;i<7;i++){const a=(-90+i*360/7)*Math.PI/180;
  P['s'+i]=[R(Math.cos(a)*92),R(Math.sin(a)*92)];P['n'+i]=[R(Math.cos(a)*172),R(Math.sin(a)*172)];}return P;})();

const totems=()=>(C&&C.totems||[]).filter(t=>t.hp>0);
function totemLimit(sk,P){if(sk.ballistaSk)return Math.max(1,3-(sk.focused?1:0));return Math.max(1,P.totemMax+(sk.mtot?2:0));}
function placeTotem(sk,P,dur){
  const L=sk.lvl,G=GEMS[sk.gid];C.totems=C.totems||[];
  const hp=R((30+14*L)*(1+(P.t.totemLife||0)/100)*(sk.decoy?2:1)*(P.keys.has('k_chief_arohongui')?1.5:1));
  const n=(sk.mtot?2:1)+(P.t.totemDouble&&roll(P.t.totemDouble)?1:0);
  const mine=()=>C.totems.filter(t=>t.hp>0&&t.ballista===!!sk.ballistaSk&&(sk.mtot?t.slot===sk.slot:true));
  for(let j=0;j<n;j++){const lim=totemLimit(sk,P);let cur=mine();
    if(cur.length>=lim){cur.sort((a,b)=>a.t-b.t)[0].hp=0;}
    const tm={uid:'t'+(++EUID),totem:1,slot:sk.slot,gid:sk.gid,n:G.totemN||(sk.ballistaSk?'Баллиста':TOTEM_N)+': '+sk.name,hp,maxHp:hp,t:dur||R(8*(1+((P.t.totemDur||0)+(P.t.skillDur||0))/100)),
      ballista:!!sk.ballistaSk,taunt:(sk.decoy?1:0)+(P.t.totemTaunt||0)+(P.keys.has('k_chief_tukohama')?2:0),eb:!!dur};
    C.totems.push(tm);}
  C.totems=C.totems.filter(t=>t.hp>0);C.totemAt=C.turn;
  if(P.keys.has('k_hiero_arcane'))C.arcane=3;
  logC(`Установлен${n>1?'ы':''}: ${sk.name}${n>1?' ×'+n:''} <span class="dim">(тотемов ${totems().length})</span>`);
}

function totemSk(tm,P){const sk=P.skills[tm.slot];if(!sk||sk.bad)return null;const G=GEMS[sk.gid];
  const fn=sk.totemGem?G.tfn:sk.fn;return {...sk,fn,totemHit:1,cost:0};}
async function totemPhase(P){
  const ts=totems();if(!ts.length)return;let dealt=0;
  /* аура «каждый тотем: враги рядом получают больше урона» */
  const aura=(P.t.totemAura||0)+(P.keys.has('k_hiero_ritual')?8:0);
  C.enemies.forEach(e=>{e.totemAura=e.d<=1?aura*ts.length:0;e.totemFire=P.keys.has('k_chief_ramako')&&e.d<=1?10:0;});
  for(const tm of ts){if(!alive().length)break;const sk=totemSk(tm,P);if(!sk){tm.hp=0;continue;}
    if(sk.heal){[...minions(),...totems()].forEach(x=>{x.hp=Math.min(x.maxHp,x.hp+x.maxHp*sk.heal/100);});if(!P.keys.has('vaal'))C.hp=Math.min(P.life,C.hp+P.life*sk.heal/100);logF(`&nbsp;&nbsp;${tm.n}: восполнение ${R(sk.heal*10)/10}%`);continue;}
    if(sk.decoy){if(tm.taunt<=0&&(C.turn%2===0))tm.taunt=1;continue;}
    if(sk.devour){if(C.hp<P.life*.75&&C.corpses&&C.corpses.length&&!P.keys.has('vaal')){C.corpses.shift();C.hp=Math.min(P.life,C.hp+P.life*sk.devour/100);logF(`&nbsp;&nbsp;${tm.n}: поглощает труп, +${R(sk.devour*10)/10}% здоровья`);}continue;}
    if(sk.fn==='sear'){const lines=ts.filter(x=>x.gid==='t_searing').length>1?2:1;alive().filter(e=>e.d<=lines).forEach(e=>{const d=(sk.dmg.fire?(sk.dmg.fire[0]+sk.dmg.fire[1])/2:0)*.6*sk.ignMore;
      if(!e.st.ign||e.st.ign.d<d)e.st.ign={d,t:sk.ignDur};});logF(`&nbsp;&nbsp;${tm.n}: поджигает врагов`);continue;}
    const H=totemHits(sk,P);
    for(const h of H){if(h.e.hp<=0)continue;const r=dealHit(sk,h.e,h.m,h.proj,P);dealt+=r.total;
      if(P.t.totemLeech&&r.parts&&r.parts.phys&&!P.keys.has('vaal'))C.hp=Math.min(P.life,C.hp+r.parts.phys*P.t.totemLeech/100);}
  }
  if(dealt)C.log.push(`Тотемы: ${fmt(dealt)} урона`);render();await sleep(150);
}
function totemHits(sk,P){const al=alive();if(!al.length)return [];const H=[];
  const cur=al.find(e=>e.uid===C.target)||al.slice().sort((a,b)=>a.d-b.d)[0];
  switch(sk.fn){
    case 'far':{const d=Math.max(...al.map(e=>e.d)),t=pick(al.filter(e=>e.d===d));H.push({e:t,m:1,proj:1});const nx=al.filter(e=>e!==t).sort((a,b)=>b.d-a.d)[0];if(nx&&sk.pierce)H.push({e:nx,m:.7,proj:1});break;}
    case 'shrap':{const c=al.filter(e=>e.d>=1);const pool=c.length?c:al;for(let i=0;i<sk.n+sk.extra;i++)H.push({e:pick(pool),m:.4,proj:1});break;}
    case 'spark3':for(let i=0;i<3+sk.extra;i++)H.push({e:pick(al),m:1,proj:1});break;
    case 'none':break;
    default:{const tgt=inRange(sk,cur,P)?cur:al.filter(e=>inRange(sk,e,P)).sort((a,b)=>a.d-b.d)[0];if(!tgt&&!AREA_FN.has(sk.fn))break;H.push(...skillHits(sk,tgt||cur,P).H);}
  }
  return H;}
function hurtTotem(tm,e,raw,el,P,kind){
  let d=raw*rnd(.85,1.15)*enemyOut(e,P);const res=el==='chaos'?20:40+(P.t.totemRes||0);
  if(el==='phys')d*=1-clamp(P.t.totemPhysRed||0,0,75)/100;else d*=1-clamp(res,0,75)/100;

/* =========================================================

function sameChars(a,b){const k=x=>(x&&x.chars||[]).map(c=>c.id+':'+(c.t||0)).sort().join('|');return k(a)===k(b);}

/* облако Telegram: два слота (a/b) кусками по 3800 символов. Сначала пишется запасной слот, потом указатель —

    cs.getItems(part,(err,vals)=>{if(err||!vals)return cb(err||'empty');Object.assign(out,vals);next();});};next();}

/* ---- дальность и цели ---- */
const AREA_FN=new Set(['all0','slam','rain','escape','nova','spark','blight','cyclone','shrapnel','knives','flamedash','balllight']);
const MELEE_FN=['single0','infernal','lstrike','all0','slam','dstrike','molten','sunder','cyclone'];
const ALWAYS_FN=new Set(['flamedash']);
function inRange(sk,e,P){
  const reach=P.reach||0,a=sk.aoeR||0;
  switch(sk.fn){
    case 'single0':case 'infernal':case 'lstrike':case 'all0':case 'dstrike':case 'molten':case 'sunder':return e.d<=reach;
    case 'slam':case 'cyclone':return e.d<=1+a+reach;

}
/* внезапный удар: серия ударов по цели и врагам на соседних занятых дистанциях (через пустую дистанцию не перескакивает) */
function flickerChain(tgt,n){const al=alive(),lines=new Set(al.map(e=>e.d));let lo=tgt.d,hi=tgt.d;while(lines.has(lo-1))lo--;while(lines.has(hi+1))hi++;

function shiftAll(dv){C.enemies.forEach(e=>{if(e.hp>0)e.d=clamp(e.d+dv,0,3);});}

function dynMore(sk,P){
  let m=1;
  if(P.keys.has('berserk'))m*=1+(1-C.hp/P.life);
  if(sk.type==='attack'&&P.rage)m*=1+C.rage/100;
  if(P.curse)m*=1+P.curse/100;
  /* охлаждение на герое: урон меньше */
  if(C.chill>0)m*=1-.1*(1-clamp((P.t.chillEffYou||0)+(P.t.chillShockEffYou||0),0,100)/100);
  if(sk.type==='spell'&&P.t.spellMoreStunned&&C.turn-C.stunAt<=1)m*=1+P.t.spellMoreStunned/100;

function distMult(P,d){if(P.keys.has('pointblank'))return [1.3,1.15,1,.85][d];return d===0?.75:1;}
const ELS=['phys','fire','cold','light','chaos'];
/* есть ли на враге ваши отрицательные эффекты (для «враги под вашими недугами получают больше урона») */
const debuffed=e=>!!(e.st.ign||e.st.ign2||e.st.poi.length||e.st.bleed.length||e.st.chill||e.st.frozen||e.st.shock||e.st.curse||e.st.curse2||e.st.mark||e.st.wither||e.st.blind||e.st.maim||e.st.imp.length);
/* особые множители урона: значимые умения, возвышения, ключевые */
function exMore(sk,P,e,proj){
  const t=P.t;let m=1;const x=k=>t[k]?1+t[k]/100:1;
  if(t.ex_full&&e.hp>=e.maxHp)m*=x('ex_full');
  if(t.ex_exec&&e.hp<e.maxHp*.35)m*=x('ex_exec');
  if(t.ex_low&&C.hp<P.life*.5)m*=x('ex_low');
  if(t.ex_vsIgn&&(e.st.ign||e.st.ign2))m*=x('ex_vsIgn');
  if(t.ex_vsPoi&&e.st.poi.length)m*=x('ex_vsPoi');
  if(t.ex_vsShock&&e.st.shock)m*=x('ex_vsShock');
  if(t.ex_vsCurse&&(e.st.curse||e.st.curse2))m*=x('ex_vsCurse');
  if(t.ex_close&&e.d===0)m*=x('ex_close');
  if(t.ex_far&&proj&&e.d>=2)m*=x('ex_far');
  if(t.ex_boss&&(e.rar==='rare'||e.boss))m*=x('ex_boss');
  if(t.ex_ambush&&C.waveActs===0)m*=x('ex_ambush');
  if(t.ex_rampage)m*=1+Math.min(t.ex_rampage,C.kills)/100;
  if(t.ex_fullMana&&sk.type==='spell'&&P.mana>0&&C.mana>=P.mana*.8)m*=x('ex_fullMana');
  if(P.keys.has('pain')&&sk.type==='spell'&&C.hp<P.life*.35)m*=1.3;
  if(t.enemyDmgT&&debuffed(e))m*=x('enemyDmgT');

}
/* сопротивление врага стихии с учётом проклятий, уязвимости «Стихийного равновесия» и пробивания */
function enemyRes(e,el,hx,pen){
  if(el==='chaos')return clamp((e.res.chaos||0)+(hx.chaosRes||0)-(pen||0),-100,90);
  let r=(e.res[el]||0)+(hx.elemRes||0)-(pen||0);
  if(e.st.ee&&e.st.ee.els.includes(el))r-=25;
  return clamp(r,-100,90);
}
/* расчёт одного попадания без побочных эффектов (используется и мишенью) */
function rollHit(sk,P,e,m,proj,force){
  const hx=hexOn(e);
  let crit=sk.crit>0&&(Math.random()<sk.crit+(hx.critC||0)/100||force);
  const cm=(P.keys.has('overload')||sk.agony)?1:sk.critMult+(hx.critM||0)/100;
  const shockM=1+(P.U.u_shock40?.4:.2)*(1+(P.t.ex_shockEff||0)/100);
  let dm=dynMore(sk,P)*m*(crit?cm:1)*(e.st.shock?shockM:1)*exMore(sk,P,e,proj);
  if(proj)dm*=distMult(P,e.d)*(1+(hx.projT||0)/100);
  if(hx.dmgT)dm*=1+hx.dmgT/100;
  if(e.d===0&&P.pride)dm*=1+P.pride/100;
  if(e.st.chill&&sk.vsChill>1)dm*=sk.vsChill;
  if(e.st.shock&&sk.vsShock>1)dm*=sk.vsShock;
  if((e.st.ign||e.st.ign2)&&sk.vsIgn>1)dm*=sk.vsIgn;
  if(sk.ruthMul)dm*=sk.ruthMul;
  if(P.t.ex_dbl&&roll(P.t.ex_dbl))dm*=2;
  if(e.st.ward)dm*=.5;
  {const w=enemyAura(e,'ward');if(w)dm*=1-Math.min(60,w)/100;}
  if(e.totemAura)dm*=1+e.totemAura/100;
  let total=0;const parts={},raw={};const pen=sk.pen||{};
  if(sk.noDmg)return {total:0,crit:false,parts:{},raw:{}};
  for(const el in sk.dmg){let v=rnd(sk.dmg[el][0],sk.dmg[el][1])*dm;
    if(C&&C.eo>0&&el!=='phys'&&el!=='chaos')v*=1.4;
    raw[el]=v;
    if(el==='phys'){if(e.st.maim)v*=1.1;v*=1+(hx.physT||0)/100;const arm=e.arm*(1-(P.t.ex_armBreak||0)/100);v*=1-Math.min(.6,arm/(arm+10*v));}
    else{if(el==='chaos'&&e.st.wither)v*=1+.06*e.st.wither.n*(1+(P.t.witherEff||0)/100);
      if(el==='cold'&&P.keys.has('k_bitter')&&e.st.chill)v*=1.15;
      v*=1-enemyRes(e,el,hx,pen[el])/100;}
    v=Math.max(0,v);parts[el]=v;total+=v;}
  total=isFinite(total)?Math.max(1,R(total)):1;
  return {total,crit,parts,raw};
}
/* длительность состояния на герое */
function heroAilDur(P,base,kind){
  const t=P.t;let f=1-clamp((t.ailDurYou||0)+(t.ailDurYouPerFort||0)*(P.fort||0),0,90)/100;
  if(['ign','chill','freeze','shock'].includes(kind)){f*=1-clamp((t.elAilDurYou||0)+(P.keys.has('k_solip')?2*Math.floor(P.attr.int/15):0),0,90)/100;}
  if(kind==='ign')f*=(1+(t.ignDurYou||0)/100)*(1-(t.ignDurYouRed||0)/100);
  if(kind==='bleed')f*=1-(t.bleedDurYou||0)/100;

/* заряды */
function gainCharge(k,P,n=1){if(!C||!C.ch)return;const mx=P.chMax[k];if(mx<=0)return;

/* стоимость умения: «#% стоимости в мане берётся из здоровья» — умение тратит и ману, и здоровье */
function costSplit(sk,P,cost){
  if(sk.basic)return {m:0,l:0,es:0};
  if(sk.lifeCost)return {m:0,l:R(cost*1.5)};
  if(P.keys.has('blood'))return {m:0,l:cost};
  const s=clamp(((P.t.costLife||0)+(sk.type==='attack'?(P.t.costLifeAtk||0):0))/100,0,1);
  return {m:R(cost*(1-s)),l:R(cost*s)};
}
function payCost(sk,P,cost){

  if(!affordable(sk,P,cost))return costSplit(sk,P,cost).l?'Не хватает здоровья или маны':'Не хватает маны';
  const c=costSplit(sk,P,cost);C.hp-=c.l;
  if(P.keys.has('battery')){const fromEs=Math.min(C.es,c.m);C.es-=fromEs;C.mana-=c.m-fromEs;}else C.mana-=c.m;
  return null;

function affordable(sk,P,cost){cost=cost==null?sk.cost:cost;if(C.freeCast&&!sk.basic)return true;
  const c=costSplit(sk,P,cost);if(c.l&&C.hp<=c.l)return false;
  if(P.keys.has('battery'))return C.mana+C.es>=c.m;return C.mana>=c.m;}

/* урон со временем по врагу: поджоги, яды, кровотечение (вдвое сильнее, если враг двигался), сферы */
function enemyDots(e,P){
  const hx=hexOn(e),dm=1+(hx.dotT||0)/100;let fire=0,chaos=0,phys=0;
  [e.st.ign,e.st.ign2].forEach((ig,i)=>{if(!ig)return;fire+=ig.d;if(--ig.t<=0){if(i)e.st.ign2=null;else e.st.ign=null;}});
  let drain=0;e.st.poi.forEach(p=>{chaos+=p.d;p.t--;if(p.drain)drain++;});e.st.poi=e.st.poi.filter(p=>p.t>0);
  const mv=e.moved&&!P.keys.has('k_crimson');e.st.bleed.forEach(b=>{phys+=b.d*(mv?2:1);b.t--;});e.st.bleed=e.st.bleed.filter(b=>b.t>0);e.moved=false;
  if(drain)C.hp=Math.min(P.life,C.hp+P.life*.01*drain);
  const wi=e.st.wither?1+.06*e.st.wither.n*(1+(P.t.witherEff||0)/100):1;
  const eo=C.eo>0?1:1;
  let d=fire*dm*(1-enemyRes(e,'fire',hx,0)/100)+chaos*dm*wi*(1-enemyRes(e,'chaos',hx,0)/100)+phys*dm;
  if(P.t.enemyDmgT&&debuffed(e))d*=1+P.t.enemyDmgT/100;
  if(d>0){d=R(d);e.hp=Math.max(0,e.hp-d);fx(e.uid,fmt(d),'dot');logF(`${e.n}: ${fmt(d)} урона со временем${phys?' (кровотечение'+(mv?' ×2':'')+')':''}`);if(e.hp<=0)killEnemy(e,P);}
}
async function enemyPhase(P){
  if(!C||C.over)return;
  for(const e of alive())enemyDots(e,P);
  render();if(!alive().length){await waveCleared();return;}
  if(minions().length){await minionPhase(P);if(!C||C.over)return;if(!alive().length){await waveCleared();return;}await sleep(200);if(!C||C.over)return;}
  if(C.totems&&C.totems.some(t=>t.hp>0)&&typeof totemPhase==='function'){await totemPhase(P);if(!C||C.over)return;if(!alive().length){await waveCleared();return;}}
  if(C.orbs&&C.orbs.length&&typeof orbPhase==='function'){orbPhase(P);if(!C||C.over)return;if(!alive().length){await waveCleared();return;}}
  for(const e of alive()){
    if(!C||C.over)return;C.actor=e.uid;render();await sleep(260);
    if(!C||C.over||e.hp<=0)continue;
    const d0=e.d;enemyAct(e,P);if(e.d!==d0)e.moved=true;
    if(e.st.shock)e.st.shock--;if(e.st.chill)e.st.chill--;if(e.st.maim)e.st.maim--;if(e.st.ward)e.st.ward--;if(e.st.blind)e.st.blind--;if(e.st.impCD)e.st.impCD--;
    if(e.st.wither&&--e.st.wither.t<=0)e.st.wither=null;
    if(e.st.ee&&--e.st.ee.t<=0)e.st.ee=null;
    if(e.st.curse&&--e.st.curse.t<=0)e.st.curse=null;if(e.st.curse2&&--e.st.curse2.t<=0)e.st.curse2=null;
    if(e.regen&&e.hp>0&&!e.noHeal)e.hp=Math.min(e.maxHp,e.hp+e.maxHp*e.regen);
    {const md=enemyAura(e,'mend');if(md&&e.hp>0&&e.hp<e.maxHp&&!e.noHeal)e.hp=Math.min(e.maxHp,e.hp+e.maxHp*md/100);}
    render();if(!C)return;if(C.hp<=0){if(heroSave(P))continue;await death();return;}
  }
  if(!C||C.over)return;
  C.actor='hero';endRound(P);
  if(C.hp<=0){if(!heroSave(P)){await death();return;}}
  C.busy=false;render();
  if(!alive().length){await waveCleared();return;}
  /* оглушение или заморозка героя: пропуск хода. Защита от чейнстана — до следующего действия героя повторно не оглушат */
  if(C.stunned){const how=C.stunned===2?'заморожены':'оглушены';C.stunned=0;C.stunImm=true;
    if(P.t.stunRecover&&roll(P.t.stunRecover)){logC(`<span class="good-t">Вы сразу оправились: ход не пропущен</span>`);}
    else{logC(`<b class="bad-t">Вы ${how} и пропускаете ход</b>`);fx('me',how==='заморожены'?'Заморозка':'Оглушение','hurt');C.busy=true;render();await sleep(500);if(!C||C.over)return;await enemyPhase(calc());return;}}
  if(C.auto)scheduleAuto();
}
/* «Бдение смерти» Вождя: раз за бой смертельный удар оставляет 1 здоровья, если есть тотем — тотем погибает вместо вас */
function heroSave(P){if(!P.keys.has('k_chief_hinekora')||C.saved||!C.totems)return false;const tm=C.totems.find(t=>t.hp>0);if(!tm)return false;
  tm.hp=0;C.saved=true;C.hp=1;logC('<span class="good-t">Бдение смерти: тотем погибает вместо вас</span>');return true;}
/* порча боссов на герое слабее со свойством «проклятия врагов на вас слабее» */
const hexYou=(eff,P)=>{const f=1-clamp(P.t.curseYou||0,0,90)/100;const o={};for(const k in eff)o[k]=R(eff[k]*f*10)/10;return o;};
/* скорость врага: охлаждение −40%, увечье −30%, Темпоральные цепи −50%. Шаги копятся, поэтому замедленный враг всё равно подходит */
function enemySpeed(e,P){if(e.st.chill&&P.U.u_frostbind)return 0;const hx=hexOn(e);
  return e.sp*(e.st.chill?.6:1)*(e.st.maim?.7:1)*(hx.slowM||1);}
function enemyAct(e,P){
  if(e.st.frozen){e.st.frozen=0;logC(`${e.n} заморожен и пропускает ход`);return;}
  if(e.st.stun){e.st.stun=0;logC(`${e.n} оглушён и пропускает ход`);return;}
  const hx=hexOn(e);
  if(hx.skip3&&!e.boss){e.st.tc++;if(e.st.tc%3===0){logC(`${e.n} скован временем и пропускает ход`);return;}}
  if(e.boss){e.turn++;
    const ph=e.boss.phases&&e.boss.phases[e.phase||0];
    if(ph&&e.hp<e.maxHp*ph.at){e.phase=(e.phase||0)+1;logC(`<span class="boss-t">${ph.name}!</span>`);
      if(ph.summon)ph.summon.forEach(id=>{const m=mkEnemy(id,e.lvl-2,{d:ri(1,3),map:C.I.mt});m.maxHp=m.hp=R(m.hp*.28);m.dmg*=.75;m.summoned=1;m.boss={...m.boss,spec:m.boss.spec.slice(0,1)};C.enemies.push(m);});
      if(ph.ward){e.st.ward=ph.ward+1;}

    if(sp){logC(`<span class="boss-t">${e.n}: ${sp.name}!</span>`);
      if(sp.type==='pull'){hurtPlayer(e,e.dmg*sp.m,e.el,'ranged',P,false,e.mix);if(e.d>0){e.d=0;logC('Вас подтягивает вплотную');}return;}
      if(sp.type==='nuke'){hurtPlayer(e,e.dmg*sp.m*.5,e.el,'spell',P);hurtPlayer(e,e.dmg*sp.m*.5,sp.el,'spell',P);return;}
      if(sp.type==='summon'){const n=Math.min(sp.n,6-alive().length);for(let i=0;i<n;i++){const m=mkEnemy(sp.mon,e.lvl-1,{d:ri(2,3),map:C.I.mt});m.summoned=1;C.enemies.push(m);}return;}
      if(sp.type==='ward'){e.st.ward=sp.t+1;logC(`${e.n} получает вдвое меньше урона ${sp.t} хода`);return;}
      if(sp.type==='burn'){const el=sp.el||'fire',d=e.dmg*sp.m*(1-(P.res[el]||0)/100)*(C.cure?0:1);if(d>0){C.burn={d:R(d),t:sp.t};logC(`Земля под вами горит: ${fmt(d)} урона за ход, ${sp.t} хода`);}else logC('Очищение защищает вас');return;}
      if(sp.type==='hex'){const ef=hexYou(sp.eff,P);C.fb=C.fb.filter(b=>b.slot!=='hx'+e.uid);C.fb.push({slot:'hx'+e.uid,name:sp.name,eff:ef,turns:sp.t,bad:1});
        logC(`На вас: ${Object.entries(ef).map(([k,v])=>lbl(k,v)).join(', ')} на ${sp.t} хода`);return;}
      if(sp.type==='drain'){const m=R(C.mana*sp.p),es=R(C.es*sp.p);C.mana-=m;C.es-=es;hurtPlayer(e,e.dmg*.8,'chaos','spell',P);logC(`Выжжено: ${fmt(m)} маны${es?`, ${fmt(es)} щита`:''}`);return;}
    }
  }
  if(e.k==='melee'){
    if(e.d>0){const spd=enemySpeed(e,P);if(spd<=0){logF(`${e.n} скован льдом`);return;}
      e.mv+=spd;const st=Math.floor(e.mv);e.mv-=st;

    for(let h=0;h<e.hits;h++)enemyHit(e,e.dmg,e.el,'melee',P);return;

  if(e.retCD>0)e.retCD--;

  e.retN=0;

}
/* множитель урона врага от состояний: охлаждение, проклятия */
/* ауры врагов: действуют на союзников на своей и соседних дистанциях */
function enemyAura(e,k){let v=0;if(!C)return 0;for(const a of C.enemies)if(a.hp>0&&a.aura&&a.aura[k]&&Math.abs(a.d-e.d)<=1)v+=a.aura[k];return v;}
function enemyOut(e,P){const hx=hexOn(e);let m=1+enemyAura(e,'fury')/100;
  if(e.st.chill)m*=.85*(1-(P.t.ex_chillEff||0)/100);
  if(hx.weak)m*=1-(e.boss?hx.weak/2:hx.weak)/100;
  if(e.st.wither&&false)m*=1;
  return m;}
/* снижение урона по герою (без случайности — и для намерений врагов) */
function mitigate(raw,el,P,kind,out){
  let d=raw;const imb=P.keys.has('k_imbal');
  if(el==='phys'){const arm=P.armour*(imb?2:1);let red=Math.min(.75,arm/(arm+10*d))+(1-Math.min(.75,arm/(arm+10*d)))*P.physRed/100;if(imb)red=Math.min(.5,red);
    if(out)out.prev=(out.prev||0)+d*Math.min(.75,arm/(arm+10*d));d*=1-red;}
  else if(el==='chaos'&&P.keys.has('ci'))return 0;
  else{let r=P.res[el]||0;if(imb)r=Math.min(50,r);d*=1-r/100;}
  if(P.fort)d*=1-P.fort/100;
  if(P.dmgTaken)d*=1+P.dmgTaken/100;
  if(C&&C.shock>0)d*=1+.15*(1-clamp((P.t.shockEffYou||0)+(P.t.chillShockEffYou||0),0,100)/100);
  if(P.t.ex_lowDR&&C&&C.hp<P.life*.5)d*=1-P.t.ex_lowDR/100;
  if(P.keys.has('wind')&&kind!=='spell'&&C)d*=C.hitLast?1.2:.8;
  return d;
}
/* блок: свойства «при блоке» */
function onBlock(e,kind,P){
  if(P.U.u_blockHeal)C.hp=Math.min(P.life,C.hp+P.life*P.U.u_blockHeal/100);if(P.t.ex_blockDmg)C.blockBuff=Math.max(C.blockBuff,P.t.ex_blockDmg);
  if(P.t.lifeOnBlock&&!P.keys.has('vaal'))C.hp=Math.min(P.life,C.hp+P.t.lifeOnBlock);if(P.t.manaOnBlock)C.mana=Math.min(P.mana,C.mana+P.t.manaOnBlock);
  if(P.t.umOnBlock)C.um=Math.max(C.um,P.t.umOnBlock);
  if(P.t.endOnBlock&&roll(P.t.endOnBlock))gainCharge('end',P);if(P.t.powOnBlock&&roll(P.t.powOnBlock))gainCharge('pow',P);
  if(kind!=='spell'&&P.t.frzOnBlock&&roll(P.t.frzOnBlock))gainCharge('frz',P);if(kind==='spell'&&P.t.powOnSpellBlock&&roll(P.t.powOnSpellBlock))gainCharge('pow',P);}
const avoid=v=>v>0&&roll(Math.min(100,v));
/* состояния, которые враг накладывает на героя */
function heroAilments(e,pp,raw,kind,P,crit,sup){

  if(elOk&&pp.light>0&&roll(ch)&&!(t.immShockMaxPow&&maxC('pow'))&&!(t.noNdIfNd&&ndOn)&&!avoid((t.avoidAil||0)+(t.avoidShock||0))){C.shock=heroAilDur(P,2,'shock');logF('&nbsp;&nbsp;Вы шокированы');}

    const d=pp.phys*.15;if(!C.bleed.length||C.bleed[0].d<d){C.bleed=[{d,t:heroAilDur(P,4,'bleed'),t0:C.turn}];logF('&nbsp;&nbsp;Вы истекаете кровью');}}

}
/* оглушение героя: шанс от урона удара относительно порога (максимум здоровья); без чейнстана */
function heroStun(e,dmg,onlyPhys,P){

  if(avoid(P.avoidStun)||(C.lastSpell===C.turn&&avoid(t.avoidStunSpell||0))){logF('&nbsp;&nbsp;<span class="good-t">оглушение не прошло</span>');return;}
  C.stunned=1;C.stunAt=C.turn;logF('&nbsp;&nbsp;<b class="bad-t">Вы оглушены: пропустите ход</b>');

  if(t.lifeOnStunned&&!P.keys.has('vaal'))C.hp=Math.min(P.life,C.hp+P.life*t.lifeOnStunned/100);
  if(t.stunHitRecoup&&!P.keys.has('vaal'))C.hp=Math.min(P.life,C.hp+dmg*t.stunHitRecoup/100);

function hurtPlayer(e,raw,el,kind,P,crit,mix){

  if(kind!=='spell'&&roll(evadeChance(P,e.lvl,kind))){fx('me','Уклонение','');logF(`${where}: <span class="good-t">уклонение</span>`);
    if(P.t.ex_evadeCrit)C.nextCrit=true;if(P.t.ex_evadeDmg)C.evaBuff=Math.max(C.evaBuff,P.t.ex_evadeDmg);return;}
  if(kind==='spell'&&P.spellDodge&&roll(P.spellDodge)){fx('me','Уклонение','');logF(`${where}: <span class="good-t">уклонение от чар (Акробатика)</span>`);return;}

  if(blk){fx('me','Блок','');onBlock(e,kind,P);
    if(!P.keys.has('glancing')){logF(`${where}: <span class="good-t">${kind==='spell'?'блок чар':'блок'}</span>`);return;}glance=.65;logF(`${where}: <span class="good-t">скользящий блок</span>`);}
  const sup=kind==='spell'&&P.suppress&&roll(P.suppress);
  const base=raw*rnd(.85,1.15)*enemyOut(e,P)*glance*(sup?.5:1);
  const M=mix||{[el]:1},parts={};for(const k in M)parts[k]=(parts[k]||0)+base*M[k];
  if(e.fiery)parts.fire=(parts.fire||0)+base*e.fiery;
  if(C.impH.length&&kind!=='spell'){let x=0;C.impH.forEach(i=>{x+=i.d;i.n--;});C.impH=C.impH.filter(i=>i.n>0);parts.phys=(parts.phys||0)+x;}
  const pp={phys:0,fire:0,cold:0,light:0,chaos:0},out={};let dN=0,dC=0;
  for(const k in parts){const v=mitigate(parts[k],k,P,kind,out);pp[k]=v;if(k==='chaos')dC+=v;else dN+=v;}

  const absorbed=R(base-tot);

  if(P.t.totemShare&&C.totems){const tm=C.totems.find(x=>x.hp>0);if(tm){const sh=R(tot*P.t.totemShare/100);tm.hp=Math.max(0,tm.hp-sh);tot-=sh;if(tm.hp<=0)totemDies(tm,P);}}

  let toHp=tot-toEs;
  if(P.keys.has('mom')&&C.mana>0){const m=Math.min(C.mana,toHp*.4);C.mana-=m;toHp-=m;}
  if(P.keys.has('k_hiero_divine')&&C.mana>0){const m=Math.min(C.mana,toHp*.1);C.mana-=m;toHp-=m;}
  toHp=R(toHp);C.hp=Math.max(0,C.hp-toHp);C.hitThisPrev=C.hitThis;C.hitThis=true;

  if(sup)logF('&nbsp;&nbsp;Чары подавлены: половина урона');

  heroStun(e,shown,dC+(pp.fire+pp.cold+pp.light)<=0,P);
  heroAilments(e,pp,parts,kind,P,crit,sup);
  if(P.recoup&&C.hp>0&&!P.keys.has('vaal'))C.hp=Math.min(P.life,C.hp+shown*P.recoup/100);
  if(P.recoupM)C.mana=Math.min(P.mana,C.mana+shown*P.recoupM/100);
  if(P.rage)C.rage=Math.min(P.rageMax,C.rage+5);
  if(P.t.endOnHitTaken&&roll(P.t.endOnHitTaken))gainCharge('end',P);
  if(kind==='melee'&&P.t.ex_chillAtk&&e.hp>0){e.st.chill=2;}
  if(kind==='melee'&&P.t.ex_counter&&C.hp>0&&e.hp>0&&roll(P.t.ex_counter)&&!P.basic.bad){C.leechPool=0;logF('&nbsp;&nbsp;<b>Контратака</b>');const h=dealHit(P.basic,e,1,false,P);C.log.push(`Контратака! ${fmt(h.total)}`);if(P.t.counterFort)gainFort(3,P);}
  if(P.keys.has('k_chief_valako')&&C.totems&&C.totems.some(x=>x.hp>0)&&e.hp>0&&roll(20)){const v=R(P.life*.15*(1-enemyRes(e,'light',hexOn(e),0)/100));e.hp=Math.max(0,e.hp-v);fx(e.uid,fmt(v),'');logF(`&nbsp;&nbsp;Тотем отвечает молнией: ${fmt(v)}`);if(e.hp<=0)killEnemy(e,P);}

/* восстановление за ход: здоровье, мана, щит */
function regenTick(P,mult=1){
  const K=P.keys;
  const lowB=P.U.u_lowRegen&&C.hp<P.life/2?2:1,rg=K.has('vaal')?0:(P.life*P.regen/100+(P.regenF||0))*lowB*mult;
  if(K.has('zealot'))C.es=Math.min(P.es,C.es+rg);else C.hp=Math.min(P.life,C.hp+rg);
  C.mana=Math.min(P.mana,C.mana+(P.mreg+P.manaMax*.06)*mult);
  /* «Агностик»: 20% маны лечит на ту же величину */
  if(K.has('k_agnostic')&&C.hp<P.life&&C.mana>0){const m=Math.min(C.mana*.2,P.life-C.hp);C.mana-=m;C.hp+=m;}
  const before=C.es,cap=K.has('k_divshield')?P.armour:K.has('k_ghostdance')?P.eva:Infinity;
  let es=P.es*P.esRech*mult*(C.hitThis&&!K.has('k_wicked')?.5:1);
  if(K.has('k_youth')){C.hp=Math.min(P.life,C.hp+es);es=0;}
  if(K.has('k_divshield')&&C.phPrev)es+=(C.phPrev[0]+C.phPrev[1])*.03;
  if(K.has('k_hiero_sanct')&&C.mana>P.mana*.5)es+=Math.max(P.manaMax,1)*.03;
  C.es=Math.min(P.es,Math.max(before,Math.min(before+es,cap)));
}
/* урон со временем по герою: поджог, яд, кровотечение (вдвое сильнее, если вы двигались), Осквернённая кровь */
function heroDots(P){
  const lethe=P.keys.has('k_lethe'),f=(d,t0)=>d*(lethe&&t0!=null&&C.turn-t0<=1?.5:1);
  let n=0,ch=0;
  C.poison.forEach(p=>{ch+=f(p.d,p.t0);p.t--;});C.poison=C.poison.filter(p=>p.t>0);
  if(C.burn){n+=f(C.burn.d,C.burn.t0);if(--C.burn.t<=0)C.burn=null;}
  C.bleed.forEach(b=>{n+=f(b.d*(C.moved?2:1),b.t0);b.t--;});C.bleed=C.bleed.filter(b=>b.t>0);
  if(C.cb){n+=f(P.lifeMax*.006*C.cb.n,C.cb.t0);if(--C.cb.t<=0)C.cb=null;}
  let m=1-clamp((P.dotTaken||0)+(P.fort>=20?(P.t.dotTakenFort20||0):0),0,90)/100;
  n*=m;ch*=m;if(P.keys.has('ci'))ch=0;
  let tot=R(n+ch);if(!tot)return;
  let es=Math.min(C.es,R(n));C.es-=es;let hp=tot-es;
  C.hp=Math.max(1,C.hp-hp);fx('me','−'+tot,'dot');logF(`Урон со временем: −${tot}${es?` (щит −${es})`:''}`);
}
function endRound(P){
  heroDots(P);

  if(P.U.u_immolate){const d0=P.life*P.U.u_immolate/100;alive().filter(e=>e.d===0).forEach(e=>{const v=R(d0*(1-(e.res.fire||0)/100));e.hp=Math.max(0,e.hp-v);fx(e.uid,fmt(v),'dot');logF(`Саван жжёт ${e.n}: ${fmt(v)}`);if(e.hp<=0)killEnemy(e,P);});}
  if(C.eo)C.eo--;if(C.cure)C.cure--;if(C.stepCD)C.stepCD--;if(C.um)C.um--;if(C.adren)C.adren--;if(C.arcane)C.arcane--;if(C.chill)C.chill--;if(C.shock)C.shock--;
  /* заряды: срок общий для вида, по окончании остаётся минимум */
  CHG.forEach(k=>{if(C.chT[k]>0&&--C.chT[k]<=0&&C.ch[k]>P.chMin[k]){C.ch[k]=P.chMin[k];logF(`Заряды ${CHG_N[k]} иссякли`);}});
  if(C.fortN>0&&--C.fortT<=0){if(P.t.fortLossLife&&!P.keys.has('vaal'))C.hp=Math.min(P.life,C.hp+P.t.fortLossLife*C.fortN);C.fortN=0;logF('Укрепление закончилось');}
  if(P.keys.has('k_ghostdance')&&C.turn%2===0)C.shroud=Math.min(3,(C.shroud||0)+1);

  if(P.rage&&!P.U.u_rage&&!P.keys.has('k_chief_ramako'))C.rage=Math.max(0,C.rage-2);

}

/* ---- итог волны и боя ---- */
let pendingReward=null;
async function waveCleared(){
  C.busy=true;save();
  if(C.wave<C.waves){if(!C.I.dng)logC(`<b class="gold-t">Волна ${C.wave} зачищена</b>`);render();await sleep(700);if(!C||C.over)return;
    const P=calc();
    /* ход, в котором добита волна, тоже восстанавливает ману, здоровье и щит, плюс передышка между волнами */
    regenTick(P);C.mana=Math.min(P.mana,C.mana+P.mana*.15);
    if(P.t.ex_waveHeal){C.hp=Math.min(P.life,C.hp+P.life*P.t.ex_waveHeal/100);C.mana=Math.min(P.mana,C.mana+P.mana*P.t.ex_waveHeal/100);}
    if(P.t.ex_flaskWave)C.fl.forEach(f=>{if(!f)return;const st=flaskStats(S.equip[f.slot],P);f.ch=Math.min(st.max,f.ch+P.t.ex_flaskWave);});
    C.fb.forEach(b=>b.turns--);C.fb=C.fb.filter(b=>b.turns>0);
    if(C.ev&&C.ev.fight){if(evWaveDone())return;}

    spawnWave();C.busy=false;render();if(C.auto)scheduleAuto();return;}
  if(C.ev&&C.ev.fight){if(evWaveDone())return;}
  await battleWon();

async function battleWon(){

    }

  }else{

    else cont={type:'map',step:m.step};

async function death(){

/* ---- намерения врагов на следующий ход ---- */
function expHit(e,raw,P,kind,el){const M=el&&el!==e.el?{[el]:1}:e.mix||{[e.el]:1};let s=0;for(const k in M)s+=mitigate(raw*M[k],k,P,kind);if(e.fiery)s+=mitigate(raw*e.fiery,'fire',P,kind);return s;}
function intent(e,P){
  if(e.hp<=0)return null;
  if(e.st.frozen||e.st.stun)return {t:'Пропустит ход',c:'ok'};
  const hx=hexOn(e);if(hx.skip3&&!e.boss&&(e.st.tc+1)%3===0)return {t:'Пропустит ход',c:'ok'};
  const om=enemyOut(e,P),stn=e.stunner&&!P.keys.has('k_unwaver')?' ⚡':'';
  if(e.boss){const nt=e.turn+1;if(e.boss.heal&&!e.healed&&e.hp<e.maxHp*.5)return {t:'Исцелится',c:'warn'};
    const sp=e.boss.spec.slice().reverse().find(s=>nt%s.every===0);
    if(sp)return {t:`Готовит: ${sp.name}`+(sp.type==='nuke'||sp.type==='pull'?` ~${fmt((expHit(e,e.dmg*sp.m*.5,P,'spell')+expHit(e,e.dmg*sp.m*.5,P,'spell',sp.el||e.el))*om)}`:''),c:'bad'};}
  if(e.k==='melee'){
    if(e.d>0){const spd=enemySpeed(e,P);if(spd<=0)return {t:'Скован',c:''};const st=Math.floor(e.mv+spd);return st>0?{t:`Идёт → ${DIST[Math.max(0,e.d-st)].toLowerCase()}`,c:''}:{t:'Замедлен, не дойдёт',c:'ok'};}
    return {t:`Бьёт ~${fmt(expHit(e,e.dmg,P,'melee')*e.hits*om)}${stn}`,c:'warn'};}
  return {t:`${e.k==='ranged'?'Стреляет':'Колдует'} ~${fmt(expHit(e,e.dmg*(e.k==='ranged'?.9:1),P,e.k)*e.hits*om)}${stn}`,c:'warn'};
}

/* ---- автобой ---- */
let autoT=null;
function scheduleAuto(){clearTimeout(autoT);autoT=setTimeout(autoStep,window.FAST?0:450);}
function autoStep(){
  if(!C||!C.auto||C.busy||C.over)return;
  const P=calc();
  C.fl.forEach((f,k)=>{if(!f)return;const it=S.equip[f.slot],st=flaskStats(it,P);if(f.ch<st.use)return;
    if(st.type==='life'&&C.hp<P.life*.5)useFlask(k);
    else if(st.type==='hybrid'&&(C.hp<P.life*.5||C.mana<P.mana*.25))useFlask(k);
    else if(st.type==='mana'&&C.mana<P.mana*.3)useFlask(k);
    else if(st.type==='util'&&!C.fb.some(b=>b.slot===f.slot)&&(alive().some(e=>e.boss)||alive().length>=3||C.hp<P.life*.7))useFlask(k);});
  /* метка — бесплатно; проклятие — на сильную группу */
  const h=P.hex;
  if(h&&h.ok&&affordable({},P,h.cost)){
    if(h.kind==='mark'&&!alive().some(e=>e.st.mark)){const t=alive().sort((a,b)=>b.hp-a.hp)[0];if(t){C.target=t.uid;useHex();}}
    else if(h.kind==='curse'){const t=alive().slice().sort((a,b)=>b.hp-a.hp)[0];
      if(t&&!t.st.curse&&(t.boss||t.rar==='rare'||alive().filter(e=>Math.abs(e.d-t.d)<=1&&!e.st.curse).length>=3)){C.target=t.uid;return useHex();}}}
  for(const sk of P.skills){if(!sk||sk.bad||sk.fn!=='summon'||!affordable(sk,P))continue;const have=minions().filter(m=>m.slot===sk.slot);
    if(sk.mn.type==='spectre'){if(have.length<sk.mn.max&&bestCorpse())return useSkill(sk.slot);continue;}
    if(have.length<sk.mn.max-(sk.mn.per>1?1:0)||have.some(m=>m.t>0&&m.t<=1))return useSkill(sk.slot);}
  const usable=[0,1,2,3].map(i=>P.skills[i]).filter(sk=>sk&&!sk.bad&&!sk.move&&sk.fn!=='summon'&&affordable(sk,P)&&(AREA_FN.has(sk.fn)?canTarget(sk,P)&&!ALWAYS_FN.has(sk.fn):pickTarget(sk,P)));
  const pick_=usable.sort((a,b)=>b.avg*hitsGuess(b,P)-a.avg*hitsGuess(a,P))[0];
  const bestMelee=Math.max(0,...[0,1,2,3].map(i=>P.skills[i]).filter(sk=>sk&&!sk.bad&&MELEE_FN.includes(sk.fn)&&!canTarget(sk,P)).map(sk=>sk.avg));
  const cur=pick_?pick_.avg*hitsGuess(pick_,P):(pickTarget(P.basic,P)&&!P.basic.bad?P.basic.avg:0);
  const moveSk=[0,1,2,3].map(i=>P.skills[i]).find(sk=>sk&&!sk.bad&&sk.move&&affordable(sk,P));
  if(bestMelee>cur*2.2&&alive().some(e=>e.d>0)&&!alive().some(e=>e.d===0)){
    if(moveSk&&moveSk.fn==='leap'&&pickTarget(moveSk,P))return useSkill(moveSk.slot);return move(-1);}
  const meleeNear=alive().some(e=>e.d===0&&e.k==='melee');
  if(pick_&&pick_.cat!=='melee'&&bestMelee===0&&meleeNear&&alive().some(e=>e.d<3)){
    if(moveSk&&(moveSk.fn==='escape'||moveSk.fn==='flamedash')&&C.hp<P.life*.75)return useSkill(moveSk.slot);
    const canRet=minions().length<2&&alive().some(e=>e.d<3)&&(P.freeMove||P.U.u_freeRetreat||P.kite>=25||(C.hp<P.life*.6&&alive().filter(e=>e.d===0).length>=2&&C.turn-(C.lastRet||-9)>=3));
    if(canRet){C.lastRet=C.turn;return move(1);}}
  if(pick_)return useSkill(pick_.slot);
  if(moveSk&&moveSk.fn==='leap'&&pickTarget(moveSk,P))return useSkill(moveSk.slot);
  if(!P.basic.bad&&pickTarget(P.basic,P))return useSkill(-1);
  return move(-1);
}
function hitsGuess(sk,P){const al=alive();if(['all0','slam','rain','escape','nova','blight','band','knives','shrapnel'].includes(sk.fn))return Math.max(1,al.filter(e=>inRange(sk,e,P)).length*.9);
  if(sk.fn==='cyclone'||sk.fn==='balllight')return Math.max(1,al.filter(e=>inRange(sk,e,P)).length*.9)*sk.n*.4/.45;
  if(['split','arc','larrow','lstrike','molten','sunder','explosive'].includes(sk.fn))return Math.min(al.length,1+(sk.n||1)*.6+(sk.chain||0)*.6);

/* =========================================================
   ПРИСПЕШНИКИ: скелеты-воины, лучники, маги, призраки, стражи отпущения
   Приспешники стоят рядом с героем и действуют в начале хода врагов.
   Поддержки работают по меткам приспешника: ближний бой — на воинов, снаряды — на лучников, чары — на магов.
   ========================================================= */
const MN_BASE=11.5;
/* шаблон приспешника: урон, здоровье, предел — пересчитывается из текущих камней и снаряжения */
function minionTpl(A,L,o,P,spec){
  const M=A.minion,t=P.t,g=k=>t[k]||0,SM=spec?MONS[spec]:null;

  const el=SM?SM.el:M.el;

  const aegis=P.keys.has('aegis')&&P.shieldBlock;
  const mult=(o.mult||1)*o.more*(o.mMore||1)*(1+g('minionP')/100)*(1+g('minionMore')/100);
  const tpl={k,el,base,mult,elemMore:o.elemMore,physMore:o.physMore,chaosMore:o.chaosMore,xas:{...o.xas},
    crit:clamp(5*(1+(o.critInc+g('minionCrit'))/100),0,80)/100,critMult:1.5+(o.critM||0)/100,
    ail:{...o.ail},ignMore:(1+o.igniteMore)*o.dotMore,poiMore:(1+o.poisonMore)*o.dotMore,vsChill:o.vsChill,vsShock:o.vsShock,vsIgn:o.vsIgn,
    rep:o.move?1:o.rep,repMore:o.repMore,extra:k==='melee'?0:o.extra,area:M.type==='sentinel'?Math.max(0,o.aoeR||0):-1,
    knock:o.knock,maim:o.maim,cull:o.cull,leech:(o.leech||0)+((P.U&&P.U.u_minionLeech)||0),noAil:o.noAil,
    hp:R((40+10*S.lvl)*KH*(1+(g('minionLife')+(aegis?25:0))/100)*(o.mLife||1)),
    res:clamp(20+g('minionRes')+(o.mRes||0)+(aegis?15:0),-50,75),arm:R((S.lvl*6+20)*KH*(k==='melee'?2:1)),block:aegis?P.shieldBlock:0,
    max:M.max+g('minionN')+(o.mN||0)+(M.type==='spectre'&&L>=16?1:0),per:M.per,dur:M.dur?R((M.dur+g('minionDur'))*(1+g('skillDur')/100)):0,
    n:SM?'Призрак: '+SM.n:M.n,type:M.type,mtags:mTags(A,spec)};
  /* ауры героя действуют и на приспешников */
  const ma=P.mAura||{},av=(a,b)=>((ma[a]||0)+(ma[b]||0))/2;
  tpl.flat={fire:av('aFireMin','aFireMax'),light:av('aLightMin','aLightMax')};
  if(ma.hatred&&el==='phys')tpl.xas.cold=(tpl.xas.cold||0)+ma.hatred/100;
  const elInc={fire:ma.fireP,cold:ma.coldP,light:ma.lightP}[el];if(elInc)tpl.mult*=1+elInc/100;
  if(ma.zeal&&k==='spell')tpl.mult*=1+ma.zeal/100;
  if(ma.wrathMore&&el==='light')tpl.mult*=1+ma.wrathMore/100;
  if(ma.dotMore){tpl.ignMore*=1+ma.dotMore/100;tpl.poiMore*=1+ma.dotMore/100;}
  if(ma.critP||ma.zealCrit)tpl.crit=clamp(tpl.crit*(1+((ma.critP||0)+(k==='spell'?ma.zealCrit||0:0))/100),0,.8);

  C.minions.forEach(m=>{const tp=tplOf(m,P);if(tp&&tp.regen&&m.hp<m.maxHp)m.hp=Math.min(m.maxHp,m.hp+R(m.maxHp*tp.regen/100));});

    const al=alive(),cur=al.find(e=>e.uid===C.target);
    const reach=al;
    const tgt=cur&&reach.includes(cur)?cur:reach.slice().sort((a,b)=>a.d-b.d||a.hp-b.hp)[0];
    for(let r=0;r<tpl.rep;r++){

function applyOrb(it,k){
  if(it.mirrored){toast('Отражённый предмет нельзя изменить');return false;}
  if(it.pend&&k!=='mirror'){toast('Сначала выберите свойство для сферы временного костыля');return false;}
  if(k==='annul'||k==='mirror'||k==='crutch')return specialOrb(it,k);
  if(it.legacy&&LEGACY_LOCK.has(k)){toast('Предмет Legacy: эта сфера недоступна, чтобы не менять старые свойства');return false;}
  if(!(S.cur[k]>0)||!ORBS[k].ok(it))return false;
  if(k==='regal'&&it.slot==='flask'){toast('Флакон не может быть редким');return false;}
  if(k==='exalt'&&!afxFree(it)){toast('Нет места для свойства');return false;}
  S.cur[k]--;
  const flask=it.slot==='flask';
  if(k==='trans'){it.rar='magic';rollMods(it,ri(1,2));}
  if(k==='aug')rollMods(it,1);
  if(k==='alt'){it.mods=[];rollMods(it,ri(1,2));}
  if(k==='regal'){it.rar='rare';delete it.rname;rollMods(it,1);}
  if(k==='scour'||k==='chaos'||k==='alt'||k==='alch'||k==='trans'){it.afx=1;delete it.legacy;}
  if(k==='alch'){if(flask){it.rar='magic';rollMods(it,2);}else{it.rar='rare';delete it.rname;rollMods(it,rareN(it.ilvl));}}
  if(k==='chaos'){it.mods=[];delete it.rname;rollMods(it,rareN(it.ilvl));}
  if(k==='scour'){it.mods=[];it.rar='normal';delete it.rname;}
  if(k==='divine'){if(flask)it.mods.forEach(m=>{if(!m.cr)m.v=ri(FMODS[m.k].r[0],FMODS[m.k].r[1]);});else afxReroll(it);}

}

const anyLabOpen=()=>[0,1,2,3].some(n=>!labUnlock(n));
/* чередование: зал стражей → комната-испытание на выбор. Фонтан и тёмное святилище — боковые проходы, не тратят комнату */
function genLab(n){
  const R_=LABS[n].rooms,W={trap:2.2+.2*n,puzzle:1.6+.2*n,switch:1.6+.2*n,vault:1.1},steps=[],side=[];
  for(let i=0;i<R_;i++){
    if(i%2===0){steps.push(['fight']);}
    else{const k=i%4===1?3:2,opts=[];
      while(opts.length<k){let tot=0;const pool=Object.keys(W).filter(t=>!opts.includes(t)&&!(i===1&&t==='vault'));pool.forEach(t=>tot+=W[t]);let r=Math.random()*tot;
        for(const t of pool){r-=W[t];if(r<=0){opts.push(t);break;}}}
      steps.push(shuffle(opts));}
    const sd=[];if(i>0&&(i===R_-1||roll(30-5*n)))sd.push('font');if(i>0&&roll(14))sd.push('shrine');side.push(sd);
  }
  return {steps,side};
}
function enterLab(n){

}
function labLog(t){const L=S.labRun;if(L){L.log.push(t);if(L.log.length>12)L.log.shift();}}

/* сложность испытаний растёт от лабиринта к лабиринту */
const LAB_DIFF=[{traps:3,need:0,hurt:0,syms:4,len:3,tries:5},{traps:3,need:8,hurt:.03,syms:5,len:3,tries:5},{traps:4,need:16,hurt:.05,syms:5,len:4,tries:6},{traps:4,need:26,hurt:.07,syms:6,len:4,tries:6}];

function trapNeed(){return R(20+LABS[S.labRun.n].lvl*1.1+labDiff().need);}
function trapChance(a){const P=calc();return clamp(R(40+(P.attr[a]-trapNeed())*1.5),10,95);}
function labHurt(f){const L=S.labRun;L.hp=Math.max(0,L.hp-f);if(L.hp<=0){labFail();return true;}return false;}

function labFail(){S.labRun=null;S.deaths++;labFailNote='Вы пали в лабиринте. Попробуйте снова — лабиринт каждый раз перестраивается.';save();}
function labChoose(i,sideK){

  if(type==='switch'){let st;do{st=[...Array(8)].map(()=>roll(50)?1:0);}while(st.every(x=>x));
    const opt=switchOpt(st);L.room={type,st,start:st.slice(),presses:0,max:opt+[5,4,3,2][L.n],opt,state:'play'};save();return;}
  if(type==='fight'){L.room={type};save();startBattle({type:'lab'});return;}
  if(type==='trap'){L.room={type,traps:shuffle(TRAPS).slice(0,labDiff().traps),i:0,res:[]};}
  if(type==='puzzle'){const D=labDiff();L.room={type,k:D.syms,secret:shuffle([...Array(D.syms).keys()]).slice(0,D.len),tries:[],cur:[],max:D.tries,state:'play'};}
  if(type==='shrine'){L.room={type,side:sideK?1:0,opts:shuffle(SHRINES.map((_,j)=>j).filter(j=>!L.buffs.includes(j))).slice(0,2)};}
  if(type==='font'){L.hp=1;L.fl=null;labLog('Фонтан исцелил вас и наполнил флаконы');L.room={type,done:1,side:1};}
  if(type==='vault'){if(L.keys>0){L.keys--;const P=calc(),got=[];
      for(let j=0;j<2;j++){const it=Math.random()<.25?makeUnique(LABS[L.n].lvl):makeItem(rollSlot()==='flask'?'ring':rollSlot(),LABS[L.n].lvl,'rare');
        if(S.inv.length<INV_MAX){S.inv.push(it);it.isNew=1;got.push(it.name);}}

}
function labTrap(j){

/* Восемь переключателей: нажатие меняет себя и двух соседей по кольцу */
const swPress=(st,i)=>{[i-1,i,i+1].forEach(k=>{const q=(k+8)%8;st[q]=st[q]?0:1;});};
function switchOpt(st){let best=99;for(let m=0;m<256;m++){const t=st.slice();let n=0;for(let i=0;i<8;i++)if(m>>i&1){swPress(t,i);n++;}if(t.every(x=>x)&&n<best)best=n;}return best;}

/* ---------- аукцион ----------
   Без сервера: лоты хранятся в аккаунте и видны всем вашим персонажам (один выставляет, другой покупает).
   С сервером (AUCTION_URL): лоты общие для всех игроков; продавец определяется по Telegram-аккаунту,
   поэтому удаление персонажа не трогает выставленные и проданные вещи. Комиссии нет. */
const AUC_TAX=0;
const AUC={
  mode(){return AUCTION_URL&&tg&&tg.initData?'server':'local';},
  async req(path,opt={}){
    const r=await fetch(AUCTION_URL.replace(/\/$/,'')+path,{method:opt.method||'GET',headers:{'Content-Type':'application/json','X-Tg-Init-Data':tg.initData},body:opt.body?JSON.stringify(opt.body):undefined});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Ошибка сервера '+r.status));return j;},
  async list(){
    if(this.mode()==='local')return ACC.auc.lots.filter(l=>!l.sold).map(l=>({...l,mine:l.seller.cid===S.id}));
    return (await this.req('/lots')).lots;},
  async mine(){
    if(this.mode()==='local')return {lots:ACC.auc.lots.filter(l=>!l.sold),sold:ACC.auc.lots.filter(l=>l.sold).slice(-15).reverse(),purse:ACC.aucGold||0};
    return await this.req('/me');},
  async post(it,price){
    if(this.mode()==='local'){ACC.auc.t=Date.now();ACC.auc.lots.push({id:'L'+(++ACC.auc.seq),item:it,price,seller:{cid:S.id,name:S.name},ts:Date.now()});return;}
    await this.req('/lots',{method:'POST',body:{item:it,price,seller:S.name}});},
  async buy(id){
    if(this.mode()==='local'){const l=ACC.auc.lots.find(x=>x.id===id&&!x.sold);if(!l)throw new Error('Лот уже продан');
      if(l.seller.cid===S.id)throw new Error('Это лот этого же персонажа. Купите его другим персонажем или снимите с продажи');
      ACC.auc.t=Date.now();l.sold=true;l.buyer=S.name;l.soldAt=Date.now();ACC.aucGold=(ACC.aucGold||0)+R(l.price*(1-AUC_TAX));
      const it=l.item;l.item={name:it.name,rar:it.rar};
      const sold=ACC.auc.lots.filter(x=>x.sold);if(sold.length>30){const drop=new Set(sold.slice(0,sold.length-30));ACC.auc.lots=ACC.auc.lots.filter(x=>!drop.has(x));}
      return it;}
    return (await this.req('/lots/'+encodeURIComponent(id)+'/buy',{method:'POST',body:{buyer:S.name}})).item;},
  async cancel(id){
    if(this.mode()==='local'){const l=ACC.auc.lots.find(x=>x.id===id&&!x.sold);if(!l)throw new Error('Лот не найден');ACC.auc.t=Date.now();ACC.auc.lots=ACC.auc.lots.filter(x=>x!==l);return l.item;}
    return (await this.req('/lots/'+encodeURIComponent(id)+'/cancel',{method:'POST'})).item;},
  async claim(){
    if(this.mode()==='local'){ACC.auc.t=Date.now();const g=ACC.aucGold||0;ACC.aucGold=0;return g;}
    return (await this.req('/claim',{method:'POST'})).gold||0;},
};
/* выдаём вещи с аукциона новым uid, чтобы не было совпадений между игроками */
function aucReceive(it){const c=JSON.parse(JSON.stringify(it));c.uid=newUid();c.isNew=1;delete c.fav;afxMigrate(c);return c;}

/* ---------- Подземелье: волны без конца, пока герой жив ----------
   Монстры с 83 уровня и с каждой волной сильнее; число врагов растёт до 15.
   Награды за убийства урезаны (золото, вещи, сферы — 35%), зато каждые 5 волн — сундук со сферами, каждые 10 — карта. */
const DNG_LVL=83,DNG_LOOT=.35;
const dngCount=w=>Math.min(15,3+Math.floor((w-1)/2));
const dngScale=w=>Math.pow(1.07,w-1);
const dngLvl=w=>Math.min(90,DNG_LVL+Math.floor((w-1)/5));
function startDungeon(){if(!S.done)return false;S.dng={pool:shuffle(ALL_MOBS).slice(0,4)};save();startBattle({type:'dng'});return true;}
function dngWave(){const w=C.wave,lvl=dngLvl(w),sc=dngScale(w);
  if(w>1&&(w-1)%5===0)S.dng.pool=shuffle(ALL_MOBS).slice(0,4);
  const rareC=Math.min(55,12+w*1.5),magC=35;
  const n=dngCount(w);
  for(let i=0;i<n;i++){const r=Math.random()*100,rar=r<rareC?'rare':r<rareC+magC?'magic':'normal';
    const e=mkEnemy(pick(S.dng.pool),lvl,{rar,map:16});e.maxHp=e.hp=R(e.hp*sc);e.dmg*=Math.pow(1.045,w-1);C.enemies.push(e);}
  if(w%10===0){const b=mkEnemy(pick(BOSSES),lvl+1,{map:16});b.maxHp=b.hp=R(b.hp*sc);b.dmg*=Math.pow(1.045,w-1);C.enemies.push(b);logC(`<span class="boss-t">${b.n}</span> стережёт ${w}-ю волну!`);}
  logC(`<b>Подземелье · волна ${w}</b>: ${C.enemies.length} врагов, уровень ${lvl}`);
  C.target=null;autoTarget();}
function dngCleared(){const w=C.wave;S.dngBest=Math.max(S.dngBest||0,w);
  logC(`<b class="gold-t">Волна ${w} пройдена</b>${w===S.dngBest?' · новый рекорд':''}`);
  if(w%5===0){const pool=['chaos','chaos','alch','regal','alt','annul','exalt','divine'],n=1+Math.floor(w/15);
    for(let i=0;i<n;i++)addOrb(w>=20&&roll(30)?pick(['exalt','divine','annul']):pick(pool));}
  if(w%10===0)addMap(Math.min(16,1+Math.floor(w/4)));
  save();}
let dngTop=null,dngTopAt=0;
function dngFetch(){if(!srvOn()||Date.now()-dngTopAt<30000)return;dngTopAt=Date.now();srvReq('/dungeon').then(r=>{dngTop=r.best||null;if(screen==='sub'&&sub==='dungeon')render();}).catch(()=>{});}

function initTG(){

  if(screen==='select'&&ACC.chars.length){screen='roster';render();return;}

  if(e.st.frozen)c.push(['Лёд','var(--cold)']);else if(e.st.chill)c.push(['Холод','var(--cold)']);if(e.st.shock)c.push(['Шок','var(--light)']);if(e.st.stun)c.push(['Оглушён','var(--phys)']);if(e.st.maim)c.push(['Увечье','var(--phys)']);

function minionRow(){const ms=minions(),ts=typeof totems==='function'?totems():[];if(!ms.length&&!ts.length)return '';

function compareWith(it,slot){

  const P1=calc();S.equip[slot]=old;if(oo)S.equip.offhand=oo;if(!old)delete S.equip[slot];
  const rows=[['Здоровье',P0.life,P1.life],['Энерг. щит',P0.es,P1.es],['Мана',P0.mana,P1.mana],['Броня',P0.armour,P1.armour],['Уклонение',P0.eva,P1.eva],['Блок',P0.block,P1.block],
    ['Сопр. огню',P0.res.fire,P1.res.fire],['Сопр. холоду',P0.res.cold,P1.res.cold],['Сопр. молнии',P0.res.light,P1.res.light],['Сопр. хаосу',P0.res.chaos,P1.res.chaos],

  const d=rows.filter(r=>R(r[1])!==R(r[2]));

function isUpgrade(it){try{if(it.slot==='flask'||!itemOk(it))return false;const sl=slotsFor(it)[0];if(equipBlock(it,sl))return false;

  let h=`<div class="stack">${subHead('Торговец',S.done?'Убежище':ACTS[actOfProg()].camp)}

  if(shopTab==='items'){
    const CATS=[['all','Всё',null],...INV_TABS],T=CATS.find(t=>t[0]===shopCat)||CATS[0],items=stock.filter(x=>!T[2]||T[2].includes(x.slot));

      <div class="row" style="margin-top:10px"><span class="dim small sp">Товар обновляется с каждым уровнем героя</span><button class="btn sm" data-a="shopRefresh" ${S.gold>=shopRefreshCost()?'':'disabled'}>Обновить · ${fmt(shopRefreshCost())}</button></div></div>`;
  }else if(shopTab==='sell'){

    const sum=a=>a.reduce((s,x)=>s+sellPrice(x),0);
    h+=`<div class="panel"><div class="eyebrow" style="margin-bottom:8px">Продать оптом (кроме избранного ★)</div>
      <div class="sellgrid">${grp.map(([r,n])=>{const g=sellGroup(r);return `<button class="btn ${r==='all'?'danger':''}" data-a="${r==='all'?'sellAllAsk':'sellBulk'}" data-r="${r}" ${g.length?'':'disabled'}>Продать ${n}<br><small class="num">${g.length} шт. · ${fmt(sum(g))} зол.</small></button>`;}).join('')}</div>
      ${sellAllAsk?`<p class="notice" style="margin-top:8px">Продать все ${sellGroup('all').length} вещей, кроме избранных, за ${fmt(sum(sellGroup('all')))} зол.?</p><div class="row" style="margin-top:6px"><button class="btn sp" data-a="sellAllNo">Отмена</button><button class="btn sp danger" data-a="sellBulk" data-r="all">Продать всё</button></div>`:''}
      <p class="dim small" style="margin:10px 0 0">Чтобы ненужное вообще не попадало в сумку, настройте лутфильтр внизу вкладки «Снаряжение».</p></div>
      <div class="panel"><div class="eyebrow" style="margin-bottom:8px">Сумка · ${S.inv.length}/${INV_MAX}</div>
      <div class="list">${sortInv(S.inv).map(x=>`<div class="sellrow"><button class="irow" data-a="itemInv" data-u="${x.uid}"><span class="sl">${x.fav?'<b class="gold-t">★</b> ':''}${slotLabel(x)} · ${x.ilvl}</span><span class="in r-${x.rar}">${esc(dispName(x))}</span></button><button class="btn sm" data-a="sellOne" data-u="${x.uid}">${fmt(sellPrice(x))}</button></div>`).join('')||'<span class="dim">Сумка пуста</span>'}</div></div>`;
  }else if(shopTab==='gems'){
    const all=[['melee','Ближний бой',ACTIVE_IDS.filter(id=>GEMS[id].cat==='melee')],['ranged','Дальний бой',ACTIVE_IDS.filter(id=>GEMS[id].cat==='ranged')],['spell','Заклинания',ACTIVE_IDS.filter(id=>GEMS[id].cat==='spell'&&!GEMS[id].minion)],['totem','Тотемы',ACTIVE_IDS.filter(id=>GEMS[id].cat==='totem')],['minion','Приспешники',ACTIVE_IDS.filter(id=>GEMS[id].cat==='minion'||GEMS[id].minion)],['hex','Метки и порчи',HEX_IDS],['aura','Ауры',AURA_IDS],['sup','Поддержка',SUPPORT_IDS]];
    if(!shopGem)shopGem=GEMS[CLASSES[S.cls].gem].cat;
    const SH={melee:'Ближний',ranged:'Дальний',spell:'Чары',totem:'Тотемы',minion:'Призыв'};
    h+=`<div class="seg3">${all.map(([k,n,ids])=>`<button class="${shopGem===k?'on':''}" data-a="sgem" data-t="${k}" aria-label="${n}">${SH[k]||n} · ${ids.length}</button>`).join('')}</div>`;
    const groups=all.filter(g=>g[0]===shopGem).map(g=>[g[1],g[2]]);
    h+=`<p class="muted small" style="margin:0">Все камни продаются 1 уровня. Камни, открытые вашему герою по ходу прокачки, — уровня ${Math.min(15,newGemLvl())} (до 15 к концу актов).${S.done?'':' Умения другого класса заработают после кампании.'}</p>`;
    if(shopGem==='sup'){const acts=ACTIVE_IDS.filter(id=>allowed(id)),mine=new Set(S.skills.map(x=>gem(x.a)).filter(Boolean).map(g=>g.id));
      h+=`<div class="panel"><input class="input qf" type="search" data-k="sup" data-for="supL" placeholder="Поиск по названию и описанию" autocomplete="off">
        <label class="stack" style="gap:4px;margin-top:8px"><span class="eyebrow">Подходит к умению</span><select class="input qf" data-k="sup"><option value="">любому</option>${[...acts].sort((a,b)=>(mine.has(b)?1:0)-(mine.has(a)?1:0)).map(id=>`<option value="${id}" ${QF.supFit===id?'selected':''}>${mine.has(id)?'★ ':''}${gdef(id).n}</option>`).join('')}</select></label>
        <div class="dim small" style="margin-top:6px">Найдено: <b id="supL_n"></b> · ★ — ваши умения</div></div>`;}
    groups.forEach(([n,ids])=>{const list=ids.slice().sort((a,b)=>(obtainable(b)?1:0)-(obtainable(a)?1:0)||(allowed(b)?1:0)-(allowed(a)?1:0));if(!list.length)return;
      h+=`<div class="panel"><div class="ph"><h2>${n}</h2></div><div class="list" ${shopGem==='sup'?'id="supL"':''}>${list.map(id=>{const G=gdef(id),p=gemPrice(id),L=shopGemLvl(id);
        return `<div class="gemb" ${shopGem==='sup'?`data-qt="${esc((G.n+' '+(G.d||'')).toLowerCase())}" data-fit="${supFitList(id).join(' ')}"`:''}><button class="gemi" data-a="gemInfo" data-id="${id}">${gemIcon(id)}<span class="gt"><b>${G.n}</b><small>ур. ${L} · ${gemWeaponShort(id)}${allowed(id)?'':' · <span class="bad-t">после кампании</span>'} · <span class="gold-t">подробнее</span></small></span></button><button class="btn sm" data-a="buyGem" data-id="${id}" ${S.gold>=p?'':'disabled'}>${fmt(p)}</button></div>`}).join('')}</div></div>`;});
  }else{
    h+=`<div class="panel"><p class="muted" style="margin:0 0 10px">Сбросить все пассивные умения и вернуть очки. Отдельный узел можно забыть прямо в древе.</p>
      <button class="btn full" data-a="resetTree" ${S.gold>=treeResetCost()&&S.alloc.length>1?'':'disabled'}>Сбросить древо · ${fmt(treeResetCost())} зол.</button></div>
      <div class="panel"><p class="muted" style="margin:0 0 10px">Вернуть очки возвышения (само возвышение не меняется).</p>
      <button class="btn full" data-a="resetAsc" ${S.gold>=ascResetCost()&&S.ascAlloc.length?'':'disabled'}>Сбросить возвышение · ${fmt(ascResetCost())} зол.</button></div>`;
  }
  return h+'</div>';
}

/* ---------- подробное описание камня (торговец) ---------- */
const TAG_N={totem:'тотем',bow:'лук',orb:'сфера',aura:'аура',minion:'приспешники',attack:'атаки',spell:'чары',melee:'ближний бой',proj:'снаряды',area:'область',chain:'цепь',strike:'удар',slam:'удар по земле',move:'передвижение',channel:'поддержание',fire:'огонь',cold:'холод',light:'молния',chaos:'хаос',phys:'физический',any:'любые умения'};
const weaponsFor=cat=>Object.keys(WEAP).filter(wk=>SKILL_WEAPON[cat]({wk})).map(wk=>WEAP[wk].n);
function gemWeaponShort(id){const G=gdef(id);if(G.cat==='minion')return 'Призыв, оружие не нужно';if(GEMS[id]&&!G.sup)return G.noWeapon||G.cat==='totem'&&!G.wcat?'Оружие не нужно':'Нужно: '+SKILL_WEAPON_N[G.wcat||G.cat];if(GEMS[id])return 'Поддержка: '+G.req.map(t=>TAG_N[t]||t).join(', ');return isAura(id)?'Аура, без оружия':'Без оружия';}
/* базовый урон активного камня на уровне L */
function gemDmgAt(id,L){const G=GEMS[id],o=baseO();G.make(o,L);
  if(G.fn==='summon')return `${R(MN_BASE*SPELL_BASE*gsc(L,1.2)*G.minion.K)}`;
  if(G.cat==='spell'||G.spellLike){if(!G.base||!G.base[1])return '—';const sc=SPELL_BASE*gsc(L,1.2)*o.mult;return `${R(G.base[0]*sc)}–${R(G.base[1]*sc)}`;}
  return `${R(o.mult*100)}%`;}
function gemDmgLine(id,cur){const G=GEMS[id];if(!G||G.sup||!G.make)return '';const lv=[...new Set([1,...(cur&&cur>1?[cur]:[]),20])].sort((a,b)=>a-b);
  return `Базовый урон${G.fn==='summon'?' приспешника за удар':G.cat==='spell'?` (${EL[G.el]})`:' (от урона оружия)'}: ${lv.map(l=>`<span class="${l===cur?'gold-t':''}">ур. ${l} — <b class="num">${gemDmgAt(id,l)}</b></span>`).join(' · ')}`;}
function gemInfo(id,uid){
  const G=gdef(id),P=calc(),own=uid?gem(uid):null,sup=GEMS[id]&&G.sup,act=GEMS[id]&&!sup;
  const LV=own?gemLevel(own,P,act?GEMS[id]:null):null,L=own?LV.L:shopGemLvl(id),p=gemPrice(id);
  const kind=act?CAT_N[G.cat]:sup?'Камень поддержки':isAura(id)?'Аура':G.kind==='mark'?'Метка':'Проклятие';
  const need=gemAttrReq(own?own.lvl:L,sup),have=P.attr[G.c];
  let rows=`<div><span>Тип</span><span>${kind}</span></div><div><span>${own?'Уровень':'Уровень при покупке'}</span><span>${L}</span></div>`;
  if(own){rows+=`<div class="sub"><span>Базовый уровень</span><span>${LV.base}${LV.base>=GEM_MAX?' (макс.)':''}</span></div>`;
    if(LV.items>0)rows+=`<div class="sub"><span>от предметов</span><span>+${LV.items}</span></div>`;
    if(LV.sup>0)rows+=`<div class="sub"><span>от камней поддержки</span><span>+${LV.sup}</span></div>`;
    if(LV.glob>0)rows+=`<div class="sub"><span>от глобальных свойств</span><span>+${LV.glob}</span></div>`;}
  rows+=`<div><span>Требует</span><span class="${have>=need?'':'bad-t'}">${ATTR[G.c]} ${need} (у вас ${have})</span></div>`;
  let body='';
  if(act){const ok=P.weapons.some(w=>SKILL_WEAPON[G.wcat||G.cat](w.it)),o=baseO();G.make(o,L);
    rows+=`<div><span>${G.fn==='summon'?'Призыв':'Дальность'}</span><span>${G.rng}</span></div><div><span>Расход маны</span><span>~${R(o.cost+L*.6)}</span></div>`;
    if(G.fn==='act'||G.fn==='summon'||G.base||G.make)[...new Set([1,L,20,...(L>20?[L]:[])])].sort((a,b)=>a-b).forEach(l=>{rows+=`<div><span>${G.cat==='spell'||G.spellLike?'Базовый урон':'Урон от оружия'} · ур. ${l}${l===L?(own?' (сейчас)':' (покупка)'):''}</span><span>${gemDmgAt(id,l)}${(G.cat==='spell'||G.spellLike)&&G.el?' '+EL[G.el]:''}</span></div>`;});
    body+=`<div class="panel"><div class="eyebrow" style="margin-bottom:4px">Оружие</div><p style="margin:0">Нужно: <b>${G.noWeapon?'не нужно':SKILL_WEAPON_N[G.wcat||G.cat]}</b>.</p>
      <p class="small ${ok||G.noWeapon?'good-t':'bad-t'}" style="margin:6px 0 0">${ok||G.noWeapon?'С вашим текущим оружием работает.':'С вашим текущим оружием не работает: '+(P.weapons.map(w=>WEAP[w.wk].n).join(' + ')||'нет оружия')+'.'}</p></div>`;
    body+=`<p class="small muted" style="margin:0">Метки умения: ${G.tags.map(t=>TAG_N[t]||t).join(', ')}. Поддержки подходят по этим меткам. Гнёзда поддержки открываются уровнем камня: ${SOCK_LVL.map((l,i)=>`${i+1} — с ${l} ур.`).join(', ')}.</p>`;}
  else if(sup){const mine=S.skills.map(s=>gem(s.a)).filter(Boolean).filter(g=>supFits(G,fitOf(GEMS[g.id]))).map(g=>GEMS[g.id].n);
    body+=`<div class="panel"><div class="eyebrow" style="margin-bottom:4px">Эффект</div><p style="margin:0">${G.e(L)}</p></div>
      <div class="panel"><div class="eyebrow" style="margin-bottom:4px">С чем работает</div><p style="margin:0">Вставляется в гнездо активного умения с метками: <b>${G.req.map(t=>TAG_N[t]||t).join(', ')}</b>. Своего оружия не требует — работает с тем, что нужно самому умению.</p>
      <p class="small ${mine.length?'good-t':'muted'}" style="margin:6px 0 0">${mine.length?'Подходит к вашим умениям: '+mine.join(', '):'К вставленным сейчас умениям не подходит.'}</p></div>`;}
  else{body+=`<div class="panel"><div class="eyebrow" style="margin-bottom:4px">Эффект</div><p style="margin:0">${isAura(id)?G.e(L,1)+'. Резерв маны '+G.res+'%.':G.e(L)+'.'}</p>
      <p class="small muted" style="margin:6px 0 0">Оружие не требуется. ${isAura(id)?'Ставится в слот ауры и действует постоянно.':'Ставится в слот проклятия (с 8 уровня). '+(G.kind==='mark'?'Метка не тратит ход.':'Проклятие тратит ход и действует на группу.')}</p></div>`;}
  modal(`<div class="row"><span class="eyebrow sp">${own?'Камень':'Торговец · камень'}</span><button class="btn sm ghost" data-a="close">Закрыть</button></div>
    <div class="row" style="flex-wrap:nowrap">${gemIcon(id)}<h2 style="font-size:20px">${G.n}</h2></div>
    ${act?`<p class="muted" style="margin:0">${G.d}</p>`:''}
    <div class="sheet">${rows}</div>${body}
    ${own?'':`<button class="btn pri full" data-a="buyGem" data-id="${id}" ${S.gold>=p?'':'disabled'}>Купить · ${fmt(p)} зол.</button>${!allowed(id)?'<p class="dim small" style="margin:0">Умение другого класса: заработает после кампании.</p>':''}`}`);
}
