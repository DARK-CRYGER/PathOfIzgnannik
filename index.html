<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Пепел Изгнания</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone shell (max 520px); sticky hero bar on top, tab bar fixed to the bottom; combat fills one screen. Single dark world: tarnished bronze on soot. */
:root{
  color-scheme: dark;
  --bg:#14100d; --bg2:#1c1612; --panel:#221b16; --panel2:#2b221b; --line:#3d3128; --line2:#57463a;
  --fg:#eadcc2; --muted:#a8977f; --dim:#76695a;
  --gold:#c9a24a; --gold2:#e6c57a;
  --str:#cf5f4b; --dex:#6fae55; --int:#5d8fde;
  --r-normal:#d9d3c5; --r-magic:#8c8cff; --r-rare:#e9d46b; --r-unique:#cf7a3b; --r-gem:#2fb3a3;
  --fire:#e5793a; --cold:#7cc3e8; --light:#f0d75a; --chaos:#b56fd1; --phys:#d4c7b0;
  --good:#7fb069; --bad:#d0533f; --boss:#f0a070;
  --ff-d:"Alegreya SC", "Palatino Linotype", Georgia, serif;
  --ff-b:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --vh: var(--tg-viewport-stable-height, 100dvh);
}
*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--ff-b);margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  background-image:radial-gradient(120% 60% at 50% -10%, #2a1f17 0%, transparent 60%);background-attachment:fixed}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100%;padding-inline:14px;padding-block:0 96px;position:relative}
#app.fight{padding-block:0 10px}
h1,h2,h3{font-family:var(--ff-d);font-weight:700;text-wrap:balance;margin:0;letter-spacing:.02em}
.eyebrow{font:500 12px/1.2 var(--ff-d);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1;min-width:0}
.boss-t{color:var(--boss)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 75%, transparent);padding-block:10px 12px;display:flex;gap:10px;align-items:center}
.sigil{width:40px;height:40px;flex:none;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center;font:800 18px var(--ff-d);color:var(--gold2);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.top .who{min-width:0;flex:1}
.top .who b{font:700 16px var(--ff-d);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:5px;background:var(--panel2);margin-top:4px;position:relative;overflow:hidden}
.xpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#8a6a2a,var(--gold2))}
.gold{font:700 14px var(--ff-d);color:var(--gold2);white-space:nowrap}
.pts{background:var(--gold);color:#1b140d;font:800 13px var(--ff-d);padding:6px 9px;border:0;min-height:32px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#100c09f2;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:9px 2px 11px;font:600 12px var(--ff-d);letter-spacing:.05em;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;min-height:56px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.tabs button.on{color:var(--gold2)}
.tabs button.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--gold)}
.tabs .dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;background:var(--gold2);border-radius:50%}

/* panels & buttons */
.panel{background:var(--panel);border:1px solid var(--line);padding:14px;position:relative;min-width:0}
.panel.framed{box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4px var(--line)}
.ph{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ph h2{font-size:18px}
.btn{background:linear-gradient(#3a2d22,#2a2018);border:1px solid var(--line2);padding:10px 14px;font:700 14px var(--ff-d);letter-spacing:.04em;color:var(--fg);min-height:44px}
.btn.pri{background:linear-gradient(#a8823a,#7a5b22);border-color:#d8b56a;color:#1a120a}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-height:36px;font-size:13px}
.btn.danger{border-color:var(--bad);color:#ff9a88}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.full{width:100%}
.seg{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;background:var(--panel);border:1px solid var(--line);padding:8px 12px;font:700 14px var(--ff-d);color:var(--muted);min-height:40px}
.seg button.on{color:var(--gold2);border-color:var(--gold)}
.seg button:disabled{opacity:.35}
.tag{display:inline-block;font:600 11px var(--ff-b);padding:2px 6px;border:1px solid var(--line2);color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.tag.boss{color:var(--boss);border-color:#7a3b22}
.tag.ok{color:var(--good);border-color:#3b5530}
.tag.new{color:var(--gold2);border-color:#6a5326}
.tag.lock{color:var(--dim)}
.notice{font-size:13px;color:var(--muted);border-left:2px solid var(--gold);padding-left:10px;margin:0}

/* class select */
.hero{padding-block:28px 8px}
.hero h1{font-size:38px;line-height:1;color:var(--gold2);font-weight:800}
.hero p{color:var(--muted);margin:10px 0 0;max-width:40ch}
.cls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.cls{background:var(--panel);border:1px solid var(--line);padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px}
.cls.on{border-color:var(--gold);background:var(--panel2)}
.cls b{font:700 17px var(--ff-d)}
.cls small{color:var(--muted);font-size:12px}
.attrbar{display:flex;height:6px;gap:2px}
.attrbar i{display:block}
.input{width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--fg);padding:10px 12px;font:16px var(--ff-b)}
.chiplist{display:flex;flex-wrap:wrap;gap:4px}

/* map */
.cta{display:flex;align-items:center;gap:12px;background:linear-gradient(#3a2b1a,#261c14);border:1px solid var(--gold);padding:12px 14px;width:100%;text-align:left;min-height:64px}
.cta b{font:700 17px var(--ff-d);color:var(--gold2);display:block}
.cta .arrow{font:800 22px var(--ff-d);color:var(--gold2)}
.loc{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px;background:var(--panel);border:1px solid var(--line)}
.loc .lv{font:800 17px var(--ff-d);color:var(--gold2);text-align:center;border-right:1px solid var(--line);padding-right:10px;line-height:1.1}
.loc .lv small{display:block;font:500 10px var(--ff-d);color:var(--muted);letter-spacing:.1em}
.loc b{font:700 16px var(--ff-d)}
.loc.locked{opacity:.45}
.pips{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.pips i{width:14px;height:6px;background:var(--line);display:block}
.pips i.on{background:var(--gold)}
.pips i.cur{background:var(--gold2);box-shadow:0 0 0 1px var(--gold2)}
.pips i.boss{width:20px;background:#5a2a1c}
.pips i.boss.on{background:var(--boss)}
.tiers{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.tier{background:var(--panel);border:1px solid var(--line);padding:8px 4px;text-align:center;min-height:56px}
.tier b{font:800 18px var(--ff-d);display:block;color:var(--gold2)}
.tier small{font-size:11px;color:var(--muted)}
.tier:disabled{opacity:.35}

/* combat */
.cb-head{display:flex;align-items:center;gap:8px;padding-block:calc(8px + env(safe-area-inset-top,0px)) 6px}
.cb-head h2{font-size:17px;line-height:1.1}
.field{display:flex;flex-direction:column;gap:3px;background:linear-gradient(#1a1410,#120e0b);border:1px solid var(--line);padding:6px}
.lane{display:grid;grid-template-columns:20px 1fr;gap:6px;align-items:stretch;min-height:22px}
.lane .ll{writing-mode:vertical-rl;transform:rotate(180deg);font:600 10px/1 var(--ff-d);letter-spacing:.08em;color:var(--dim);text-align:center;border-right:1px solid var(--line);padding-left:4px}
.lane.has .ll{color:var(--muted)}
.lane.inr .ll{color:var(--gold2);border-color:var(--gold)}
.lane .ens{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.lane .empty-l{font-size:11px;color:var(--dim);align-self:center}
.en{flex:1 1 30%;max-width:100%;min-width:0;background:var(--panel);border:1px solid var(--line);padding:5px 6px 4px;text-align:left;position:relative;display:flex;flex-direction:column;gap:3px}
.en.tgt{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.en.dead{opacity:.2;filter:grayscale(1)}
.en.elite{background:linear-gradient(var(--panel),#2a2410)}
.en.boss{background:linear-gradient(#2c1612,var(--panel));border-color:#6e2e20;flex-basis:100%}
.en.oor{opacity:.55}
.en .nm{font:700 12px/1.15 var(--ff-d);display:flex;gap:4px;align-items:center;min-width:0}
.en .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.bar{height:9px;background:#0d0a08;border:1px solid #000;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;transition:width .2s}
.bar .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 9px/1 var(--ff-b);color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}
.hpb i{background:linear-gradient(#c84a3a,#7e2219)}
.esb i{background:linear-gradient(#cfe0ee,#7d9ab3)}
.mpb i{background:linear-gradient(#5585cf,#26467c)}
.rgb i{background:linear-gradient(#f08a3a,#a3461c)}
.chips{display:flex;gap:3px;flex-wrap:wrap;min-height:13px}
.chip{font:600 9px/1.3 var(--ff-b);padding:0 4px;border:1px solid}
.log{background:#0f0b09;border:1px solid var(--line);padding:5px 8px;font-size:12px;height:62px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;margin-block:6px}
.log div{opacity:.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.log div:nth-last-child(-n+2){opacity:1}
.me{display:grid;gap:3px;position:relative}
.me .bar{height:15px}.me .bar .t{font-size:11px}
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:6px}
.sk{background:linear-gradient(#30251c,#211913);border:1px solid var(--line2);padding:7px 8px;text-align:left;min-height:58px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.sk b{font:700 14px/1.1 var(--ff-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk .why{color:#e0907e}
.sk:disabled{opacity:.42}
.sk.empty{border-style:dashed;color:var(--dim);justify-content:center;align-items:center}
.act-row{display:grid;grid-template-columns:1fr 1.3fr 1.1fr 1fr;gap:5px;margin-top:5px}
.act-row .btn{padding:6px 4px;font-size:13px;min-height:46px}
.btn.toggle.on{border-color:var(--gold2);color:var(--gold2)}
.float{position:absolute;left:50%;top:20%;transform:translateX(-50%);font:800 16px var(--ff-d);pointer-events:none;text-shadow:0 1px 0 #000,0 0 6px #000;animation:fl .9s ease-out forwards;white-space:nowrap;z-index:3}
.float.crit{font-size:21px;color:var(--gold2)}
@keyframes fl{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-28px)}}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* gems */
.slot{background:var(--panel);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.slot.locked{opacity:.5}
.socks{display:flex;gap:6px;flex-wrap:wrap}
.gemb{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line2);padding:6px 10px 6px 6px;min-height:46px;text-align:left;min-width:0;width:100%}
.gemb.half{flex:1 1 140px;width:auto}
.gemb.bad{border-color:#6e2e20}
.gemb.off{opacity:.5}
.gem{width:26px;height:26px;flex:none;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);position:relative}
.gem.sup{clip-path:circle(50%)}
.gem.aura{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.gem::after{content:"";position:absolute;inset:5px;background:#ffffff40;clip-path:inherit}
.gemb .gt{min-width:0;display:flex;flex-direction:column;flex:1}
.gemb .gt b{font:700 13px/1.15 var(--ff-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gemb .gt small{font-size:11px;color:var(--muted)}
.emptys{flex:1 1 60px;max-width:110px;height:46px;border:1px dashed var(--line2);background:transparent;display:grid;place-items:center;color:var(--dim);font-size:20px}
.summary{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.summary b{color:var(--fg)}
.list{display:flex;flex-direction:column;gap:6px}
.resbar{height:12px;background:#0d0a08;border:1px solid #000;display:flex;overflow:hidden}
.resbar i{display:block;height:100%;background:linear-gradient(#5585cf,#26467c);border-right:1px solid #000}

/* items */
.irow{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);padding:8px 10px;text-align:left;min-width:0;min-height:44px;width:100%}
.irow .sl{font:500 11px var(--ff-d);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.irow .in{min-width:0;font:700 14px var(--ff-d);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow.up{box-shadow:inset 3px 0 0 var(--good)}
.bag{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.bag .irow{grid-template-columns:1fr;gap:2px}
.r-normal{color:var(--r-normal)}.r-magic{color:var(--r-magic)}.r-rare{color:var(--r-rare)}.r-unique{color:var(--r-unique)}.r-gem{color:var(--r-gem)}
.card{background:#0f0b09;border:1px solid var(--line2);text-align:center;font-size:13px}
.card .hd{padding:10px 8px 8px;border-bottom:1px solid var(--line2);font:700 16px/1.2 var(--ff-d)}
.card .hd small{display:block;font:500 13px var(--ff-d);opacity:.85}
.card .bd{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px}
.card .sep{height:1px;background:var(--line2);margin:5px 20%}
.card .mod{color:#8f9fe6}
.card.r-unique .mod{color:#c99a6a}
.cmp{font-size:12px;display:flex;flex-direction:column;gap:2px}
.cmp .up{color:var(--good)} .cmp .dn{color:var(--bad)}

/* tree */
.treebox{height:calc(var(--vh) - 330px);min-height:300px;overflow:hidden;background:radial-gradient(circle at 50% 50%,#1d1712,#0f0c0a 70%);border:1px solid var(--line);touch-action:none;position:relative}
.treebox svg{display:block;width:100%;height:100%}
.tzoom{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:4px}
.tzoom button{width:40px;height:40px;background:#1c1612e6;border:1px solid var(--line2);font:700 18px var(--ff-d);color:var(--fg)}
.statl{display:flex;flex-direction:column;gap:2px;font-size:14px}
.statl span{color:#8f9fe6}

/* sheet */
.sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}
.sheet div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding-block:3px;font-size:14px;min-width:0}
.sheet div span:first-child{color:var(--muted)}
.sheet div span:last-child{font-variant-numeric:tabular-nums;font-weight:700}

/* modal + toast */
.ov{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--gold);border-bottom:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 40px #000;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.modal h2{color:var(--gold2);font-size:22px}
.grab{width:40px;height:4px;background:var(--line2);margin:-8px auto 0}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;background:#1d150f;border:1px solid var(--gold);color:var(--gold2);padding:8px 14px;font:700 14px var(--ff-d);animation:tin .25s;max-width:92vw;text-align:center;pointer-events:none}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}
.choice{display:grid;gap:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v3 ===== */
.gold-t{color:var(--gold2)} .bad-t{color:#e0907e} .good-t{color:var(--good)} .r-cur{color:#d9c58f}
.en.r-magic{border-color:#4a4a9a}.en.r-magic .nmt{color:var(--r-magic)}
.en.r-rare{border-color:#8a7a2a;background:linear-gradient(var(--panel),#2a2410)}.en.r-rare .nmt{color:var(--r-rare)}
.en.r-boss{background:linear-gradient(#2c1612,var(--panel));border-color:#6e2e20;flex-basis:100%}.en.r-boss .nmt{color:var(--boss)}
.en.acting{box-shadow:0 0 0 2px var(--bad) inset}
.intent{font:600 10px/1.2 var(--ff-b);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.intent.warn{color:#e3b07a}.intent.bad{color:#ff8a75;font-weight:700}.intent.ok{color:var(--good)}
.log{width:100%;text-align:left;cursor:pointer;height:52px}
.buffs{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;min-height:16px}
.order{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;font:600 11px var(--ff-b);margin-top:5px;padding:4px 6px;background:#0f0b09;border:1px solid var(--line);white-space:nowrap}
.order::-webkit-scrollbar{display:none}
.order span{color:var(--muted)}.order span.cur{color:var(--gold2);text-decoration:underline;text-underline-offset:3px}
.order i{font-style:normal;color:var(--dim)}
.skills.one{grid-template-columns:1fr}
.flasks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:5px}
.fl{position:relative;background:#1a1410;border:1px solid var(--line2);min-height:44px;padding:4px 2px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;overflow:hidden;min-width:0}
.fl b{font:700 11px/1.1 var(--ff-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fl small{font-size:10px;color:var(--muted)}
.fl i{position:absolute;left:0;bottom:0;height:3px;background:var(--good)}
.fl.r-magic{border-color:#4a4a9a}.fl.r-unique{border-color:#8a5a2a}
.fl.on{box-shadow:0 0 0 1px var(--gold2) inset}
.fl:disabled{opacity:.45}
.act-row{grid-template-columns:1fr 1.4fr 1fr}
.journal{max-height:62vh;overflow:auto;font-size:12.5px;line-height:1.45;background:#0f0b09;border:1px solid var(--line);padding:8px 10px;-webkit-user-select:text;user-select:text}
.jt{font:700 11px var(--ff-d);letter-spacing:.1em;color:var(--gold);text-transform:uppercase;margin-top:8px;border-top:1px solid var(--line);padding-top:4px}
.jt:first-child{margin-top:0;border-top:0}
.jl{color:var(--fg)}
.umod{color:#e0a46a;font-style:italic}

function wcOf(it){if(!it||it.slot!=='weapon')return null;return it.wc||WEAP[it.wk].wc[0];}
function modAllowed(k,it){
  const m=MODS[k];if(!m||!m.on.includes(it.slot))return false;
  if(it.slot==='weapon'&&(!m.wc||!m.wc.includes(wcOf(it))))return false;
  if(m.dt){if(!it.dt)return false;if(m.dt.length===2){if(it.dt!==m.dt)return false;}else if(!DT_K[it.dt].includes(m.dt))return false;}
  if(m.minL&&it.ilvl<m.minL)return false;
  return true;
}
/* итоговая защита брони с локальными свойствами */
function itemDef(it){
  if(!it.def)return null;const d={...it.def},m=k=>it.mods.filter(x=>x.k===k).reduce((a,x)=>a+x.v,0);
  if(d.armour!=null)d.armour=(d.armour+m('armF'))*(1+(m('armL')+m('aeL')+m('asL'))/100);
  if(d.eva!=null)d.eva=(d.eva+m('evaF'))*(1+(m('evaL')+m('aeL')+m('eeL'))/100);
  if(d.es!=null)d.es=(d.es+m('esF'))*(1+(m('esL')+m('eeL')+m('asL'))/100);
  for(const k in d)d[k]=R(d[k]);return d;
}

  const v=(m.r[0]+(m.r[1]-m.r[0])*.6)*(1+ilvl*m.sc/10);return (k==='leech'||k==='regen')?R(v*10)/10:Math.max(1,R(v));}

  const add=(id,x,y,o)=>{NODES[id]=Object.assign({id,x,y,adj:[]},o);return id};
  const addP=(id,r,deg,o)=>{const [x,y]=P2(r,deg);return add(id,x,y,o)};
  const link=(a,b)=>{if(!NODES[a]||!NODES[b]||a===b||NODES[a].adj.includes(b))return;EDGES.push([a,b]);NODES[a].adj.push(b);NODES[b].adj.push(a)};
  const chain=ids=>{for(let i=1;i<ids.length;i++)link(ids[i-1],ids[i])};
  const attr=(id,r,deg,def)=>addP(id,r,deg,{t:'attr',def,s:{}});
  const keyN=(id,r,deg,k)=>addP(id,r,deg,{t:'key',key:k,n:KEYS[k].n,text:KEYS[k].text,s:{}});
  /* кластер: k малых узлов по дуге вокруг центра + значимое в центре; соединяет две точки */
  const cluster=(id,r,deg,th,a1,a2,k)=>{
    const [cx,cy]=P2(r,deg),ang=n=>Math.atan2(NODES[n].y-cy,NODES[n].x-cx),out=Math.atan2(cy,cx);
    let t1=ang(a1),t2=a2?ang(a2):t1+Math.PI*1.2;
    let d=t2-t1;while(d<=0)d+=2*Math.PI;
    const mid=t1+d/2,alt=d-2*Math.PI,midAlt=t1+alt/2;
    const dist=(x,y)=>Math.abs(Math.atan2(Math.sin(x-y),Math.cos(x-y)));
    if(dist(midAlt,out)<dist(mid,out))d=alt;
    const pad=.5,ids=[];
    for(let j=0;j<k;j++){const t=t1+(d>0?1:-1)*pad+(d-(d>0?1:-1)*2*pad)*(k===1?.5:j/(k-1));
      ids.push(add(id+'s'+j,R(cx+54*Math.cos(t)),R(cy+54*Math.sin(t)),{t:'small',s:th.s}));}
    const N=add(id+'N',R(cx),R(cy),{t:'notable',n:th.n,s:th.ns});
    chain(ids);link(N,ids[0]);link(N,ids[k-1]);link(a1,ids[0]);if(a2)link(a2,ids[k-1]);
    return N;
  };
  const RAD=i=>420+75*i;
  add('C',0,0,{t:'start',cls:'scion',n:'Дворянка',s:{}});
  SECTORS.forEach((Sc,k)=>{const a=Sc.a,p=Sc.c+'_',def=Sc.def;
    addP(p+'S',330,a,{t:'start',cls:Sc.c,n:CLASSES[Sc.c].n,s:{}});
    attr(p+'i1',265,a,def);attr(p+'i2',200,a,def);chain([p+'S',p+'i1',p+'i2']);
    addP('I'+k,130,a,{t:'attr',def:'str',s:{}});addP('J'+k,150,a+30,{t:'small',s:{lifeP:4}});
    link('C','I'+k);link('I'+k,p+'i2');link('I'+k,'J'+k);
    /* две магистрали атрибутов и центральная цепь умений класса */
    [-1,0,1].forEach(s=>{const ids=[];for(let i=0;i<12;i++){const id=p+'h'+s+'_'+i;
        ids.push(s===0?addP(id,RAD(i),a,{t:'small',s:Sc.core[i%3]}):attr(id,RAD(i),a+20*s,def));}
      chain(ids);link(p+'S',ids[0]);});
    link(p+'i1',p+'h-1_0');link(p+'i1',p+'h1_0');
    keyN(p+'K',1335,a,Sc.key);link(p+'h0_11',p+'K');
    keyN(p+'KL',1340,a-20,Sc.kL);link(p+'h-1_11',p+'KL');
    keyN(p+'KR',1340,a+20,Sc.kR);link(p+'h1_11',p+'KR');
    /* 10 кластеров в двух коридорах между магистралями */
    const radii=[560,720,880,1040,1200],near=r=>{let b=0;for(let i=0;i<12;i++)if(Math.abs(RAD(i)-r)<Math.abs(RAD(b)-r))b=i;return b;};
    Sc.th.forEach((th,j)=>{const lane=j%2?1:-1,ri=Math.floor(j/2),r=radii[ri],i=near(r);
      cluster(p+'c'+j,r,a+10*lane,th,p+'h'+lane+'_'+i,p+'h0_'+i,ri%2?4:3);});
  });
  SECTORS.forEach((Sc,k)=>{const a=Sc.a,p=Sc.c+'_',q=SECTORS[(k+1)%6].c+'_',B=BRIDGES[k],bp='br'+k+'_';
    link('J'+k,'I'+((k+1)%6));
    const r1=[attr(bp+'r1a',RAD(4),a+26.7,Sc.def),attr(bp+'r1b',RAD(4),a+33.3,SECTORS[(k+1)%6].def)];chain([p+'h1_4',...r1,q+'h-1_4']);
    const r2=[attr(bp+'r2a',RAD(9),a+25,Sc.def),attr(bp+'r2b',RAD(9),a+30,'dex'),attr(bp+'r2c',RAD(9),a+35,SECTORS[(k+1)%6].def)];chain([p+'h1_9',...r2,q+'h-1_9']);
    cluster(bp+'A',565,a+30,B.a,p+'h1_2',q+'h-1_2',4);
    cluster(bp+'B',905,a+30,B.b,p+'h1_7',q+'h-1_7',4);
    addP(bp+'k1',1195,a+30,{t:'small',s:B.b.s});keyN(bp+'K',1295,a+30,B.key);
    chain([bp+'r2b',bp+'k1',bp+'K']);
    cluster('sc'+k,245,a+30,SCION_TH[k],'J'+k,SECTORS[(k+1)%6].c+'_i1',3);
  });
})();
const startNode=cls=>cls==='scion'?'C':cls+'_S';
const TREE_R=1430;

/* =========================================================
   АККАУНТ, РАСЧЁТ ХАРАКТЕРИСТИК, ПРЕДМЕТЫ, БОЙ
   ACC — аккаунт игрока (до 7 персонажей, общий тайник, выручка аукциона).
   S — текущий персонаж (ссылка внутрь ACC.chars). C — текущий бой.
   ========================================================= */
const KEY='ash_exile_v4',KEY3='ash_exile_v3';
let ACC=null,S=null,C=null,tg=null;
const sleep=ms=>new Promise(r=>setTimeout(r,window.FAST?0:ms));
const haptic=(t='light')=>{try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(t)}catch(e){}};
const notifyH=(t='success')=>{try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred(t)}catch(e){}};

/* ---------- опыт ---------- */
const mxp=m=>5+1.8*Math.pow(m,1.7);
const killsPerLvl=L=>L<=65?(12.2+.22*L):19.4+3.2*Math.pow(L-65,1.55);
const xpNeed=L=>L>=MAXLVL?Infinity:R(killsPerLvl(L)*mxp(L));
const GEM_XP=[];for(let L=1;L<20;L++){let s=0;for(let c=GEM_REQ[L-1];c<GEM_REQ[L];c++)s+=xpNeed(c);GEM_XP[L]=R(s*.85);}
const gemXpNeed=L=>GEM_XP[L]||Infinity;
function underAllow(){if(C&&C.B.type!=='camp')return 10;const a=C?C.I.act:actOfProg();return 5+Math.min(a,4);}
function xpFactor(m){
  let f=1;const safe=3+Math.floor(S.lvl/16),ex=S.lvl-m-safe;if(ex>0)f*=1/(1+.12*ex*ex);
  const un=m-S.lvl-underAllow();if(un>0)f*=1/(1+.35*un*un);
  return f;
}

/* ---------- сохранение ---------- */
function newUid(){ACC.u=(ACC.u||0)+1;return 'u'+ACC.u;}
function newAcc(){return {v:4,u:0,t:Date.now(),chars:[],cur:null,stash:{items:[],tabs:1},auc:{lots:[],seq:0},aucGold:0};}
function fixChar(c){
  c.maps=c.maps||{};c.offer=c.offer||0;c.labs=c.labs||[0,0,0,0];c.asc=c.asc||null;c.ascAlloc=c.ascAlloc||[];c.hex=c.hex||null;
  c.mapBest=c.mapBest||0;c.bonus=c.bonus||0;c.cur=c.cur||{};c.inv=c.inv||[];
  for(const id in c.attrPick)if(!NODES[id]||NODES[id].t!=='attr')delete c.attrPick[id];
  c.alloc=c.alloc.filter(id=>NODES[id]);
  return c;
}
function migrate3(o){
  const c=fixChar(o);c.id='c'+Date.now().toString(36);c.v=4;
  if(o.done&&o.mapMax>1)c.maps[Math.max(1,Math.min(16,o.mapMax-1))]=3;else if(o.done)c.maps[1]=3;
  c.mapBest=Math.max(0,(o.mapMax||1)-1);delete c.mapMax;delete c.u;
  return c;
}
function load(){
  try{const s=localStorage.getItem(KEY);if(s)ACC=JSON.parse(s);}catch(e){ACC=null;}
  if(!ACC){ACC=newAcc();try{const s3=localStorage.getItem(KEY3);if(s3){const o=JSON.parse(s3);if(o&&o.v===3){ACC.u=(o.u||0)+10;const c=migrate3(o);ACC.chars.push(c);ACC.cur=c.id;}}}catch(e){}}
  ACC.chars.forEach(fixChar);ACC.stash=ACC.stash||{items:[],tabs:1};ACC.auc=ACC.auc||{lots:[],seq:0};
  S=ACC.chars.find(c=>c.id===ACC.cur)||null;
}
let cloudTimer=null;
function save(){
  if(!ACC)return;ACC.t=Date.now();const str=JSON.stringify(ACC);
  try{localStorage.setItem(KEY,str);}catch(e){}
  if(tg&&tg.CloudStorage){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudSave(str),2000);}
}
function cloudSave(str){try{const parts=str.match(/[\s\S]{1,3800}/g)||[],cs=tg.CloudStorage;parts.forEach((p,i)=>cs.setItem(KEY+'_'+i,p));cs.setItem(KEY+'_n',String(parts.length));}catch(e){}}
function cloudLoad(){
  try{const cs=tg.CloudStorage;if(!cs)return;
    cs.getItem(KEY+'_n',(err,n)=>{n=parseInt(n);if(err||!n)return;const keys=Array.from({length:n},(_,i)=>KEY+'_'+i);
      cs.getItems(keys,(e2,vals)=>{if(e2||!vals)return;try{const d=JSON.parse(keys.map(k=>vals[k]).join(''));
        if(d&&d.v===4&&(!ACC||(d.t||0)>(ACC.t||0))){ACC=d;ACC.chars.forEach(fixChar);S=ACC.chars.find(c=>c.id===ACC.cur)||null;C=null;screen=S?'main':'roster';tab='map';render();toast('Сохранение загружено из Telegram');}}catch(e){}});});
  }catch(e){}
}
function mainAttr(cls){const a=CLASSES[cls].attr;return ATTR_K[a.indexOf(Math.max(...a))];}
function newGame(cls,name){
  const c=CLASSES[cls];
  S={id:'c'+Date.now().toString(36)+ri(10,99),v:4,t:Date.now(),name:name||'Изгнанник',cls,lvl:1,xp:0,gold:30,alloc:[startNode(cls)],attrPick:{},attrDef:mainAttr(cls),bonus:0,
     gems:[],skills:[{a:null,s:[]},{a:null,s:[]},{a:null,s:[]},{a:null,s:[]}],auras:[null,null,null,null],hex:null,
     equip:{},inv:[],cur:{},prog:0,done:false,deaths:0,kills:0,autoSell:false,shop:null,maps:{},offer:0,mapBest:0,labs:[0,0,0,0],asc:null,ascAlloc:[]};
  ACC.chars.push(S);ACC.cur=S.id;
  const g1={uid:newUid(),id:c.gem,lvl:1,xp:0},g2={uid:newUid(),id:c.sup,lvl:1,xp:0};
  S.gems.push(g1,g2);S.skills[0].a=g1.uid;S.skills[0].s=[g2.uid];
  S.equip.weapon=makeItem('weapon',1,'normal',{wk:c.weapon,wc:c.weapon==='staff'||c.weapon==='sceptre'?'caster':'melee'});
  if(c.off==='dagger')S.equip.offhand=makeItem('weapon',1,'normal',{wk:'dagger',wc:'melee'});
  else if(c.off)S.equip.offhand=makeItem(c.off,1,'normal',{dt:c.dt});
  S.equip.body=makeItem('body',1,'normal',{dt:c.dt});
  S.equip.flask1=makeFlask(1,'normal','life');S.equip.flask2=makeFlask(1,'normal','life');
  if(c.mana)S.equip.flask3=makeFlask(1,'normal','mana');

}
function switchChar(id){C=null;ACC.cur=id;S=ACC.chars.find(c=>c.id===id)||null;save();}
function deleteChar(id){ACC.chars=ACC.chars.filter(c=>c.id!==id);if(ACC.cur===id){ACC.cur=null;S=null;}save();}

/* ---------- камни ---------- */
const gem=uid=>uid&&S.gems.find(g=>g.uid===uid);
const gdef=id=>GEMS[id]||AURAS[id]||HEXES[id];
const isAura=id=>!!AURAS[id], isHex=id=>!!HEXES[id];
function allowed(id){
  if(S.done)return true;if(GEMS[id]&&GEMS[id].sup)return true;
  const c=CLASSES[S.cls];return isAura(id)?c.auras.includes(id):c.list.includes(id);
}
const obtainable=id=>allowed(id)&&gemRl(id)<=S.lvl;
function eqU(k){for(const s of EQ_SLOTS){const it=S.equip[s];if(it&&itemOk(it)&&it.mods.some(m=>m.k===k))return it.mods.find(m=>m.k===k).v;}return 0;}
function slotOpen(i){return S.lvl>=SKILL_SLOTS[i][0];}
function sockets(i){const lv=SKILL_SLOTS[i].slice(1);let n=lv.filter(l=>S.lvl>=l).length;if(n&&i<2&&eqU('u_sock12'))n++;return n;}
function nextSocketLvl(i){const l=SKILL_SLOTS[i].slice(1).find(l=>S.lvl<l);return l||null;}
function socketed(){const s=new Set();S.skills.forEach(x=>{if(x.a)s.add(x.a);x.s.forEach(u=>u&&s.add(u));});S.auras.forEach(u=>u&&s.add(u));if(S.hex)s.add(S.hex);return s;}
function newGemLvl(){return Math.max(1,maxGemLvl(S.lvl)-1);}
function addGem(id,lvl){const g={uid:newUid(),id,lvl:lvl||newGemLvl(),xp:0};S.gems.push(g);return g;}

/* ---------- расчёт персонажа ---------- */
function pointsFree(){return (S.lvl-1)+S.bonus-(S.alloc.length-1);}
function ascPoints(){return 2*S.labs.filter(Boolean).length;}
function ascFree(){return ascPoints()-ASC_NODE_COST*S.ascAlloc.length;}
function actOfProg(){if(S.done)return 4;return BATTLES[Math.min(S.prog,BATTLES.length-1)].act;}
function resPenalty(){if(C&&C.B.type==='map')return 30;if(C&&C.B.type==='lab')return [10,20,30,30][C.I.lab];const a=C?C.I.act:actOfProg();return [0,0,0,10,20][a]||0;}
const itemOk=it=>!it.req||S.lvl>=it.req;
function wInfo(it){const mv=k=>it.mods.filter(m=>m.k===k),pl=mv('physL').reduce((a,m)=>a+m.v,0)+(it.imp.physL||0),cl=mv('critL').reduce((a,m)=>a+m.v,0);
  const fl=mv('addPhysL').reduce((a,m)=>[a[0]+m.v[0],a[1]+m.v[1]],[0,0]);
  return {it,min:(it.wd[0]+fl[0])*(1+pl/100),max:(it.wd[1]+fl[1])*(1+pl/100),crit:it.crit*(1+cl/100),wk:it.wk,kind:WEAP[it.wk].kind,h:WEAP[it.wk].h,spell:!!WEAP[it.wk].spell};}
const LOCAL_W=new Set(['physL','critL','addPhysL']);

function calc(){
  const c=CLASSES[S.cls],t={},keys=new Set(),U={};
  const add=s=>{for(const k in s){const v=s[k];if(Array.isArray(v)){t[k+'Min']=(t[k+'Min']||0)+v[0];t[k+'Max']=(t[k+'Max']||0)+v[1];}else t[k]=(t[k]||0)+v;}};
  S.alloc.forEach(id=>{const n=NODES[id];if(!n)return;
    if(n.t==='attr'){const a=S.attrPick[id]||n.def;t[a]=(t[a]||0)+ATTR_NODE;}else add(n.s);if(n.key)keys.add(n.key);});
  const AD=S.asc&&ascDef(S.asc);if(AD)S.ascAlloc.forEach(i=>{if(AD.nodes[i])add(AD.nodes[i].s);});
  const P={t,keys,U,cls:S.cls};
  /* оружие и левая рука */
  const main=S.equip.weapon&&itemOk(S.equip.weapon)?S.equip.weapon:null,off=S.equip.offhand&&itemOk(S.equip.offhand)?S.equip.offhand:null;
  P.weapons=[];if(main)P.weapons.push(wInfo(main));if(off&&off.slot==='weapon')P.weapons.push(wInfo(off));
  P.dual=P.weapons.length===2;P.twoH=main&&WEAP[main.wk].h===2;
  P.block=0;
  EQ_SLOTS.forEach(sl=>{const it=S.equip[sl];if(!it||!itemOk(it))return;
    const d=itemDef(it);if(d)add(d);
    if(it.slot!=='weapon')add(it.imp||{});else{const im={...it.imp};delete im.physL;add(im);}
    if(it.block)P.block+=it.block;
    it.mods.forEach(m=>{if(LOCAL_W.has(m.k)||(MODS[m.k]&&MODS[m.k].loc))return;
      if(String(m.k).startsWith('u_')){U[m.k]=(U[m.k]||0)+m.v;return;}
      add({[m.k]:m.v});});});
  /* эффекты флаконов в бою и благословения лабиринта */
  if(C&&C.fb)C.fb.forEach(b=>add(b.eff));
  if(C&&C.B.type==='lab'&&S.labRun)S.labRun.buffs.forEach(b=>add(SHRINES[b].s));
  const g=k=>t[k]||0;
  const attr={};ATTR_K.forEach((k,i)=>attr[k]=c.attr[i]+Math.floor(ATTR_GROW*(S.lvl-1))+g(k));P.attr=attr;
  let life=(40+10*S.lvl+attr.str/2+g('life'))*(1+g('lifeP')/100)*(keys.has('pain')?.9:1);if(keys.has('ci'))life=1;
  P.lifeMax=Math.max(1,R(life));
  P.manaMax=keys.has('blood')?0:R((40+5*S.lvl+attr.int/2+g('mana'))*(1+g('manaP')/100));
  /* ауры */
  const ego=keys.has('ego'),auraF=1+(g('auraEff')+(ego?50:0))/100,resE=clamp(g('resEff'),0,60);
  let used=0;P.auras=[];
  S.auras.forEach((uid,i)=>{const gm=gem(uid);if(!gm||S.lvl<AURA_SLOTS[i])return;const A=AURAS[gm.id];
    const L=Math.min(21,gm.lvl+(g('gemLvl')||0)),r=(i===0&&U.u_freeAura)?0:A.res*(1-resE/100)*(ego?1.3:1);
    const ok=allowed(gm.id)&&attr[A.c]>=gemAttrReq(gm.lvl)&&used+r<=100.01;
    P.auras.push({uid,id:gm.id,L,res:r,on:ok});if(ok){used+=r;A.ap(t,L,auraF);}});
  P.reserved=used;P.auraF=auraF;
  if(keys.has('blood')){P.life=Math.max(1,R(P.lifeMax*(1-used/100)));P.mana=0;}else{P.life=P.lifeMax;P.mana=R(P.manaMax*(1-used/100));}
  /* защита */
  const esInc=g('esP')+attr.int/5+(keys.has('ci')?30:0)+(keys.has('battery')?50:0)+(keys.has('ghost')?20:0)+(keys.has('zealot')?20:0);
  P.es=R(g('es')*(1+esInc/100)*(keys.has('acro')?.5:1));
  let eva=R((g('eva')+attr.dex*2)*(1+(g('evaP')+attr.dex/5)/100));
  let arm=g('armour')*(1+g('armourP')/100)*(1+g('armourMore')/100);
  if(keys.has('ironref')){arm+=eva;eva=0;}
  P.armour=R(arm*(keys.has('acro')?.5:1));P.eva=eva;
  P.evaFlat=(keys.has('acro')?20:0)+g('evadeFlat');P.evaCap=keys.has('acro')?85:75;
  P.block=clamp((P.block+g('block')+(P.dual?15:0))*(keys.has('glancing')?2:1),0,75);
  const pen=resPenalty();
  P.resRaw={fire:g('resF')+g('resAll'),cold:g('resC')+g('resAll'),light:g('resL')+g('resAll'),chaos:g('resCh')};
  P.res={fire:Math.min(75,P.resRaw.fire-pen),cold:Math.min(75,P.resRaw.cold-pen),light:Math.min(75,P.resRaw.light-pen),chaos:Math.min(75,P.resRaw.chaos-pen),phys:0};
  P.pen=pen;P.physRed=g('physRed');
  P.regen=keys.has('vaal')?0:1+g('regen');
  P.leech=g('leech')*(keys.has('vaal')?2:1);P.leechCap=keys.has('vaal')?.3:.15;
  P.esRech=.08+g('esRech')/100;
  P.mreg=3+g('mreg');
  P.flaskEff=g('flaskEff');P.flaskGain=g('flaskGain');
  P.goldP=g('goldP');P.iir=g('iir');
  P.kite=g('kite');P.stepFree=g('stepFree');P.reach=g('reach');P.pride=g('pride');P.dmgTaken=g('dmgTaken')+(keys.has('berserk')?10:0);
  P.rageMax=30+g('rageMax');P.rage=!!U.u_rage||!!g('ex_rage');
  P.dmgMore=g('dmgMore');P.curse=g('curse');P.freeMove=g('freeMove');
  P.costM=1+g('costP')/100;
  P.hex=hexInfo(P);
  P.skills=[0,1,2,3].map(i=>calcSkill(i,P));
  P.basic=basicSkill(P);
  return P;
}
function evadeChance(P,mlvl,kind){
  if(P.eva<=0&&!P.evaFlat)return 0;
  let c=(P.eva>0?P.eva/(P.eva+50+15*mlvl)*100:0)+P.evaFlat;
  if(P.keys.has('arrowdance')){if(kind==='melee')c*=.5;else c+=30;}
  if(P.keys.has('wind')&&C&&C.hitLast)c+=20;
  return clamp(c,0,P.evaCap);
}

/* ---------- проклятие / метка ---------- */
function hexInfo(P){
  const gm=gem(S.hex);if(!gm||S.lvl<HEX_LVL)return null;const H=HEXES[gm.id];if(!H)return null;
  const L=Math.min(21,gm.lvl+(P.t.gemLvl||0)),curse=H.kind==='curse';

function inRange(sk,e,P){

function canTarget(sk,P){return ALWAYS_FN.has(sk.fn)?alive().length>0:alive().some(e=>inRange(sk,e,P));}

function skillHits(sk,tgt,P){

    case 'explosive':H.push({e:tgt,m:1,proj:1});al.filter(e=>e!==tgt&&Math.abs(e.d-tgt.d)<=1+a).forEach(e=>H.push({e,m:.6}));others().slice(0,sk.extra).forEach(e=>H.push({e,m:1,proj:1}));break;
    case 'barrage':for(let i=0;i<sk.n+sk.extra;i++)H.push({e:tgt,m:1,proj:1});break;
    case 'rain':al.filter(e=>e.d>=Math.max(0,1-a)).forEach(e=>H.push({e,m:1}));break;
    case 'caustic':H.push({e:tgt,m:1,proj:1});others().slice(0,sk.extra).forEach(e=>H.push({e,m:1,proj:1}));break;
    case 'larrow':H.push({e:tgt,m:1,proj:1});others().slice(0,sk.n+sk.extra).forEach(e=>H.push({e,m:.5}));break;

function shiftAll(dv){C.enemies.forEach(e=>{if(e.hp>0)e.d=clamp(e.d+dv,0,3);});}

function dynMore(sk,P){
  let m=1;

  if(sk.type==='attack'&&P.rage)m*=1+C.rage/100;
  if(P.curse)m*=1+P.curse/100;

}
function distMult(P,d){if(P.keys.has('pointblank'))return [1.3,1.15,1,.85][d];return d===0?.75:1;}
const ELS=['phys','fire','cold','light','chaos'];
/* особые множители урона: значимые умения, возвышения, ключевые */
function exMore(sk,P,e,proj){
  const t=P.t;let m=1;const x=k=>t[k]?1+t[k]/100:1;
  if(t.ex_full&&e.hp>=e.maxHp)m*=x('ex_full');
  if(t.ex_exec&&e.hp<e.maxHp*.35)m*=x('ex_exec');
  if(t.ex_low&&C.hp<P.life*.5)m*=x('ex_low');
  if(t.ex_vsIgn&&e.st.ign)m*=x('ex_vsIgn');
  if(t.ex_vsPoi&&e.st.poi.length)m*=x('ex_vsPoi');
  if(t.ex_vsShock&&e.st.shock)m*=x('ex_vsShock');
  if(t.ex_vsCurse&&e.st.curse)m*=x('ex_vsCurse');
  if(t.ex_close&&e.d===0)m*=x('ex_close');
  if(t.ex_far&&proj&&e.d>=2)m*=x('ex_far');
  if(t.ex_boss&&(e.rar==='rare'||e.boss))m*=x('ex_boss');
  if(t.ex_ambush&&C.waveActs===0)m*=x('ex_ambush');
  if(t.ex_rampage)m*=1+Math.min(t.ex_rampage,C.kills)/100;
  if(t.ex_fullMana&&sk.type==='spell'&&P.mana>0&&C.mana>=P.mana*.8)m*=x('ex_fullMana');
  if(P.keys.has('pain')&&sk.type==='spell'&&C.hp<P.life*.5)m*=1.3;

}
/* расчёт одного попадания без побочных эффектов (используется и мишенью) */
function rollHit(sk,P,e,m,proj,force){
  const hx=hexOn(e);
  let crit=sk.crit>0&&(Math.random()<sk.crit+(hx.critC||0)/100||force);
  const cm=sk.critMult+(hx.critM||0)/100;
  const shockM=1+(P.U.u_shock40?.4:.2)*(1+(P.t.ex_shockEff||0)/100);
  let dm=dynMore(sk,P)*m*(crit?cm:1)*(e.st.shock?shockM:1)*exMore(sk,P,e,proj);
  if(proj)dm*=distMult(P,e.d)*(1+(hx.projT||0)/100);
  if(hx.dmgT)dm*=1+hx.dmgT/100;
  if(e.d===0&&P.pride)dm*=1+P.pride/100;
  if(e.st.chill&&sk.vsChill>1)dm*=sk.vsChill;
  if(e.st.shock&&sk.vsShock>1)dm*=sk.vsShock;
  if(e.st.ign&&sk.vsIgn>1)dm*=sk.vsIgn;
  if(sk.ruthMul)dm*=sk.ruthMul;
  if(P.t.ex_dbl&&roll(P.t.ex_dbl))dm*=2;
  if(e.st.ward)dm*=.5;
  let total=0;const parts={};const pen=P.t.ex_pen||0;
  for(const el in sk.dmg){let v=rnd(sk.dmg[el][0],sk.dmg[el][1])*dm;
    if(C&&C.eo>0&&el!=='phys'&&el!=='chaos')v*=1.4;
    if(el==='phys'){if(e.st.maim)v*=1.1;v*=1+(hx.physT||0)/100;const arm=e.arm*(1-(P.t.ex_armBreak||0)/100);v*=1-Math.min(.6,arm/(arm+10*v));}
    else if(el==='chaos'){const r=(e.res.chaos||0)+(hx.chaosRes||0);v*=1-r/100;}
    else{let r=(e.res[el]||0)+(hx.elemRes||0)-pen;if(el==='fire'&&P.keys.has('avatar'))r-=15;
      if(e.st.ee)r+=e.st.ee.els.includes(el)?25:-25;v*=1-clamp(r,-100,90)/100;}
    v=Math.max(0,v);parts[el]=v;total+=v;}
  total=isFinite(total)?Math.max(1,R(total)):1;
  return {total,crit,parts};
}
function dealHit(sk,e,m,proj,P){

  const r=rollHit(sk,P,e,m,proj,force);const {total,crit,parts}=r;
  e.touched=true;e.hp=Math.max(0,e.hp-total);
  fx(e.uid,(crit?'✦ ':'')+fmt(total),crit?'crit':'');
  if(crit){haptic('medium');if(P.keys.has('overload'))C.eo=2;if(P.t.ex_critFree&&roll(P.t.ex_critFree))C.freeCast=true;}
  const cb=crit?30:0,na=sk.noAil,ail=[],hx=hexOn(e);
  if(!na&&parts.fire>0&&roll(10+sk.ail.ignite+cb)){const d=parts.fire*.3*sk.ignMore;if(!e.st.ign||e.st.ign.d<d){e.st.ign={d,t:sk.ignDur};ail.push('поджог');}}
  if(!na&&parts.cold>0){e.st.chill=2;if(!e.boss&&roll(6+sk.ail.freeze+cb)){e.st.frozen=1;ail.push('заморозка');}else ail.push('холод');}
  if(!na&&parts.light>0&&roll(10+sk.ail.shock+cb)){e.st.shock=2;ail.push('шок');}
  const pc=(parts.phys||0)+(parts.chaos||0);
  if(pc>0&&roll(sk.ail.poison)){e.st.poi.push({d:pc*.2*sk.poiMore,t:sk.poiDur,drain:sk.drain});ail.push('яд');}
  if((sk.stun||hx.stunC)&&!e.boss&&roll((sk.stun||0)+(hx.stunC||0)+cb)){e.st.stun=1;ail.push('оглушение');}
  if(sk.ruthMul&&!e.boss)e.st.stun=1;
  if(sk.maim){e.st.maim=2;ail.push('увечье');}
  if(sk.fort&&sk.tags.includes('melee'))C.fort=3;
  if(P.keys.has('ee')){const els=['fire','cold','light'].filter(k=>parts[k]>0);if(els.length)e.st.ee={els,t:2};}

  if(sk.type==='attack'&&P.rage)C.rage=Math.min(P.rageMax,C.rage+3);
  if(sk.knock&&!e.boss&&e.hp>0&&e.d<3&&roll(sk.knock)){e.d++;ail.push('отброшен');}
  if(sk.cull&&!e.boss&&e.hp>0&&e.hp<e.maxHp*sk.cull/100){e.hp=0;ail.push('добит');}
  logF(`&nbsp;&nbsp;→ ${e.n} [${DIST[e.d].toLowerCase()}]: <b>${fmt(total)}</b> (${ELS.filter(k=>parts[k]>.5).map(k=>`${EL[k]} ${fmt(parts[k])}`).join(', ')})${crit?' <span class="gold-t">крит</span>':''}${ail.length?' · '+ail.join(', '):''}`);
  if(e.hp<=0)killEnemy(e,P,sk);
  return r;
}
function applyCurse(e,h){if(e.hp<=0)return;e.st.curse={id:h.id,L:h.L,f:h.f,t:h.dur};}
function applyMark(e,h){C.enemies.forEach(x=>{x.st.mark=null;});if(e.hp>0)e.st.mark={id:h.id,L:h.L,f:h.f};}

const KILL_CH={normal:2,magic:4,rare:7,boss:12};
function killEnemy(e,P,sk){
  if(e.dead)return;e.dead=true;S.kills++;C.kills++;
  const hx=hexOn(e);
  const m=e.mods.length,x=monXp(e);C.xp+=x;gainXp(x);
  const gold=R((2+e.lvl)*rnd(.5,1.5)*(1+.4*m)*(e.boss?12:1)*(1+(P.goldP+(hx.loot||0))/100));C.gold+=gold;S.gold+=gold;

  C.fl.forEach(f=>{if(!f)return;const st=flaskStats(S.equip[f.slot],P);f.ch=Math.min(st.max,f.ch+(KILL_CH[e.rar]+(hx.killFlask||0))*st.gain);});
  const heal=(P.U.u_killHeal||0)+(P.t.ex_killLife||0)+(hx.killLife||0);if(heal)C.hp=Math.min(P.life,C.hp+P.life*heal/100);

  if(sk&&sk.fn==='infernal'){const exd=e.maxHp*.2;alive().filter(o=>o.d<=1).forEach(o=>{const v=R(exd*(1-(o.res.fire||0)/100));o.hp=Math.max(0,o.hp-v);fx(o.uid,fmt(v),'dot');if(o.hp<=0)killEnemy(o,P);});logC('Взрыв пламени!');}
  /* добыча: каждое свойство монстра увеличивает награды */
  const iir=P.iir+30*m+(C.I.map?50+C.I.mt*5:0)+(e.boss?100:0)+(hx.loot||0)+(C.I.lab!=null?40:0);
  const drops=e.boss?3:(Math.random()<.13*(1+.6*m)?1:0)+(m>=2&&Math.random()<.5?1:0);
  for(let i=0;i<drops;i++){const it=e.boss&&i===0&&Math.random()<.35?makeUnique(e.lvl):dropItem(e.lvl,iir);addLoot(it);}
  const orbN=e.boss?ri(2,4):(Math.random()<.06*(1+.6*m)?1:0);

}
function rollOrb(){const tot=ORB_IDS.reduce((a,k)=>a+ORBS[k].w,0);let r=Math.random()*tot;for(const k of ORB_IDS){r-=ORBS[k].w;if(r<=0)return k;}return ORB_IDS[0];}
function addOrb(id,n=1){S.cur[id]=(S.cur[id]||0)+n;if(C&&C.orbs){C.orbs[id]=(C.orbs[id]||0)+n;logC(`Выпала <span class="r-cur">${ORBS[id].n}</span>`);}}
/* карты: выпадают с V акта; на карте — текущего тира и реже на тир выше; босс чаще роняет тир выше */
function addMap(t){t=clamp(t,1,16);S.maps[t]=(S.maps[t]||0)+1;C.loot.push({map:t,name:`Карта ${t} тира`});logC(`Выпала <span class="r-map">карта ${t} тира</span>`);}

function payCost(sk,P,cost){
  cost=cost==null?sk.cost:cost;
  if(C.freeCast&&!sk.basic){C.freeCast=false;return null;}
  if(sk.lifeCost){const c=R(cost*1.5);if(C.hp<=c)return 'Не хватает здоровья';C.hp-=c;return null;}
  if(P.keys.has('blood')){if(C.hp<=cost)return 'Не хватает здоровья';C.hp-=cost;return null;}
  if(P.keys.has('battery')){const fromEs=Math.min(C.es,cost);if(C.mana<cost-fromEs)return 'Не хватает маны';C.es-=fromEs;C.mana-=cost-fromEs;return null;}
  if(C.mana<cost)return 'Не хватает маны';C.mana-=cost;return null;
}
function affordable(sk,P,cost){cost=cost==null?sk.cost:cost;if(C.freeCast&&!sk.basic)return true;
  if(sk.lifeCost)return C.hp>R(cost*1.5);if(P.keys.has('blood'))return C.hp>cost;if(P.keys.has('battery'))return C.mana+C.es>=cost;return C.mana>=cost;}

async function useSkill(i){
  if(!C||C.busy||C.over)return;
  const P=calc(),sk=i<0?P.basic:P.skills[i];if(!sk)return;

  const echo=(P.U.u_echo||0)+(P.t.echo||0);

      let hits=H;if(sk.fn==='leap')hits=alive().filter(e=>e.d<=Math.max(0,sk.aoeR)+(P.reach||0)).map(e=>({e,m:1}));
      const uniq=new Set(hits.map(h=>h.e)).size,multi=P.t.ex_multi?1+P.t.ex_multi*Math.max(0,uniq-1)/100:1;
      const mul=(r>0||sk.rep>1?sk.repMore:1)*multi;
      for(const h of hits){if(h.e.hp<=0)continue;const res=dealHit(sk,h.e,h.m*mul,h.proj,P);dealt+=res.total;if(res.crit)crits++;hitSet.add(h.e);
        if(sk.cloud&&h===hits[0]){const pc=(res.parts.phys||0)+(res.parts.chaos||0);alive().filter(o=>Math.abs(o.d-h.e.d)<=Math.max(0,sk.aoeR)).forEach(o=>o.st.poi.push({d:pc*.2*sk.poiMore,t:sk.poiDur}));logF('&nbsp;&nbsp;Ядовитое облако');}}
      if(!alive().length)break;
    }
    if(first.move>0){shiftAll(first.move);logC('Вы отскакиваете назад');}
  }
  C.nextCrit=false;C.evaBuff=0;C.blockBuff=0;C.waveActs++;
  if(C.leechPool>0){const ghost=P.keys.has('ghost'),cap=(ghost?P.es:P.life)*P.leechCap,h=Math.min(C.leechPool,cap);
    if(ghost)C.es=Math.min(P.es,C.es+h);else C.hp=Math.min(P.life,C.hp+h);fx('me','+'+fmt(h),'heal');logF(`&nbsp;&nbsp;Вампиризм: +${fmt(h)} ${ghost?'щита':'здоровья'}`);}
  if(C.lifeHitPool>0){const h=C.lifeHitPool;C.hp=Math.min(P.life,C.hp+h);logF(`&nbsp;&nbsp;Восполнение: +${fmt(h)} здоровья`);}
  C.log.push(`<b>${sk.name}</b>: ${fmt(dealt)} урона${crits?` · крит ×${crits}`:''}`);
  render();
  if(!alive().length){await waveCleared();return;}
  await sleep(320);if(!C||C.over)return;await enemyPhase(P);
}
/* проклятие тратит ход и действует на цель и соседние дистанции; метка не тратит ход */
async function useHex(){
  if(!C||C.busy||C.over)return;const P=calc(),h=P.hex;if(!h)return;
  if(!h.ok){toast('Мало атрибута для камня');return;}

  C.busy=true;const hit=alive().filter(e=>Math.abs(e.d-tgt.d)<=1);hit.forEach(e=>applyCurse(e,h));
  logC(`<b>${h.n}</b>: прокляты ${hit.length} враг.`);C.waveActs++;render();

function freeMoveNow(dir,P){
  if(P.freeMove)return true;if(C.free){C.free=false;return true;}
  if(dir>0){if(P.U.u_freeRetreat)return true;if(P.kite&&roll(P.kite))return true;}
  else{if(P.stepFree&&roll(P.stepFree))return true;if(P.U.u_stepStrike&&C.stepCD<=0){C.stepCD=2;return true;}}

async function move(dir){

  const P=calc();
  if(dir>0&&alive().every(e=>e.d>=3)){toast('Дальше отступать некуда');return;}

  shiftAll(dir);

  if(dir<0&&ss){const near=alive().filter(e=>e.d===0).sort((a,b)=>a.hp-b.hp)[0];
    if(near&&!P.basic.bad&&P.basic.cat==='melee'){C.leechPool=0;const r=dealHit(P.basic,near,ss/100,false,P);C.log.push(`Выпад: ${fmt(r.total)} урона`);}}
  render();
  if(!alive().length){await waveCleared();return;}
  if(freeMoveNow(dir,P)){logC('Шаг без потери хода');C.busy=false;render();if(C.auto)scheduleAuto();return;}

/* флаконы: не тратят ход */
function useFlask(k){
  if(!C||C.busy||C.over)return;const f=C.fl[k];if(!f)return;const it=S.equip[f.slot];const P=calc(),st=flaskStats(it,P);
  if(f.ch<st.use){toast('Мало зарядов: убивайте врагов');return;}

  f.ch-=st.use;haptic('light');
  let note=[];
  if(st.type==='life'||st.type==='hybrid'){const h=P.life*st.heal;C.hp=Math.min(P.life,C.hp+h);C.poison=[];fx('me','+'+fmt(h),'heal');note.push(`+${fmt(h)} здоровья`);}
  if(st.type==='mana'||st.type==='hybrid'){const h=Math.max(P.manaMax,1)*st.heal;C.mana=Math.min(P.mana,C.mana+h);note.push(`+${fmt(h)} маны`);}
  if(st.type==='util'){C.fb=C.fb.filter(b=>b.slot!==f.slot);C.fb.push({slot:f.slot,name:it.name,eff:st.eff,turns:st.dur});note.push(Object.entries(st.eff).map(([k,v])=>k==='freeMove'?'шаги без потери хода':`${FLASK_EFF_N[k]} ${v>0&&k!=='dmgTaken'?'+':''}${v}${['armour','eva'].includes(k)?'':'%'}`).join(', ')+` на ${st.dur} х.`);}
  if(st.cure){C.poison=[];C.burn=null;C.cure=2;note.push('очищение');}
  if(st.dmg){C.fb.push({slot:f.slot+'d',name:'Ярость флакона',eff:{dmgMore:st.dmg},turns:2});}

}

async function enemyPhase(P){
  if(!C||C.over)return;
  for(const e of alive()){let d=0;const hx=hexOn(e),dm=1+(hx.dotT||0)/100;
    if(e.st.ign){d+=e.st.ign.d*dm;if(--e.st.ign.t<=0)e.st.ign=null;}
    let drain=0;e.st.poi.forEach(p=>{d+=p.d*dm;p.t--;if(p.drain)drain++;});e.st.poi=e.st.poi.filter(p=>p.t>0);
    if(drain)C.hp=Math.min(P.life,C.hp+P.life*.01*drain);
    if(d>0){d=R(d);e.hp=Math.max(0,e.hp-d);fx(e.uid,fmt(d),'dot');logF(`${e.n}: ${fmt(d)} урона от поджога и яда`);if(e.hp<=0)killEnemy(e,P);}}
  render();if(!alive().length){await waveCleared();return;}
  for(const e of alive()){
    if(!C||C.over)return;C.actor=e.uid;render();await sleep(260);
    if(!C||C.over||e.hp<=0)continue;
    enemyAct(e,P);
    if(e.st.shock)e.st.shock--;if(e.st.chill)e.st.chill--;if(e.st.maim)e.st.maim--;if(e.st.ward)e.st.ward--;
    if(e.st.ee&&--e.st.ee.t<=0)e.st.ee=null;
    if(e.st.curse&&--e.st.curse.t<=0)e.st.curse=null;
    if(e.regen&&e.hp>0)e.hp=Math.min(e.maxHp,e.hp+e.maxHp*e.regen);
    render();if(!C)return;if(C.hp<=0){await death();return;}
  }
  if(!C||C.over)return;
  C.actor='hero';endRound(P);C.busy=false;render();
  if(!alive().length){await waveCleared();return;}
  if(C.auto)scheduleAuto();
}
/* скорость врага: охлаждение −40%, увечье −30%, Темпоральные цепи −50%. Шаги копятся, поэтому замедленный враг всё равно подходит */
function enemySpeed(e,P){if(e.st.chill&&P.U.u_frostbind)return 0;const hx=hexOn(e);
  return e.sp*(e.st.chill?.6:1)*(e.st.maim?.7:1)*(hx.slowM||1);}
function enemyAct(e,P){
  if(e.st.frozen){e.st.frozen=0;logC(`${e.n} заморожен и пропускает ход`);return;}
  if(e.st.stun){e.st.stun=0;logC(`${e.n} оглушён и пропускает ход`);return;}
  const hx=hexOn(e);
  if(hx.skip3&&!e.boss){e.st.tc++;if(e.st.tc%3===0){logC(`${e.n} скован временем и пропускает ход`);return;}}
  if(e.boss){e.turn++;
    if(e.boss.heal&&!e.healed&&e.hp<e.maxHp*.5){e.healed=true;const h=R(e.maxHp*e.boss.heal);e.hp+=h;fx(e.uid,'+'+fmt(h),'heal');logC(`${e.n} исцеляется на ${fmt(h)}`);return;}
    const sp=e.boss.spec.slice().reverse().find(s=>e.turn%s.every===0);
    if(sp){logC(`<span class="boss-t">${e.n}: ${sp.name}!</span>`);
      if(sp.type==='pull'){hurtPlayer(e,e.dmg*sp.m,e.el,'ranged',P);if(e.d>0){e.d=0;logC('Вас подтягивает вплотную');}return;}
      if(sp.type==='nuke'){hurtPlayer(e,e.dmg*sp.m*.5,e.el,'spell',P);hurtPlayer(e,e.dmg*sp.m*.5,sp.el,'spell',P);return;}
      if(sp.type==='summon'){const n=Math.min(sp.n,6-alive().length);for(let i=0;i<n;i++)C.enemies.push(mkEnemy(sp.mon,e.lvl-1,{d:ri(2,3),map:C.I.mt}));return;}
      if(sp.type==='ward'){e.st.ward=sp.t+1;logC(`${e.n} получает вдвое меньше урона ${sp.t} хода`);return;}
    }
  }
  if(e.k==='melee'){
    if(e.d>0){const spd=enemySpeed(e,P);if(spd<=0){logF(`${e.n} скован льдом`);return;}
      e.mv+=spd;const st=Math.floor(e.mv);e.mv-=st;
      if(st>0){const d0=e.d;e.d=Math.max(0,e.d-st);logF(`${e.n} идёт: ${DIST[d0].toLowerCase()} → ${DIST[e.d].toLowerCase()}`);}else logF(`${e.n} замедлен и медленно подходит`);return;}
    for(let h=0;h<e.hits;h++)hurtPlayer(e,e.dmg,e.el,'melee',P);return;
  }
  if(e.d===0&&!e.st.chill&&!e.st.maim&&roll(e.k==='ranged'?55:40)){e.d=1;logF(`${e.n} отходит назад`);return;}
  for(let h=0;h<e.hits;h++)hurtPlayer(e,e.dmg*(e.k==='ranged'?.9:1),e.el,e.k,P);
}
/* множитель урона врага от состояний: охлаждение, проклятия */
function enemyOut(e,P){const hx=hexOn(e);let m=1;
  if(e.st.chill)m*=.85*(1-(P.t.ex_chillEff||0)/100);
  if(hx.weak)m*=1-(e.boss?hx.weak/2:hx.weak)/100;
  return m;}
/* расчёт урона по герою без случайности — для намерений врагов */
function mitigate(raw,el,P){
  let d=raw;
  if(el==='phys'){const arm=P.armour;d*=1-Math.min(.75,arm/(arm+10*d));d*=1-P.physRed/100;}
  else if(el==='chaos'&&P.keys.has('ci'))return 0;else d*=1-(P.res[el]||0)/100;
  if(C.fort)d*=.8;if(P.dmgTaken)d*=1+P.dmgTaken/100;
  if(P.t.ex_lowDR&&C.hp<P.life*.5)d*=1-P.t.ex_lowDR/100;
  if(P.keys.has('wind')&&!C.hitLast)d*=.8;
  return d;
}
function hurtPlayer(e,raw,el,kind,P){
  if(C.hp<=0)return;
  if((kind!=='spell'||P.keys.has('acro')||P.keys.has('arrowdance'))&&roll(evadeChance(P,e.lvl,kind))){fx('me','Уклонение','');logF(`${e.n} [${DIST[e.d].toLowerCase()}]: <span class="good-t">уклонение</span>`);
    if(P.t.ex_evadeCrit)C.nextCrit=true;if(P.t.ex_evadeDmg)C.evaBuff=Math.max(C.evaBuff,P.t.ex_evadeDmg);return;}
  let glance=1;
  if(kind!=='spell'&&P.block&&roll(P.block)){fx('me','Блок','');if(P.U.u_blockHeal)C.hp=Math.min(P.life,C.hp+P.life*P.U.u_blockHeal/100);if(P.t.ex_blockDmg)C.blockBuff=Math.max(C.blockBuff,P.t.ex_blockDmg);
    if(!P.keys.has('glancing')){logF(`${e.n}: <span class="good-t">блок</span>`);return;}glance=.35;logF(`${e.n}: <span class="good-t">скользящий блок</span>`);}
  const base=raw*rnd(.85,1.15)*enemyOut(e,P)*glance;
  let d=mitigate(base,el,P);
  let extra='';
  if(e.fiery){const f=base*e.fiery*(1-P.res.fire/100);d+=f;extra=` + огонь ${fmt(f)}`;}
  d=Math.max(1,R(d));
  const absorbed=R(base-d);
  if(P.keys.has('mom')&&C.mana>0){const m=Math.min(C.mana,d*.3);C.mana-=m;d-=m;}
  let toEs=0;if(!P.keys.has('battery')){toEs=Math.min(C.es,d);C.es-=toEs;d-=toEs;}
  C.hp=Math.max(0,C.hp-d);C.hitThis=true;
  fx('me','−'+fmt(d+toEs),'hurt');haptic('heavy');
  C.log.push(`${e.n}: ${fmt(d+toEs)} (${EL[el]})`);
  logF(`${e.n} [${DIST[e.d].toLowerCase()}] ${kind==='melee'?'бьёт':kind==='ranged'?'стреляет':'колдует'}: <b class="bad-t">${fmt(d+toEs)}</b> ${EL[el]}${extra}${absorbed>0?` <span class="dim">(защита поглотила ${fmt(absorbed)})</span>`:''}${toEs?` · щит −${fmt(toEs)}`:''}`);
  if(e.vamp)e.hp=Math.min(e.maxHp,e.hp+d*e.vamp);
  if(e.poison&&!P.keys.has('ci')&&!C.cure&&roll(40)){C.poison.push({d:d*.15,t:3});logF('&nbsp;&nbsp;Вы отравлены');}
  if(el==='fire'&&!C.cure&&roll(15)){C.burn={d:d*.2,t:2};logF('&nbsp;&nbsp;Вы горите');}
  if(P.rage)C.rage=Math.min(P.rageMax,C.rage+5);
  if(kind==='melee'&&P.t.ex_chillAtk&&e.hp>0){e.st.chill=2;}
  if(kind==='melee'&&P.t.ex_counter&&C.hp>0&&e.hp>0&&roll(P.t.ex_counter)&&!P.basic.bad){C.leechPool=0;logF('&nbsp;&nbsp;<b>Контратака</b>');const h=dealHit(P.basic,e,1,false,P);C.log.push(`Контратака! ${fmt(h.total)}`);}
}
/* восстановление за ход: здоровье, мана, щит */
function regenTick(P,mult=1){
  const lowB=P.U.u_lowRegen&&C.hp<P.life/2?2:1,rg=P.life*P.regen*lowB/100*mult;
  if(P.keys.has('zealot'))C.es=Math.min(P.es,C.es+rg);else C.hp=Math.min(P.life,C.hp+rg);
  C.mana=Math.min(P.mana,C.mana+(P.mreg+P.manaMax*.06)*mult);
  C.es=Math.min(P.es,C.es+P.es*P.esRech*mult);
}
function endRound(P){
  let dot=0;
  if(C.poison.length){dot+=C.poison.reduce((a,p)=>a+p.d,0);C.poison.forEach(p=>p.t--);C.poison=C.poison.filter(p=>p.t>0);}
  if(C.burn){dot+=C.burn.d;if(--C.burn.t<=0)C.burn=null;}
  if(dot){dot=R(dot);C.hp=Math.max(1,C.hp-dot);fx('me','−'+dot,'dot');logF(`Яд и горение: −${dot} здоровья`);}
  regenTick(P);
  if(P.U.u_immolate){const d0=P.life*P.U.u_immolate/100;alive().filter(e=>e.d===0).forEach(e=>{const v=R(d0*(1-(e.res.fire||0)/100));e.hp=Math.max(0,e.hp-v);fx(e.uid,fmt(v),'dot');logF(`Саван жжёт ${e.n}: ${fmt(v)}`);if(e.hp<=0)killEnemy(e,P);});}
  if(C.fort)C.fort--;if(C.eo)C.eo--;if(C.cure)C.cure--;if(C.stepCD)C.stepCD--;
  C.fb.forEach(b=>b.turns--);C.fb=C.fb.filter(b=>b.turns>0);
  if(P.rage&&!P.U.u_rage)C.rage=Math.max(0,C.rage-2);
  C.hitLast=C.hitThis;C.hitThis=false;
  C.turn++;
}

let pendingReward=null;
async function waveCleared(){
  C.busy=true;save();
  if(C.wave<C.waves){logC(`<b class="gold-t">Волна ${C.wave} зачищена</b>`);render();await sleep(700);if(!C||C.over)return;

    if(P.t.ex_waveHeal){C.hp=Math.min(P.life,C.hp+P.life*P.t.ex_waveHeal/100);C.mana=Math.min(P.mana,C.mana+P.mana*P.t.ex_waveHeal/100);}
    if(P.t.ex_flaskWave)C.fl.forEach(f=>{if(!f)return;const st=flaskStats(S.equip[f.slot],P);f.ch=Math.min(st.max,f.ch+P.t.ex_flaskWave);});
    C.fb.forEach(b=>b.turns--);C.fb=C.fb.filter(b=>b.turns>0);if(C.fort)C.fort--;
    spawnWave();C.busy=false;render();if(C.auto)scheduleAuto();return;}

async function battleWon(){

  const B=C.B;let note='',cont=null;

    const b=BATTLES[B.g],A=ACTS[b.act];

        if(b.act===2)note+=' Открыт Лабиринт испытаний.';if(b.act===3)note+=' Открыт Жестокий лабиринт.';}
      else if(rw){pendingReward={type:rw};if(rw==='support'){S.bonus++;note='Задание выполнено: +1 очко древа.';}}
      if(B.g===BATTLES.length-1&&!S.done){S.done=true;S.maps[1]=(S.maps[1]||0)+2;note='Кампания пройдена! Открыто убежище с устройством картографа (+2 карты 1 тира) и Беспощадный лабиринт. Все умения теперь доступны.';}
    }

  }else if(B.type==='lab'){

async function death(){

/* ---- намерения врагов на следующий ход ---- */
function intent(e,P){
  if(e.hp<=0)return null;
  if(e.st.frozen||e.st.stun)return {t:'Пропустит ход',c:'ok'};
  const hx=hexOn(e);if(hx.skip3&&!e.boss&&(e.st.tc+1)%3===0)return {t:'Пропустит ход',c:'ok'};
  const om=enemyOut(e,P);
  if(e.boss){const nt=e.turn+1;if(e.boss.heal&&!e.healed&&e.hp<e.maxHp*.5)return {t:'Исцелится',c:'warn'};
    const sp=e.boss.spec.slice().reverse().find(s=>nt%s.every===0);
    if(sp)return {t:`Готовит: ${sp.name}`+(sp.type==='nuke'||sp.type==='pull'?` ~${fmt((mitigate(e.dmg*sp.m*.5,e.el,P)+mitigate(e.dmg*sp.m*.5,sp.el||e.el,P))*om)}`:''),c:'bad'};}
  if(e.k==='melee'){
    if(e.d>0){const spd=enemySpeed(e,P);if(spd<=0)return {t:'Скован',c:'ok'};const st=Math.floor(e.mv+spd);return st>0?{t:`Идёт → ${DIST[Math.max(0,e.d-st)].toLowerCase()}`,c:''}:{t:'Замедлен, не дойдёт',c:'ok'};}
    return {t:`Бьёт ~${fmt(mitigate(e.dmg,e.el,P)*e.hits*om)}`,c:'warn'};}
  return {t:`${e.k==='ranged'?'Стреляет':'Колдует'} ~${fmt(mitigate(e.dmg*(e.k==='ranged'?.9:1),e.el,P)*e.hits*om)}`,c:'warn'};
}

/* ---- автобой ---- */
let autoT=null;
function scheduleAuto(){clearTimeout(autoT);autoT=setTimeout(autoStep,window.FAST?0:450);}
function autoStep(){
  if(!C||!C.auto||C.busy||C.over)return;
  const P=calc();
  C.fl.forEach((f,k)=>{if(!f)return;const it=S.equip[f.slot],st=flaskStats(it,P);if(f.ch<st.use)return;
    if(st.type==='life'&&C.hp<P.life*.5)useFlask(k);
    else if(st.type==='hybrid'&&(C.hp<P.life*.5||C.mana<P.mana*.25))useFlask(k);
    else if(st.type==='mana'&&C.mana<P.mana*.3)useFlask(k);
    else if(st.type==='util'&&!C.fb.some(b=>b.slot===f.slot)&&(alive().some(e=>e.boss)||alive().length>=3||C.hp<P.life*.7))useFlask(k);});
  /* метка — бесплатно; проклятие — на сильную группу */
  const h=P.hex;
  if(h&&h.ok&&affordable({},P,h.cost)){
    if(h.kind==='mark'&&!alive().some(e=>e.st.mark)){const t=alive().sort((a,b)=>b.hp-a.hp)[0];if(t){C.target=t.uid;useHex();}}
    else if(h.kind==='curse'){const t=alive().slice().sort((a,b)=>b.hp-a.hp)[0];
      if(t&&!t.st.curse&&(t.boss||t.rar==='rare'||alive().filter(e=>Math.abs(e.d-t.d)<=1&&!e.st.curse).length>=3)){C.target=t.uid;return useHex();}}}
  const usable=[0,1,2,3].map(i=>P.skills[i]).filter(sk=>sk&&!sk.bad&&!sk.move&&affordable(sk,P)&&(AREA_FN.has(sk.fn)?canTarget(sk,P)&&!ALWAYS_FN.has(sk.fn):pickTarget(sk,P)));
  const pick_=usable.sort((a,b)=>b.avg*hitsGuess(b,P)-a.avg*hitsGuess(a,P))[0];
  const bestMelee=Math.max(0,...[0,1,2,3].map(i=>P.skills[i]).filter(sk=>sk&&!sk.bad&&MELEE_FN.includes(sk.fn)&&!canTarget(sk,P)).map(sk=>sk.avg));
  const cur=pick_?pick_.avg*hitsGuess(pick_,P):(pickTarget(P.basic,P)&&!P.basic.bad?P.basic.avg:0);
  const moveSk=[0,1,2,3].map(i=>P.skills[i]).find(sk=>sk&&!sk.bad&&sk.move&&affordable(sk,P));
  if(bestMelee>cur*2.2&&alive().some(e=>e.d>0)&&!alive().some(e=>e.d===0)){
    if(moveSk&&moveSk.fn==='leap'&&pickTarget(moveSk,P))return useSkill(moveSk.slot);return move(-1);}
  const meleeNear=alive().some(e=>e.d===0&&e.k==='melee');
  if(pick_&&pick_.cat!=='melee'&&bestMelee===0&&meleeNear&&alive().some(e=>e.d<3)){
    if(moveSk&&(moveSk.fn==='escape'||moveSk.fn==='flamedash')&&C.hp<P.life*.75)return useSkill(moveSk.slot);
    const canRet=alive().some(e=>e.d<3)&&(P.freeMove||P.U.u_freeRetreat||P.kite>=25||(C.hp<P.life*.6&&alive().filter(e=>e.d===0).length>=2&&C.turn-(C.lastRet||-9)>=3));
    if(canRet){C.lastRet=C.turn;return move(1);}}
  if(pick_)return useSkill(pick_.slot);
  if(moveSk&&moveSk.fn==='leap'&&pickTarget(moveSk,P))return useSkill(moveSk.slot);
  if(!P.basic.bad&&pickTarget(P.basic,P))return useSkill(-1);
  return move(-1);
}
function hitsGuess(sk,P){const al=alive();if(['all0','slam','rain','escape','nova','blight','band','knives','shrapnel'].includes(sk.fn))return Math.max(1,al.filter(e=>inRange(sk,e,P)).length*.9);
  if(sk.fn==='cyclone'||sk.fn==='balllight')return Math.max(1,al.filter(e=>inRange(sk,e,P)).length*.9)*sk.n*.4/.45;
  if(['split','arc','larrow','lstrike','molten','sunder','explosive'].includes(sk.fn))return Math.min(al.length,1+(sk.n||1)*.6+(sk.chain||0)*.6);
  if(sk.fn==='tornado')return 1+sk.n*.4;
  if(sk.fn==='barrage'||sk.fn==='spark'||sk.fn==='dstrike')return (sk.n+sk.extra)*.8;return 1+sk.extra*.3;}

/* ---------- сферы ---------- */
function applyOrb(it,k){
  if(!(S.cur[k]>0)||!ORBS[k].ok(it))return false;
  if(k==='regal'&&it.slot==='flask'){toast('Флакон не может быть редким');return false;}
  if(k==='exalt'&&it.mods.length>=6){toast('Нет места для свойства');return false;}
  S.cur[k]--;
  const flask=it.slot==='flask';
  if(k==='trans'){it.rar='magic';rollMods(it,ri(1,2));}
  if(k==='aug')rollMods(it,1);
  if(k==='alt'){it.mods=[];rollMods(it,ri(1,2));}
  if(k==='regal'){it.rar='rare';delete it.rname;rollMods(it,1);}
  if(k==='alch'){if(flask){it.rar='magic';rollMods(it,2);}else{it.rar='rare';delete it.rname;rollMods(it,rareN(it.ilvl));}}
  if(k==='chaos'){it.mods=[];delete it.rname;rollMods(it,rareN(it.ilvl));}
  if(k==='scour'){it.mods=[];it.rar='normal';delete it.rname;}
  if(k==='divine'){it.mods.forEach(m=>{if(m.cr)return;if(flask)m.v=ri(FMODS[m.k].r[0],FMODS[m.k].r[1]);else if(MODS[m.k]){const r=rollMod(m.k,it.ilvl);m.v=r.v;}});}
  if(k==='exalt')rollMods(it,1);
  nameItem(it);haptic('medium');save();toast(`${ORBS[k].n}: ${it.name}`);return true;
}

const MAP_NAMES=['Затерянный склеп','Пепельные дюны','Кристальная пещера','Чумной квартал','Затонувший храм','Обсерватория','Кладбище кораблей','Висячие сады','Литейная бездны','Терновая чаща','Соляные копи','Башня часовщика'];
const mapCount=()=>Object.values(S.maps).reduce((a,b)=>a+b,0);

/* ---------- лабиринт ---------- */
function labUnlock(n){
  const a3=S.done||S.prog>ACTS[2].last,a4=S.done||S.prog>ACTS[3].last;
  if(n===0)return a3?null:LABS[0].need;
  if(n===1)return !a4?LABS[1].need:!S.labs[0]?'Сначала пройдите Лабиринт испытаний':null;
  if(n===2)return !S.done?LABS[2].need:!S.labs[1]?'Сначала пройдите Жестокий лабиринт':null;
  return !S.labs[2]?'Сначала пройдите Беспощадный лабиринт':S.offer<1?LABS[3].need:null;
}
const anyLabOpen=()=>[0,1,2,3].some(n=>!labUnlock(n));
function genLab(n){
  const R_=LABS[n].rooms,W={fight:3,trap:2.2,puzzle:1.6,shrine:1.1,font:.8,vault:1.2},steps=[];
  for(let i=0;i<R_;i++){
    const k=i%3===1?3:2,pool=Object.keys(W).filter(t=>!(i===0&&t==='vault')&&!(i===0&&t==='font')),opts=[];
    if(i===R_-1)opts.push('font');
    while(opts.length<k){let tot=0;pool.forEach(t=>{if(!opts.includes(t))tot+=W[t];});let r=Math.random()*tot;
      for(const t of pool){if(opts.includes(t))continue;r-=W[t];if(r<=0){opts.push(t);break;}}}
    steps.push(shuffle(opts));
  }
  return steps;
}
function enterLab(n){
  if(labUnlock(n))return false;
  if(n===3)S.offer--;
  S.labRun={n,step:0,steps:genLab(n),hp:1,fl:null,keys:0,buffs:[],room:null,log:[]};save();return true;
}
function labLog(t){const L=S.labRun;if(L){L.log.push(t);if(L.log.length>12)L.log.shift();}}
function labRoomDone(){const L=S.labRun;L.step++;L.room=null;}
function trapNeed(){return R(20+LABS[S.labRun.n].lvl*1.1);}
function trapChance(a){const P=calc();return clamp(R(40+(P.attr[a]-trapNeed())*1.5),10,95);}
function labHurt(f){const L=S.labRun;L.hp=Math.max(0,L.hp-f);if(L.hp<=0){labFail();return true;}return false;}
let labFailNote=null;
function labFail(){S.labRun=null;S.deaths++;labFailNote='Вы пали в лабиринте. Попробуйте снова — лабиринт каждый раз перестраивается.';save();}
function labChoose(i){
  const L=S.labRun;if(!L||L.room)return;const type=L.steps[L.step][i];
  if(type==='fight'){L.room={type};save();startBattle({type:'lab'});return;}
  if(type==='trap'){L.room={type,traps:shuffle(TRAPS).slice(0,3),i:0,res:[]};}
  if(type==='puzzle'){L.room={type,secret:shuffle([0,1,2,3]).slice(0,3),tries:[],cur:[],max:5,state:'play'};}
  if(type==='shrine'){L.room={type,opts:shuffle(SHRINES.map((_,j)=>j).filter(j=>!L.buffs.includes(j))).slice(0,2)};}
  if(type==='font'){L.hp=1;L.fl=null;labLog('Фонтан исцелил вас и наполнил флаконы');L.room={type,done:1};}
  if(type==='vault'){if(L.keys>0){L.keys--;const P=calc(),got=[];
      for(let j=0;j<2;j++){const it=Math.random()<.25?makeUnique(LABS[L.n].lvl):makeItem(rollSlot()==='flask'?'ring':rollSlot(),LABS[L.n].lvl,'rare');
        if(S.inv.length<INV_MAX){S.inv.push(it);it.isNew=1;got.push(it.name);}}
      const o=rollOrb();S.cur[o]=(S.cur[o]||0)+1;got.push(ORBS[o].n);
      labLog('Тайник открыт: '+got.join(', '));L.room={type,done:1,got};}
    else{labLog('Тайник заперт: нужен золотой ключ');L.room={type,done:1,got:null};}}
  save();
}
function labTrap(j){
  const L=S.labRun,R0=L.room;if(!R0||R0.type!=='trap'||R0.i>=3)return;
  const t=R0.traps[R0.i],a=t.o[j][0],ch=trapChance(a),ok=roll(ch);
  let note;
  if(ok){note=`${t.n}: успех (${ATTR[a].toLowerCase()}, ${ch}%)`;if(roll(25)){L.keys++;note+=' · найден золотой ключ';}}
  else{const f=rnd(.12,.2);note=`${t.n}: провал — −${R(f*100)}% здоровья`;R0.res.push({ok,note});R0.i++;labLog(note);if(labHurt(f))return;save();return;}
  R0.res.push({ok,note});R0.i++;labLog(note);save();
}
function labPz(sym){

    if(ex===3){R0.state='win';S.labRun.keys++;const gold=R(40+LABS[S.labRun.n].lvl*6);S.gold+=gold;labLog(`Механизм поддался: золотой ключ и ${gold} зол.`);}
    else{if(labHurt(.05))return;if(R0.tries.length>=R0.max){R0.state='lose';labLog('Механизм заклинило: шипы ранят вас');if(labHurt(.12))return;}}}

}
function labShrine(k){const L=S.labRun,R0=L.room;if(!R0||R0.type!=='shrine')return;L.buffs.push(k);labLog(`Благословение: ${SHRINES[k].n}`);R0.done=1;save();}
function labNext(){const L=S.labRun;if(!L||!L.room)return;labRoomDone();save();}
let labResult=null;
function finishLab(){
  const L=S.labRun,first=!S.labs[L.n],lvl=LABS[L.n].lvl;S.labs[L.n]=1;

/* ---------- верстак ---------- */
function benchBlock(it){
  if(!it)return 'Выберите предмет';
  if(it.slot==='flask')return 'Флаконы нельзя улучшать на верстаке';
  if(it.rar!=='magic'&&it.rar!=='rare')return 'Только волшебные и редкие предметы';

  return null;
}
const benchFor=it=>BENCH.filter(r=>modAllowed(r.k,it)&&!it.mods.some(m=>m.k===r.k));
const canPay=r=>S.gold>=r.g&&Object.entries(r.cost).every(([k,n])=>(S.cur[k]||0)>=n);
function benchCraft(it,k){
  const r=BENCH.find(x=>x.k===k);if(!r||benchBlock(it)||!modAllowed(k,it)||!canPay(r))return false;
  S.gold-=r.g;for(const o in r.cost)S.cur[o]-=r.cost[o];
  it.mods.push({k,v:benchVal(k,it.ilvl),cr:1});nameItem(it);save();return true;
}
function benchRemove(it){const c=benchRemoveCost(it);if(S.gold<c||!it.mods.some(m=>m.cr))return false;S.gold-=c;it.mods=it.mods.filter(m=>!m.cr);save();return true;}

/* ---------- мишень ---------- */
const DUMMY_PRESETS={none:{n:'Без защиты',res:0,ch:0,arm:0},normal:{n:'Обычный враг',res:0,ch:0,arm:1},tough:{n:'Стойкий враг',res:40,ch:25,arm:3},boss:{n:'Босс карт',res:40,ch:25,arm:2,boss:1}};
function dummySim(i,preset,d,hex){
  const P=calc(),sk=i<0?P.basic:P.skills[i];if(!sk)return {err:'Пустой слот'};if(sk.bad)return {err:sk.bad};
  const pr=DUMMY_PRESETS[preset];const saved=C;
  const e={uid:'dummy',n:'Мишень',lvl:S.lvl,hp:1e12,maxHp:1e12,d,res:{fire:pr.res,cold:pr.res,light:pr.res,chaos:pr.ch},arm:pr.arm*(S.lvl*4+6),
    st:{ign:null,poi:[],frozen:0,stun:0,shock:0,chill:0,maim:0,curse:null,mark:null,ee:null,ward:0,tc:0},touched:true,mods:[],rar:pr.boss?'boss':'normal',boss:pr.boss?{}:null,k:'melee'};
  C={B:{type:'dummy'},I:{lvl:S.lvl},enemies:[e],fx:[],log:[],full:null,hp:P.life,mana:P.mana,es:P.es,kills:0,waveActs:1,eo:0,evaBuff:0,blockBuff:0,rage:0,fb:[]};
  try{
    if(hex&&P.hex&&P.hex.ok){if(P.hex.kind==='curse')e.st.curse={id:P.hex.id,L:P.hex.L,f:P.hex.f,t:9};else e.st.mark={id:P.hex.id,L:P.hex.L,f:P.hex.f};}
    if(!ALWAYS_FN.has(sk.fn)&&!inRange(sk,e,P)&&sk.fn!=='leap')return {err:`Не достаёт до мишени на дистанции «${DIST[d].toLowerCase()}»`};
    const N=400;let sum=0,hits=0,crits=0,dot=0,ign=0,shock=0,frz=0,poi=0;const parts={};
    for(let n=0;n<N;n++){
      let H=sk.fn==='leap'?[{e,m:1}]:skillHits(sk,e,P).H;if(sk.fn==='flamedash'&&!H.length)H=[];
      for(let r=0;r<sk.rep;r++){const mul=sk.rep>1?sk.repMore:1;
        for(const h of H){const x=rollHit(sk,P,e,h.m*mul,h.proj,false);sum+=x.total;hits++;if(x.crit)crits++;
          for(const k in x.parts)parts[k]=(parts[k]||0)+x.parts[k];
          const cb=x.crit?30:0;
          if(!sk.noAil&&x.parts.fire>0){const c=clamp(10+sk.ail.ignite+cb,0,100)/100;ign+=c;dot+=c*x.parts.fire*.3*sk.ignMore*sk.ignDur/H.length;}
          if(!sk.noAil&&x.parts.light>0)shock+=clamp(10+sk.ail.shock+cb,0,100)/100;
          if(!sk.noAil&&x.parts.cold>0)frz+=clamp(6+sk.ail.freeze+cb,0,100)/100;
          const pc=(x.parts.phys||0)+(x.parts.chaos||0);if(pc>0){const c=clamp(sk.ail.poison,0,100)/100;poi+=c;dot+=c*pc*.2*sk.poiMore*sk.poiDur;}}}
    }
    const hx=hexOn(e);dot*=1+(hx.dotT||0)/100;
    const res={name:sk.name,perCast:sum/N,perHit:hits?sum/hits:0,hitsPerCast:hits/N,critRate:hits?crits/hits:0,dot:dot/N,parts:{},
      ign:hits?ign/hits:0,shock:hits?shock/hits:0,frz:hits?frz/hits:0,poi:hits?poi/hits:0,cost:sk.cost};
    for(const k in parts)res.parts[k]=parts[k]/N;
    return res;
  }finally{C=saved;}
}

const stashCap=()=>30*ACC.stash.tabs;

function toStash(uid){const it=S.inv.find(x=>x.uid===uid);if(!it)return false;if(ACC.stash.items.length>=stashCap()){toast('Тайник полон');return false;}
  S.inv=S.inv.filter(x=>x!==it);delete it.isNew;ACC.stash.items.push(it);save();return true;}
function fromStash(uid){const it=ACC.stash.items.find(x=>x.uid===uid);if(!it)return false;if(S.inv.length>=INV_MAX){toast('Сумка полна');return false;}
  ACC.stash.items=ACC.stash.items.filter(x=>x!==it);S.inv.push(it);save();return true;}

/* ---------- аукцион ----------
   Без сервера: лоты хранятся в аккаунте и видны всем вашим персонажам (один выставляет, другой покупает).
   С сервером (AUCTION_URL): лоты общие для всех игроков; продавец определяется по Telegram-аккаунту,
   поэтому удаление персонажа не трогает выставленные и проданные вещи. Налог аукциона — 5%. */
const AUC_TAX=.05;
const AUC={
  mode(){return AUCTION_URL&&tg&&tg.initData?'server':'local';},
  async req(path,opt={}){
    const r=await fetch(AUCTION_URL.replace(/\/$/,'')+path,{method:opt.method||'GET',headers:{'Content-Type':'application/json','X-Tg-Init-Data':tg.initData},body:opt.body?JSON.stringify(opt.body):undefined});
    const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Ошибка сервера '+r.status));return j;},
  async list(){
    if(this.mode()==='local')return ACC.auc.lots.filter(l=>!l.sold).map(l=>({...l,mine:l.seller.cid===S.id}));
    return (await this.req('/lots')).lots;},
  async mine(){
    if(this.mode()==='local')return {lots:ACC.auc.lots.filter(l=>!l.sold),sold:ACC.auc.lots.filter(l=>l.sold).slice(-15).reverse(),purse:ACC.aucGold||0};
    return await this.req('/me');},
  async post(it,price){
    if(this.mode()==='local'){ACC.auc.lots.push({id:'L'+(++ACC.auc.seq),item:it,price,seller:{cid:S.id,name:S.name},ts:Date.now()});return;}
    await this.req('/lots',{method:'POST',body:{item:it,price,seller:S.name}});},
  async buy(id){
    if(this.mode()==='local'){const l=ACC.auc.lots.find(x=>x.id===id&&!x.sold);if(!l)throw new Error('Лот уже продан');
      if(l.seller.cid===S.id)throw new Error('Это лот этого же персонажа. Купите его другим персонажем или снимите с продажи');
      l.sold=true;l.buyer=S.name;l.soldAt=Date.now();ACC.aucGold=(ACC.aucGold||0)+R(l.price*(1-AUC_TAX));
      const it=l.item;l.item={name:it.name,rar:it.rar};
      const sold=ACC.auc.lots.filter(x=>x.sold);if(sold.length>30){const drop=new Set(sold.slice(0,sold.length-30));ACC.auc.lots=ACC.auc.lots.filter(x=>!drop.has(x));}
      return it;}
    return (await this.req('/lots/'+encodeURIComponent(id)+'/buy',{method:'POST',body:{buyer:S.name}})).item;},
  async cancel(id){
    if(this.mode()==='local'){const l=ACC.auc.lots.find(x=>x.id===id&&!x.sold);if(!l)throw new Error('Лот не найден');ACC.auc.lots=ACC.auc.lots.filter(x=>x!==l);return l.item;}
    return (await this.req('/lots/'+encodeURIComponent(id)+'/cancel',{method:'POST'})).item;},
  async claim(){
    if(this.mode()==='local'){const g=ACC.aucGold||0;ACC.aucGold=0;return g;}
    return (await this.req('/claim',{method:'POST'})).gold||0;},
};

function statusChips(e){
  const c=[];if(e.st.ign)c.push(['Поджог','var(--fire)']);if(e.st.poi.length)c.push(['Яд×'+e.st.poi.length,'var(--chaos)']);
  if(e.st.frozen)c.push(['Лёд','var(--cold)']);else if(e.st.chill)c.push(['Холод','var(--cold)']);if(e.st.shock)c.push(['Шок','var(--light)']);if(e.st.stun)c.push(['Оглушён','var(--phys)']);if(e.st.maim)c.push(['Увечье','var(--phys)']);
  if(e.st.curse)c.push([HEXES[e.st.curse.id].n+(e.st.curse.t<50?' '+e.st.curse.t:''),'var(--chaos)']);if(e.st.mark)c.push(['◎ '+HEXES[e.st.mark.id].n.replace('Метка ',''),'var(--dex)']);
  if(e.st.ward)c.push(['Щит','var(--gold2)']);
  e.mods.forEach(m=>c.push([m,e.rar==='rare'?'var(--r-rare)':'var(--r-magic)']));

}
function buffRow(P){

  C.fb.forEach(f=>b.push(chip(`${f.name.split(' ').slice(-2).join(' ')} ${f.turns}`,'var(--r-magic)')));
  if(C.fort)b.push(chip(`Укрепление ${C.fort}`,'var(--phys)'));
  if(C.eo)b.push(chip('Перегрузка','var(--light)'));
  if(C.nextCrit)b.push(chip('След. удар — крит','var(--dex)'));
  if(C.evaBuff)b.push(chip(`После уклонения +${C.evaBuff}%`,'var(--dex)'));
  if(C.blockBuff)b.push(chip(`После блока +${C.blockBuff}%`,'var(--str)'));
  if(C.free)b.push(chip('Свободный шаг','var(--good)'));
  if(C.freeCast)b.push(chip('Бесплатное умение','var(--int)'));

const TV={k:.4,x:0,y:0,init:false};
const ATTR_COL={str:'#cf5f4b',dex:'#6fae55',int:'#5d8fde'};
function nodeState(id){
  const has=S.alloc.includes(id),n=NODES[id];
  if(has)return 'on';if(n.t==='start')return 'foreign';
  return n.adj.some(a=>S.alloc.includes(a))?'avail':'off';
}
function pathTo(id){
  const al=new Set(S.alloc);if(al.has(id))return [];if(NODES[id].t==='start')return null;
  const prev={},seen=new Set(al),q=[...al];
  while(q.length){const x=q.shift();for(const y of NODES[x].adj){if(seen.has(y)||NODES[y].t==='start')continue;seen.add(y);prev[y]=x;
    if(y===id){const p=[];let c=y;while(!al.has(c)){p.unshift(c);c=prev[c];}return p;}q.push(y);}}
  return null;
}
function canRemove(id){
  const set=new Set(S.alloc);set.delete(id);const st=startNode(S.cls),seen=new Set([st]),q=[st];
  while(q.length){const x=q.pop();NODES[x].adj.forEach(a=>{if(set.has(a)&&!seen.has(a)){seen.add(a);q.push(a);}});}
  return seen.size===set.size;
}
const refundCost=()=>R(5+S.lvl*2.5);
function nodeStats(n){if(n.t==='attr'){const a=S.attrPick[n.id]||(S.alloc.includes(n.id)?n.def:S.attrDef);return {[a]:ATTR_NODE};}return n.s;}
function treeSvg(){

  const edges=EDGES.map(([a,b])=>{const A=NODES[a],B=NODES[b],on=al.has(a)&&al.has(b),half=al.has(a)||al.has(b),pp=(path.has(a)||al.has(a))&&(path.has(b)||al.has(b))&&!on;
    return `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="${on?'#c9a24a':pp?'#e6c57a':half?'#6a5634':'#3a2f27'}" stroke-width="${on?7:pp?5:4}" ${pp?'stroke-dasharray="10 7"':''}/>`;}).join('');
  const nodes=Object.values(NODES).map(N=>{const st=nodeState(N.id);
    const r=N.t==='key'?24:N.t==='notable'?16:N.t==='start'?22:N.t==='attr'?8:9;
    let fill=st==='on'?(N.t==='key'?'#e6c57a':'#c9a24a'):N.t==='start'?'#2a2018':path.has(N.id)?'#4a3a22':'#1c1612';
    if(N.t==='attr'&&st==='on')fill=ATTR_COL[S.attrPick[N.id]||N.def];
    const stroke=st==='on'?'#f3dca0':st==='avail'?'#e6c57a':N.t==='start'?'#6f5a3c':N.t==='key'?'#8a6a3a':N.t==='attr'?'#4e5a46':'#5a4a3c';
    const shape=N.t==='key'?`<rect x="${N.x-r}" y="${N.y-r}" width="${2*r}" height="${2*r}" transform="rotate(45 ${N.x} ${N.y})" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`
      :N.t==='attr'?`<rect x="${N.x-r}" y="${N.y-r}" width="${2*r}" height="${2*r}" rx="2" fill="${fill}" stroke="${stroke}" stroke-width="${st==='avail'?3.5:2.5}"/>`

    const ring=selNode===N.id?`<circle cx="${N.x}" cy="${N.y}" r="${r+9}" fill="none" stroke="#f3dca0" stroke-width="2.5" stroke-dasharray="5 4"/>`:'';
    return `<g data-id="${N.id}">${ring}<circle cx="${N.x}" cy="${N.y}" r="${r+14}" fill="transparent"/>${shape}${lab}</g>`;}).join('');

function applyTV(){const g=document.getElementById('treeg');if(g)g.setAttribute('transform',`translate(${TV.x} ${TV.y}) scale(${TV.k})`);}
function centerOn(id){const box=document.getElementById('treebox');if(!box)return;const N=NODES[id];TV.x=box.clientWidth/2-N.x*TV.k;TV.y=box.clientHeight/2-N.y*TV.k;applyTV();}
function zoomAt(f,cx,cy){const k=clamp(TV.k*f,.12,1.4);const wx=(cx-TV.x)/TV.k,wy=(cy-TV.y)/TV.k;TV.k=k;TV.x=cx-wx*k;TV.y=cy-wy*k;applyTV();}
function bindTree(){
  const box=document.getElementById('treebox');if(!box)return;
  if(!TV.init){TV.k=.45;centerOn(startNode(S.cls));TV.init=true;}else applyTV();
  const pts=new Map();let moved=0,pinch=null;
  box.onpointerdown=e=>{if(e.target.closest('.tzoom'))return;box.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1)moved=0;
    if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:TV.k};moved=99;}};
  box.onpointermove=e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){TV.x+=dx;TV.y+=dy;moved+=Math.abs(dx)+Math.abs(dy);applyTV();}
    else if(pts.size===2&&pinch){const [a,b]=[...pts.values()],r=box.getBoundingClientRect(),d=Math.hypot(a.x-b.x,a.y-b.y);

  const up=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);if(pts.size<2)pinch=null;

/* =========================================================
   ИНТЕРФЕЙС: вещи, торговец, тайник, аукцион, убежище, лабиринт, действия
