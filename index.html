function itemLines(it){
  let body='';
  if(it.slot==='flask'){const st=flaskStats(it,calc()),F=FLASKS[it.fk];
    if(st.heal)body+=`<div>${F.type==='mana'?'Восстанавливает':'Лечит'} ${R(st.heal*100)}% ${F.type==='life'?'здоровья':F.type==='mana'?'маны':'здоровья и маны'}</div>`;
    if(st.eff)body+=`<div>${Object.entries(st.eff).map(([k,v])=>k==='freeMove'?'Шаги не тратят ход':`${FLASK_EFF_N[k]}: ${v>0&&k!=='dmgTaken'?'+':''}${v}${['armour','eva'].includes(k)?'':'%'}`).join(', ')} · ${st.dur} хода</div>`;
    body+=`<div class="dim small">Заряды: ${st.use} за применение, максимум ${st.max}. Заряды копятся за убийства. Не тратит ход.</div>`;
    const uq=it.uq!=null?UNIQUE_FLASKS[it.uq]:null;if(uq)body+=`<div class="sep"></div><div class="mod">${uq.d}</div>`;
    else if(it.mods.length)body+=`<div class="sep"></div>`+it.mods.map(m=>`<div class="mod">${FMODS[m.k].d(m.v)}</div>`).join('');
    return body;}
  if(it.wd){const w=wInfo(it),W_=WEAP[it.wk];body+=`<div class="dim small">${W_.n} · ${W_.h===2?'двуручное':'одноручное'} · свойства: ${WC_N[wcOf(it)]}${W_.spell?' · можно колдовать':''}</div><div class="num">Физ. урон: ${R(w.min)}–${R(w.max)}</div><div class="num">Шанс крита: ${w.crit.toFixed(1)}%</div>`;}
  const d=itemDef(it);if(d){body+=`<div class="dim small">База: ${DT_N[it.dt]}</div>`+Object.entries(d).map(([k,v])=>`<div class="num">${DEF_N[k]}: ${v}</div>`).join('');}
  if(it.block)body+=`<div class="num">Шанс блока: ${it.block}%</div>`;
  const imp=Object.entries(it.imp||{});if(imp.length)body+=`<div class="sep"></div>`+imp.map(([k,v])=>`<div>${lbl(k,v)}</div>`).join('');
  const mods=it.mods.filter(m=>!String(m.k).startsWith('u_')&&!m.cr),um=it.mods.filter(m=>String(m.k).startsWith('u_')),cr=it.mods.filter(m=>m.cr);
  if(mods.length)body+=`<div class="sep"></div>`+mods.map(m=>`<div class="mod">${lbl(m.k,m.v)}</div>`).join('');
  if(cr.length)body+=cr.map(m=>`<div class="crmod">${lbl(m.k,m.v)} <small>(мастер)</small></div>`).join('');
  if(um.length)body+=`<div class="sep"></div>`+um.map(m=>`<div class="umod">${lbl(m.k,m.v)}</div>`).join('');
  return body;
}
function itemCard(it){
  if(!it)return '';
  return `<div class="card r-${it.rar}"><div class="hd r-${it.rar}">${it.fav?'<span class="star">★</span> ':''}${esc(it.name)}${it.rar==='rare'||it.rar==='unique'?`<small>${esc(it.base)}</small>`:''}</div><div class="bd">${itemLines(it)}
    <div class="dim num small" style="margin-top:4px">Уровень предмета ${it.ilvl}${it.req>1?` · <span class="${S.lvl<it.req?'bad-t':''}">требуется ур. ${it.req}</span>`:''}</div></div></div>`;
}
function slotsFor(it){
  if(it.slot==='weapon')return WEAP[it.wk].h===1&&S.equip.weapon&&WEAP[S.equip.weapon.wk].h===1&&it.wk!=='bow'?['weapon','offhand']:['weapon'];
  if(it.slot==='shield'||it.slot==='quiver')return ['offhand'];
  if(it.slot==='ring')return ['ring1','ring2'];
  if(it.slot==='flask')return FLASK_SLOTS;
  return [it.slot];
}
function equipBlock(it,slot){
  if(!itemOk(it))return `Нужен ${it.req} уровень`;
  const m=S.equip.weapon;
  if(slot==='offhand'){
    if(m&&WEAP[m.wk].h===2&&!(m.wk==='bow'&&it.slot==='quiver'))return 'Двуручное оружие занимает обе руки';
    if(it.slot==='quiver'&&(!m||m.wk!=='bow'))return 'Колчан носят с луком';
    if(it.slot==='shield'&&m&&m.wk==='bow')return 'С луком носят колчан';
    if(it.slot==='weapon'&&(!m||WEAP[it.wk].h!==1))return 'Во вторую руку — только одноручное оружие';}
  return null;
}
function doEquip(it,slot){
  const err=equipBlock(it,slot);if(err){toast(err);return false;}
  const back=[];const old=S.equip[slot];
  S.equip[slot]=it;S.inv=S.inv.filter(x=>x!==it);if(old)back.push(old);
  if(slot==='weapon'){const o=S.equip.offhand;
    if(o&&(WEAP[it.wk].h===2&&!(it.wk==='bow'&&o.slot==='quiver')||o.slot==='quiver'&&it.wk!=='bow'||o.slot==='shield'&&it.wk==='bow')){back.push(o);delete S.equip.offhand;}}
  if(S.inv.length+back.length>INV_MAX)toast('Сумка переполнена');
  back.forEach(x=>S.inv.push(x));delete it.isNew;
  save();return true;
}
function compareWith(it,slot){
  const P0=calc(),old=S.equip[slot],oo=S.equip.offhand;S.equip[slot]=it;
  if(slot==='weapon'&&oo&&WEAP[it.wk].h===2&&!(it.wk==='bow'&&oo.slot==='quiver'))delete S.equip.offhand;
  const P1=calc();S.equip[slot]=old;if(oo)S.equip.offhand=oo;if(!old)delete S.equip[slot];
  const rows=[['Здоровье',P0.life,P1.life],['Энерг. щит',P0.es,P1.es],['Мана',P0.mana,P1.mana],['Броня',P0.armour,P1.armour],['Уклонение',P0.eva,P1.eva],['Блок',P0.block,P1.block],
    ['Сопр. огню',P0.res.fire,P1.res.fire],['Сопр. холоду',P0.res.cold,P1.res.cold],['Сопр. молнии',P0.res.light,P1.res.light],['Сопр. хаосу',P0.res.chaos,P1.res.chaos],
    ...[0,1,2,3].filter(i=>P0.skills[i]||P1.skills[i]).map(i=>[(P0.skills[i]||P1.skills[i]).name,P0.skills[i]&&!P0.skills[i].bad?P0.skills[i].avg:0,P1.skills[i]&&!P1.skills[i].bad?P1.skills[i].avg:0]),['Атака оружием',P0.basic.avg,P1.basic.avg]];
  const d=rows.filter(r=>R(r[1])!==R(r[2]));
  const lost=[0,1,2,3].filter(i=>P0.skills[i]&&!P0.skills[i].bad&&P1.skills[i]&&P1.skills[i].bad).map(i=>P1.skills[i].name);
  return (lost.length?`<p class="notice" style="border-color:var(--bad);margin-bottom:6px">Перестанут работать: ${lost.join(', ')}</p>`:'')+
    (d.length?`<div class="cmp">${d.map(r=>`<div class="row" style="justify-content:space-between"><span class="muted">${r[0]}</span><span class="num ${r[2]>r[1]?'up':'dn'}">${r[2]>r[1]?'+':''}${fmt(r[2]-r[1])}</span></div>`).join('')}</div>`:'<div class="dim small">Без изменений характеристик</div>');
}
function isUpgrade(it){try{if(it.slot==='flask'||!itemOk(it))return false;const sl=slotsFor(it)[0];if(equipBlock(it,sl))return false;
  const P0=calc(),old=S.equip[sl];S.equip[sl]=it;const P1=calc();if(old)S.equip[sl]=old;else delete S.equip[sl];
  const sc=P=>P.life+P.es+(P.skills.filter(s=>s&&!s.bad).reduce((a,s)=>a+s.avg,0)||P.basic.avg)*1.5+(P.res.fire+P.res.cold+P.res.light)*2+P.armour*.05+P.eva*.05+P.block*3;return sc(P1)>sc(P0)*1.03;}catch(e){return false;}}

function vItems(){

const treeResetCost=()=>R(15*S.lvl*(1+S.lvl*.16));

function vShop(){

/* ---------- аукцион ---------- */
const aucData={buy:null,mine:null,loading:false,err:null};
async function aucLoad(){
  if(aucData.loading)return;aucData.loading=true;aucData.err=null;
  try{aucData.buy=await AUC.list();aucData.mine=await AUC.mine();}catch(e){aucData.err=e.message;}
  aucData.loading=false;if(screen==='sub'&&sub==='auction')render();
}
function vAuction(){
  const mode=AUC.mode();
  if(!aucData.buy&&!aucData.loading&&!aucData.err)setTimeout(aucLoad,0);
  let h=`<div class="stack">${subHead('Аукцион',mode==='server'?'Общий для всех игроков':'Торговля между вашими персонажами')}
    <div class="seg">${[['buy','Купить'],['sell','Выставить'],['mine','Мои лоты']].map(([k,n])=>`<button class="${aucTab===k?'on':''}" data-a="aucTab" data-t="${k}">${n}</button>`).join('')}<button data-a="aucLoad" aria-label="Обновить">↻</button></div>`;
  if(aucData.err)h+=`<p class="notice" style="border-color:var(--bad)">${esc(aucData.err)}</p>`;
  if(aucTab==='buy'){
    const lots=(aucData.buy||[]).filter(l=>!l.mine).sort((a,b)=>b.ts-a.ts);
    h+=aucData.loading&&!aucData.buy?'<p class="dim">Загрузка…</p>':`<div class="list">${lots.map(l=>`<button class="irow" data-a="aucLot" data-id="${l.id}"><span class="sl">${SLOTN[l.item.slot]||''} · ${l.item.ilvl} · ${esc(l.seller.name)}</span><span class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="in r-${l.item.rar}">${esc(l.item.name)}</span><b class="num gold-t">${fmt(l.price)}</b></span></button>`).join('')||`<p class="dim" style="margin:0">${mode==='server'?'Лотов пока нет.':'Лотов других персонажей нет. Выставьте вещь одним персонажем и купите другим.'}</p>`}</div>`;
  }else if(aucTab==='sell'){
    h+=`<p class="muted small" style="margin:0">Выберите вещь из сумки и назначьте цену. Налог аукциона — ${R(AUC_TAX*100)}% от цены продажи. Выручка копится на счёте аккаунта: её может забрать любой ваш персонаж.</p>

      <div class="eyebrow">Продано недавно</div><div class="list small">${(m.sold||[]).map(l=>`<div class="row" style="justify-content:space-between"><span class="r-${l.item.rar}">${esc(l.item.name)}</span><span class="muted num">${fmt(l.price)} · ${esc(l.buyer||'')}</span></div>`).join('')||'<span class="dim">Пока ничего</span>'}</div>`;

  else if(R0.type==='trap'){
    h+=`<div class="panel"><div class="eyebrow">${ROOMS.trap.n} · ловушка ${Math.min(R0.i+1,3)}/3</div>`;
    if(R0.i<3){const t=R0.traps[R0.i];h+=`<h3 style="font-size:18px;margin:4px 0">${t.n}</h3><p class="muted small" style="margin:0 0 8px">${t.d} Сложность: ${trapNeed()}.</p>
      <div class="list">${t.o.map(([a,n],j)=>`<button class="btn" data-a="labTrap" data-j="${j}" style="text-align:left;display:flex;justify-content:space-between"><span><span style="color:var(--${a})">■</span> ${n}</span><span class="num">${trapChance(a)}%</span></button>`).join('')}</div>`;}
    h+=`<div class="statl small" style="margin-top:8px">${R0.res.map(r=>`<span class="${r.ok?'good-t':'bad-t'}">${r.note}</span>`).join('')}</div>${R0.i>=3?'<button class="btn pri full" data-a="labNext" style="margin-top:8px">Дальше</button>':''}</div>`;}
  else if(R0.type==='puzzle'){
    h+=`<div class="panel"><div class="eyebrow">${ROOMS.puzzle.n} · попыток ${R0.max-R0.tries.length}</div>
      <p class="muted small" style="margin:4px 0 8px">Нажмите три разных символа. ● — символ на своём месте, ○ — символ есть, но в другом месте. Каждая ошибка ранит.</p>
      <div class="pzrow">${PUZZLE_SYM.map((s,i)=>`<button class="pz ${R0.cur.includes(i)?'on':''}" data-a="labPz" data-s="${i}" ${R0.state!=='play'?'disabled':''}>${s}</button>`).join('')}</div>
      <div class="pzcur">${[0,1,2].map(i=>`<span>${R0.cur[i]!=null?PUZZLE_SYM[R0.cur[i]]:'·'}</span>`).join('')}</div>
      <div class="list small">${R0.tries.map(t=>`<div class="row" style="justify-content:space-between"><span class="pzg">${t.g.map(i=>PUZZLE_SYM[i]).join(' ')}</span><span class="num">${'●'.repeat(t.ex)}${'○'.repeat(t.pa)}${t.ex+t.pa?'':'—'}</span></div>`).join('')}</div>
      ${R0.state==='win'?'<p class="notice" style="border-color:var(--good)">Механизм поддался: вы получили золотой ключ.</p>':R0.state==='lose'?`<p class="notice" style="border-color:var(--bad)">Механизм заклинило. Порядок был: ${R0.secret.map(i=>PUZZLE_SYM[i]).join(' ')}</p>`:''}
      ${R0.state!=='play'?'<button class="btn pri full" data-a="labNext" style="margin-top:8px">Дальше</button>':''}</div>`;}
  else if(R0.type==='shrine'){
    h+=`<div class="panel"><div class="eyebrow">${ROOMS.shrine.n}</div>${R0.done?'<p class="muted">Благословение получено.</p><button class="btn pri full" data-a="labNext">Дальше</button>':`<div class="choice" style="margin-top:8px">${R0.opts.map(k=>`<button class="room" data-a="labShrine" data-k="${k}"><span class="ric">✦</span><span class="gt"><b>${SHRINES[k].n}</b><small>${Object.entries(SHRINES[k].s).map(([a,v])=>lbl(a,v)).join('; ')}</small></span></button>`).join('')}</div>`}</div>`;}
  else if(R0.type==='font'||R0.type==='vault'){
    h+=`<div class="panel"><div class="eyebrow">${ROOMS[R0.type].n}</div><p class="muted">${R0.type==='font'?'Вода исцеляет раны и наполняет флаконы.':R0.got?'Внутри: '+R0.got.map(esc).join(', '):'Сундук заперт: нужен золотой ключ из ловушек или механизмов.'}</p><button class="btn pri full" data-a="labNext">Дальше</button></div>`;}
  h+=`<div class="panel"><div class="eyebrow" style="margin-bottom:4px">Летопись</div><div class="statl small">${L.log.slice().reverse().map(t=>`<span style="color:var(--muted)">${esc(t)}</span>`).join('')||'<span class="dim">Пусто</span>'}</div></div>
    <button class="btn ghost full" data-a="labLeaveAsk">Покинуть лабиринт</button></div>`;
  return h;
}

/* =========================================================
   ДЕЙСТВИЯ
   ========================================================= */
function goMain(t){C=null;screen='main';tab=t||'map';sub=null;}
function openSub(s){screen='sub';sub=s;labFailNote=s==='lab'?labFailNote:null;if(s==="auction"){aucTab="buy";aucData.buy=null;aucData.mine=null;aucData.err=null;}if(s==='dummy')dm.res=null;render();window.scrollTo(0,0);}
const ACT={
  roster(){if(C&&!C.over)return;C=null;screen='roster';delAsk=null;closeModal();render();},
  play(d){switchChar(d.id);screen='main';tab='map';sub=null;viewAct=actOfProg();TV.init=false;selNode=null;benchSel=null;render();},
  delAsk(d){delAsk=d.id;render();},delNo(){delAsk=null;render();},
  delYes(d){deleteChar(d.id);delAsk=null;screen=ACC.chars.length?'roster':'select';render();toast('Персонаж удалён');},
  newChar(){if(ACC.chars.length>=MAX_CHARS){toast('Не больше 7 персонажей');return;}screen='select';render();},
  pickCls(d){pendingCls=d.c;render();},
  begin(){if(ACC.chars.length>=MAX_CHARS)return;const n=(document.getElementById('hname').value||'').trim()||'Изгнанник';newGame(pendingCls,n);screen='main';tab='map';viewAct=0;TV.init=false;selNode=null;render();toast('Путь начинается на Солёном берегу');},
  tab(d){tab=d.t;screen='main';sub=null;render();window.scrollTo(0,0);},
  act(d){viewAct=+d.i;render();},
  sub(d){openSub(d.s);},
  back(){screen='main';tab='map';sub=null;render();},
  go(){if(S.prog<BATTLES.length)startBattle({type:'camp',g:S.prog});},
  loc(d){const bs=BATTLES.filter(b=>b.act===+d.a2&&b.loc===+d.l);const nx=bs.find(b=>b.g===S.prog);
    startBattle({type:'camp',g:nx?nx.g:pick(bs.filter(b=>b.g<S.prog)).g});},
  mapCont(){closeModal();startBattle({type:'map',step:S.mapRun.step});},
  mapTier(d){openTier(+d.t);},
  mapOpen(d){closeModal();startMap(+d.t);},
  mapForge(d){if(forgeMaps(+d.t)){toast(`Получена карта ${+d.t+1} тира`);openTier(+d.t);render();}},
  mapBuy(){if(buyMap()){toast('Куплена карта 1 тира');render();}},
  tgt(d){if(!C)return;const e=C.enemies.find(x=>x.uid===d.u);if(e&&e.hp>0){C.target=d.u;render();}},
  skill(d){useSkill(+d.i);},
  hex(){useHex();},
  mv(d){move(+d.d);},
  flask(d){useFlask(+d.k);},
  journal(){modal(vJournal());const j=document.getElementById('journal');if(j)j.scrollTop=j.scrollHeight;if(C&&C.over)window._reopen=true;},
  auto(){C.auto=!C.auto;render();if(C.auto)scheduleAuto();},
  fleeAsk(){if(!C||C.over)return;modal(`<h2>Покинуть бой?</h2><p class="muted" style="margin:0">${C.B.type==='map'?'Карта будет потеряна.':C.B.type==='lab'?'Лабиринт будет потерян.':'Прогресс сражения не сохранится.'}</p><div class="row"><button class="btn sp" data-a="close">Остаться</button><button class="btn sp danger" data-a="flee">Уйти</button></div>`);},
  flee(){if(C){C.auto=false;if(C.B.type==='map')S.mapRun=null;if(C.B.type==='lab')S.labRun=null;}goMain();closeModal();save();render();},
  leave(){if(C)C.auto=false;window._reopen=false;closeModal();goMain();viewAct=actOfProg();render();offerReward();},
  next(d){const cont=JSON.parse(d.c);window._reopen=false;closeModal();
    if(cont.type==='labmap'){goMain();openSub('lab');return;}
    offerReward(()=>startBattle(cont));},
  ovbg(d,el,ev){if(ev.target===el&&!modalLock)ACT.close();},
  close(){closeModal();if(window._reopen&&C&&C.over){window._reopen=false;window._lastOver&&window._lastOver();}},
  takeGem(d){addGem(d.id,+d.l);save();closeModal();toast(`Получен камень: ${gdef(d.id).n}`);const f=window._afterReward;window._afterReward=null;if(f)f();else render();},
  alloc(){const p=pathTo(selNode);if(!p||!p.length||pointsFree()<p.length)return;p.forEach(id=>{if(NODES[id].t==='attr')S.attrPick[id]=S.attrDef;});S.alloc.push(...p);haptic('medium');save();render();},
  attrDef(d){S.attrDef=d.k;save();render();},
  attrSet(d){S.attrPick[selNode]=d.k;save();render();},
  refund(){const id=selNode,c=refundCost();if(S.gold<c){toast('Не хватает золота');return;}if(!canRemove(id)){toast('Сначала забудьте узлы, которые держатся за этот');return;}S.gold-=c;S.alloc=S.alloc.filter(x=>x!==id);delete S.attrPick[id];save();render();},
  tz(d){const box=document.getElementById('treebox');zoomAt(+d.z,box.clientWidth/2,box.clientHeight/2);},
  treeHome(){centerOn(startNode(S.cls));},
  treeSum(){showTreeSum=!showTreeSum;render();},
  treeTab(d){treeTab=d.t;render();},
  ascPick(){showAscChoice();},
  ascChoose(d){chooseAsc(d.id);closeModal();treeTab='asc';goMain('tree');render();toast('Возвышение: '+ascDef(d.id).n);},
  ascAlloc(d){if(ascAlloc(+d.i)){haptic('medium');render();}},
  gtab(d){gemTab=d.t;render();},
  pick(d){openPicker(d);},
  insert(d){const p=window._pick;if(!p)return;
    if(p.k==='a')S.skills[p.i].a=d.u;else if(p.k==='s'){const s=S.skills[p.i].s;while(s.length<=p.j)s.push(null);s[p.j]=d.u;}else if(p.k==='hex')S.hex=d.u;else S.auras[p.i]=d.u;
    save();closeModal();render();},
  unsock(){const p=window._pick;if(p.k==='a')S.skills[p.i].a=null;else if(p.k==='s')S.skills[p.i].s[p.j]=null;else if(p.k==='hex')S.hex=null;else S.auras[p.i]=null;save();closeModal();render();},
  sellGem(d){const g=gem(d.u);if(!g)return;S.gold+=gemSell(g);S.gems=S.gems.filter(x=>x.uid!==d.u);save();render();},
  invTab(d){invTab=d.t;render();},
  slot(d){openItem('slot',d.s);},
  itemInv(d){openItem('inv',d.u);},
  swapIn(d){const it=S.inv.find(x=>x.uid===d.u);if(!it)return;if(doEquip(it,d.s)){closeModal();render();toast('Надето: '+it.name);}},
  equip(d){const w=window._item,it=S.inv.find(x=>x.uid===w.key);if(!it)return;if(doEquip(it,d.s)){closeModal();render();toast('Надето: '+it.name);}},
  unequip(){const w=window._item,it=S.equip[w.key];if(!it)return;if(S.inv.length>=INV_MAX){toast('Сумка полна');return;}delete S.equip[w.key];S.inv.push(it);save();closeModal();render();},
  fav(){const w=window._item,it=w.where==='inv'?S.inv.find(x=>x.uid===w.key):S.equip[w.key];if(!it)return;it.fav=!it.fav;if(!it.fav)delete it.fav;save();openItem(w.where,w.key);},
  toStash(d){if(toStash(d.u)){closeModal();render();toast('Положено в тайник');}},
  orb(d){const w=window._item,it=w.where==='inv'?S.inv.find(x=>x.uid===w.key):S.equip[w.key];if(!it)return;applyOrb(it,d.o);openItem(w.where,w.key);},
  shop(){openSub('shop');},
  stab(d){shopTab=d.t;sellAllAsk=false;render();},
  scat(d){shopCat=d.t;render();},
  shopItem(d){const it=S.shop.items.find(x=>x.uid===d.u);if(!it)return;const p=buyPrice(it),sl=slotsFor(it);
    modal(`<div class="row"><span class="eyebrow sp">Торговец · ${SLOTN[it.slot]}</span><button class="btn sm ghost" data-a="close">Закрыть</button></div>${itemCard(it)}
      ${it.slot!=='flask'?`<div class="panel"><div class="eyebrow" style="margin-bottom:6px">Если надеть</div>${compareWith(it,it.slot==='ring'?'ring1':sl[0])}</div>`:''}
      <button class="btn pri full" data-a="buy" data-u="${it.uid}" ${S.gold>=p&&S.inv.length<INV_MAX?'':'disabled'}>Купить · ${fmt(p)} зол.</button>`);},
  buy(d){const it=S.shop.items.find(x=>x.uid===d.u);if(!it)return;const p=buyPrice(it);if(S.gold<p)return;S.gold-=p;S.shop.items=S.shop.items.filter(x=>x!==it);it.isNew=1;S.inv.push(it);save();closeModal();render();toast(`Куплено: ${it.name}`);},
  shopRefresh(){const c=shopRefreshCost();if(S.gold<c)return;S.gold-=c;shopStock(true);save();render();},
  buyGem(d){const p=gemPrice(d.id);if(S.gold<p)return;S.gold-=p;addGem(d.id);save();render();toast(`Куплен камень: ${gdef(d.id).n}`);},
  resetTree(){const c=treeResetCost();if(S.gold<c)return;S.gold-=c;S.alloc=[startNode(S.cls)];S.attrPick={};save();render();toast('Древо сброшено');},
  resetAsc(){const c=ascResetCost();if(S.gold<c)return;S.gold-=c;S.ascAlloc=[];save();render();toast('Очки возвышения возвращены');},
  sellOne(d){const it=S.inv.find(x=>x.uid===d.u);if(!it)return;const v=sellPrice(it);S.gold+=v;S.inv=S.inv.filter(x=>x!==it);save();render();toast(`Продано за ${v} зол.`);},
  sellBulk(d){const g=sellGroup(d.r);let v=0;g.forEach(x=>v+=sellPrice(x));const set=new Set(g);S.inv=S.inv.filter(x=>!set.has(x));S.gold+=v;sellAllAsk=false;save();render();toast(`Продано ${g.length} шт. за ${fmt(v)} зол.`);},
  sellAllAsk(){sellAllAsk=true;render();},sellAllNo(){sellAllAsk=false;render();},
  autosell(d,el){S.autoSell=el.checked;save();},
  stTab(d){stashTab=d.t;render();},
  stIn(d){if(toStash(d.u))render();},
  stOut(d){if(fromStash(d.u))render();},
  stExp(){if(expandStash()){toast('Тайник расширен');render();}},
  aucTab(d){aucTab=d.t;render();},
  aucLoad(){aucData.buy=null;aucData.mine=null;aucLoad();render();},
  aucLot(d){const l=(aucData.buy||[]).find(x=>x.id===d.id);if(!l)return;
    modal(`<div class="row"><span class="eyebrow sp">Лот · ${esc(l.seller.name)}</span><button class="btn sm ghost" data-a="close">Закрыть</button></div>${itemCard(l.item)}
      ${l.item.slot!=='flask'&&slotsFor(l.item)[0]?`<div class="panel"><div class="eyebrow" style="margin-bottom:6px">Если надеть</div>${compareWith(l.item,l.item.slot==='ring'?'ring1':slotsFor(l.item)[0])}</div>`:''}
      <button class="btn pri full" data-a="aucBuy" data-id="${l.id}" ${S.gold>=l.price&&S.inv.length<INV_MAX?'':'disabled'}>Купить · ${fmt(l.price)} зол.</button>`);},
  async aucBuy(d){const l=(aucData.buy||[]).find(x=>x.id===d.id);if(!l||S.gold<l.price||S.inv.length>=INV_MAX)return;
    S.gold-=l.price;try{const it=await AUC.buy(l.id);S.inv.push(aucReceive(it));save();closeModal();toast('Куплено: '+it.name);}catch(e){S.gold+=l.price;save();toast(e.message);}
    aucData.buy=null;aucLoad();render();},
  aucSellPick(d){const it=S.inv.find(x=>x.uid===d.u);if(!it)return;const base=Math.max(10,buyPrice(it));window._aucIt=it.uid;
    modal(`<div class="row"><span class="eyebrow sp">Выставить на аукцион</span><button class="btn sm ghost" data-a="close">Закрыть</button></div>${itemCard(it)}
      <label class="stack" style="gap:6px"><span class="eyebrow">Цена, золото</span><input class="input num" id="aucPrice" type="number" min="1" inputmode="numeric" value="${base}"></label>
      <div class="row">${[.5,1,2,5].map(m=>`<button class="btn sm sp" data-a="aucQuick" data-v="${R(base*m)}">${fmt(R(base*m))}</button>`).join('')}</div>
      <button class="btn pri full" data-a="aucPost">Выставить</button>`);},
  aucQuick(d){const el=document.getElementById('aucPrice');if(el)el.value=d.v;},
  async aucPost(){const it=S.inv.find(x=>x.uid===window._aucIt);const p=Math.floor(+(document.getElementById('aucPrice')||{}).value||0);
    if(!it||p<1){toast('Укажите цену');return;}
    S.inv=S.inv.filter(x=>x!==it);delete it.isNew;
    try{await AUC.post(it,p);save();closeModal();toast('Лот выставлен');}catch(e){S.inv.push(it);save();toast(e.message);}
    aucData.buy=null;aucLoad();render();},
  async aucCancel(d){if(S.inv.length>=INV_MAX){toast('Сумка полна');return;}try{const it=await AUC.cancel(d.id);S.inv.push(aucReceive(it));save();toast('Лот снят');}catch(e){toast(e.message);}aucData.buy=null;aucLoad();render();},
  async aucClaim(){try{const g=await AUC.claim();S.gold+=g;save();toast(`Получено ${fmt(g)} зол.`);}catch(e){toast(e.message);}aucData.mine=null;aucLoad();render();},
  benchSel(d){benchSel=d.u||null;render();},
  benchCraft(d){const all=[...EQ_SLOTS.map(s=>S.equip[s]).filter(Boolean),...S.inv],it=all.find(x=>x.uid===benchSel);if(it&&benchCraft(it,d.k)){haptic('medium');toast('Свойство мастера добавлено');render();}},
  benchRemove(){const all=[...EQ_SLOTS.map(s=>S.equip[s]).filter(Boolean),...S.inv],it=all.find(x=>x.uid===benchSel);if(it&&benchRemove(it)){toast('Свойство мастера удалено');render();}},
  dmSkill(d){dm.i=+d.i;dm.res=null;render();},dmPreset(d){dm.preset=d.k;dm.res=null;render();},dmDist(d){dm.d=+d.i;dm.res=null;render();},
  dmHex(d,el){dm.hex=el.checked;dm.res=null;render();},
  dmRun(){dm.res=dummySim(dm.i,dm.preset,dm.d,dm.hex);render();},
  labEnter(d){if(enterLab(+d.n)){labFailNote=null;render();}},
  labPick(d){labChoose(+d.i);if(screen==='sub')render();},
  labTrap(d){labTrap(+d.j);render();},
  labPz(d){labPz(+d.s);render();},
  labShrine(d){labShrine(+d.k);render();},
  labNext(){labNext();render();},
  labBoss(){if(S.labRun){S.labRun.room={type:'boss'};save();startBattle({type:'lab',boss:true});}},
  labLeaveAsk(){modal(`<h2>Покинуть лабиринт?</h2><p class="muted" style="margin:0">Прохождение будет потеряно${S.labRun&&S.labRun.n===3?', подношение не вернётся':''}.</p><div class="row"><button class="btn sp" data-a="close">Остаться</button><button class="btn sp danger" data-a="labLeave">Покинуть</button></div>`);},
  labLeave(){S.labRun=null;save();closeModal();render();},
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el||el.disabled)return;if(el.closest('#treebox')&&el.dataset.a!=='tz')return;const f=ACT[el.dataset.a];if(f)f(el.dataset,el,ev);});
/* последний экран итога боя — чтобы вернуться к нему после журнала */
{const sv=showVictory,sd=showDeath,sl=showLabWin;
  showVictory=(n,c)=>{window._lastOver=()=>sv(n,c);sv(n,c);};
  showDeath=l=>{window._lastOver=()=>sd(l);sd(l);};
  showLabWin=()=>{window._lastOver=()=>sl();sl();};}

/* старт */
load();
screen=S?'main':ACC.chars.length?'roster':'select';tab='map';if(S)viewAct=actOfProg();
render();


</script>
</body></html>
