/* ---------- аукцион ---------- */
const aucData={buy:null,mine:null,loading:false,err:null};
async function aucLoad(){
  if(aucData.loading)return;aucData.loading=true;aucData.err=null;
  try{aucData.buy=await AUC.list();aucData.mine=await AUC.mine();}catch(e){aucData.err=e.message;}
  aucData.loading=false;if(screen==='sub'&&sub==='auction')render();
}
function vAuction(){
  const mode=AUC.mode();
  if(!aucData.buy&&!aucData.loading&&!aucData.err)setTimeout(aucLoad,0);
  let h=`<div class="stack">${subHead('Аукцион',mode==='server'?'Общий для всех игроков':'Торговля между вашими персонажами')}
    <div class="seg">${[['buy','Купить'],['sell','Выставить'],['mine','Мои лоты']].map(([k,n])=>`<button class="${aucTab===k?'on':''}" data-a="aucTab" data-t="${k}">${n}</button>`).join('')}<button data-a="aucLoad" aria-label="Обновить">↻</button></div>`;
  if(aucData.err)h+=`<p class="notice" style="border-color:var(--bad)">${esc(aucData.err)}</p>`;
  if(aucTab==='buy'){
    const lots=(aucData.buy||[]).filter(l=>!l.mine).sort((a,b)=>b.ts-a.ts);
    h+=aucData.loading&&!aucData.buy?'<p class="dim">Загрузка…</p>':`<div class="list">${lots.map(l=>`<button class="irow" data-a="aucLot" data-id="${l.id}"><span class="sl">${SLOTN[l.item.slot]||''} · ${l.item.ilvl} · ${esc(l.seller.name)}</span><span class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="in r-${l.item.rar}">${esc(l.item.name)}</span><b class="num gold-t">${fmt(l.price)}</b></span></button>`).join('')||`<p class="dim" style="margin:0">${mode==='server'?'Лотов пока нет.':'Лотов других персонажей нет. Выставьте вещь одним персонажем и купите другим.'}</p>`}</div>`;
  }else if(aucTab==='sell'){
    h+=`<p class="muted small" style="margin:0">Выберите вещь из сумки и назначьте цену. Комиссии нет: вся цена идёт продавцу. Выручка копится на счёте аккаунта: её может забрать любой ваш персонаж.</p>
      <div class="bag">${sortInv(S.inv).map(x=>irow(x,'aucSellPick')).join('')||'<span class="dim">Сумка пуста</span>'}</div>`;
  }else{
    const m=aucData.mine||{lots:[],sold:[],purse:0};
    h+=`<div class="panel"><div class="row"><span class="sp">Выручка: <b class="num gold-t">${fmt(m.purse||0)} зол.</b></span><button class="btn sm pri" data-a="aucClaim" ${m.purse?'':'disabled'}>Забрать</button></div></div>
      <div class="eyebrow">На продаже</div><div class="list">${(m.lots||[]).map(l=>`<div class="sellrow"><div class="irow"><span class="sl">${esc(l.seller.name)} · ${fmt(l.price)} зол.</span><span class="in r-${l.item.rar}">${esc(l.item.name)}</span></div><button class="btn sm" data-a="aucCancel" data-id="${l.id}">Снять</button></div>`).join('')||'<span class="dim">Нет лотов</span>'}</div>
      <div class="eyebrow">Продано недавно</div><div class="list small">${(m.sold||[]).map(l=>`<div class="row" style="justify-content:space-between"><span class="r-${l.item.rar}">${esc(l.item.name)}</span><span class="muted num">${fmt(l.price)} · ${esc(l.buyer||'')}</span></div>`).join('')||'<span class="dim">Пока ничего</span>'}</div>`;
  }
  return h+'</div>';
}

/* ---------- устройство картографа ---------- */
let devTab='maps';
function vDevice(){
  const gN=gmapCount(),ready=Object.keys(PIN_GROUPS).filter(pinReady).length;
  let h=`<div class="stack">${subHead('Устройство картографа','Убежище')}
    <div class="seg"><button class="${devTab==='maps'?'on':''}" data-a="devTab" data-t="maps">Карты</button><button class="${devTab==='guard'?'on':''}" data-a="devTab" data-t="guard">Хранители${gN?' · '+gN:''}</button><button class="${devTab==='pin'?'on':''}" data-a="devTab" data-t="pin">Пинакл${ready?' · '+ready:''}</button></div>
    ${S.mapRun?`<button class="btn pri full" data-a="mapCont">Продолжить: ${esc(S.mapRun.name)} · бой ${S.mapRun.step+1}/4</button>`:''}`;
  if(devTab==='maps')h+=`

        ${r.mres&&r.mres.length?`<div class="eyebrow" style="margin:10px 0 4px">Приспешники за ход</div><div class="statl small">${r.mres.map(m=>`<span>${m.n} ×${m.count}: ${fmt(m.turn)}</span>`).join('')}<span class="gold-t">Умение + приспешники: ${fmt(tot+r.minTotal)} за ход</span></div>`:''}
        <p class="dim small" style="margin:8px 0 0">Мишень одна, поэтому умения по области бьют её один раз за волну удара. В бою по группе урон умножается на число задетых врагов.</p></div>`;}}
  return h+'</div>';
}

/* ---------- лабиринт ---------- */
function roomDesc(t){const D=labDiff();
  if(t==='trap')return `${D.traps} ловушки подряд. Пройдите каждую силой, ловкостью или умом. Провал ранит.`;
  if(t==='puzzle')return `Найдите порядок ${D.len} рычагов из ${D.syms}. За ошибки — урон, за решение — ключ.`;
  return ROOMS[t].d;}
function labDiffText(n){const D=LAB_DIFF[n];return `ловушек в коридоре ${D.traps}, механизм ${D.len} из ${D.syms} рычагов, переключатели — запас ${[5,4,3,2][n]} нажат.${n?', Изаро сильнее и знает новые приёмы':''}${n>=2?', в залах 3 волны':''}`;}
function vLab(){
  const L=S.labRun;
  if(!L){
    let h=`<div class="stack">${subHead('Лабиринт Изаро','Испытания возвышения')}
      ${labFailNote?`<p class="notice" style="border-color:var(--bad)">${labFailNote}</p>`:''}
      <div class="panel"><p class="muted" style="margin:0">Император Изаро построил лабиринт, чтобы найти достойного наследника. Это не только бои: коридоры ловушек проверяют силу, ловкость и ум, механизмы требуют найти порядок рычагов, а тёмные святилища дают благословения. Здоровье между комнатами не восстанавливается — лечат только фонтаны и флаконы. Золотые ключи открывают тайники и сокровищницу. В конце всегда ждёт Изаро.</p></div>`;
    LABS.forEach((LD,n)=>{const why=labUnlock(n);
      h+=`<div class="loc ${why?'locked':''}"><div class="lv num">${LD.lvl}<small>УР.</small></div><div style="min-width:0"><b>${LD.n}</b><div class="small muted">${LD.rooms} комнат + Изаро · ${labDiffText(n)}${S.labs[n]?' · <span class="good-t">пройден</span>':' · +2 очка возвышения'}</div>${why?`<div class="small bad-t">${why}</div>`:''}</div>
        <button class="btn sm ${why?'':'pri'}" data-a="labEnter" data-n="${n}" ${why?'disabled':''}>${n===3?'Подношение':'Войти'}</button></div>`;});
    return h+'</div>';}
  const LD=LABS[L.n],R0=L.room,done=L.step>=L.steps.length;
  let h=`<div class="stack">${subHead(LD.n,`Уровень ${LD.lvl}`)}
    <div class="panel">${bar('hpb',L.hp*100,100,`Здоровье ${R(L.hp*100)}%`)}
      <div class="row small" style="margin-top:6px"><span class="sp">Комната <b>${Math.min(L.step+1,L.steps.length)}/${L.steps.length}</b> · ключей <b class="gold-t">${L.keys}</b></span>${L.buffs.map(k=>chip(SHRINES[k].n,'var(--r-unique)')).join('')}</div>
      <div class="labpath">${L.steps.map((s,i)=>`<i class="${i<L.step?'on':i===L.step?'cur':''}"></i>`).join('')}<i class="boss ${done?'cur':''}"></i></div></div>`;
  const sd=!R0&&L.side?(L.side[Math.min(L.step,L.steps.length-1)]||[]):[];
  const sideH=sd.length?`<div class="eyebrow">Боковой проход · не тратит комнату</div><div class="choice">${sd.map(t=>`<button class="room side" data-a="labPick" data-side="${t}"><span class="ric">${ROOMS[t].ic}</span><span class="gt"><b>${ROOMS[t].n}</b><small>${ROOMS[t].d}</small></span></button>`).join('')}</div>`:'';
  if(!R0&&!done){const one=L.steps[L.step].length===1;h+=`<div class="eyebrow">${one?'Следующая комната':'Выберите испытание'}</div><div class="choice">${L.steps[L.step].map((t,i)=>`<button class="room" data-a="labPick" data-i="${i}"><span class="ric">${ROOMS[t].ic}</span><span class="gt"><b>${ROOMS[t].n}</b><small>${roomDesc(t)}${t==='vault'?` Ключей: ${L.keys}.`:''}</small></span></button>`).join('')}</div>${sideH}`;}
  else if(done&&!R0){h+=sideH;h+=`<div class="panel framed"><div class="eyebrow">Финал</div><h2 style="font-size:22px;margin:4px 0 6px">Тронный зал Изаро</h2><p class="muted" style="margin:0 0 10px">Император ждёт. Он поднимает божественный щит, призывает стражей и бьёт клинком. Ключи (${L.keys}) откроют сундуки его сокровищницы после победы.</p>
      <button class="btn pri full" data-a="labBoss">Сразиться с Изаро</button></div>`;}
  else if(R0.type==='trap'){
    h+=`<div class="panel"><div class="eyebrow">${ROOMS.trap.n} · ловушка ${Math.min(R0.i+1,R0.traps.length)}/${R0.traps.length}</div>`;
    if(R0.i<R0.traps.length){const t=R0.traps[R0.i];h+=`<h3 style="font-size:18px;margin:4px 0">${t.n}</h3><p class="muted small" style="margin:0 0 8px">${t.d} Сложность: ${trapNeed()}.</p>
      <div class="list">${t.o.map(([a,n],j)=>`<button class="btn" data-a="labTrap" data-j="${j}" style="text-align:left;display:flex;justify-content:space-between"><span><span style="color:var(--${a})">■</span> ${n}</span><span class="num">${trapChance(a)}%</span></button>`).join('')}</div>`;}
    h+=`<div class="statl small" style="margin-top:8px">${R0.res.map(r=>`<span class="${r.ok?'good-t':'bad-t'}">${r.note}</span>`).join('')}</div>${R0.i>=R0.traps.length?'<button class="btn pri full" data-a="labNext" style="margin-top:8px">Дальше</button>':''}</div>`;}
  else if(R0.type==='puzzle'){
    h+=`<div class="panel"><div class="eyebrow">${ROOMS.puzzle.n} · попыток ${R0.max-R0.tries.length}</div>
      <p class="muted small" style="margin:4px 0 8px">Нажмите ${R0.secret.length===3?'три':'четыре'} разных символа из ${R0.k}. ● — символ на своём месте, ○ — символ есть, но в другом месте. Каждая ошибка ранит.</p>
      <div class="pzrow" style="grid-template-columns:repeat(${R0.k},1fr)">${PUZZLE_SYM.slice(0,R0.k).map((s,i)=>`<button class="pz ${R0.cur.includes(i)?'on':''}" data-a="labPz" data-s="${i}" ${R0.state!=='play'?'disabled':''}>${s}</button>`).join('')}</div>
      <div class="pzcur">${R0.secret.map((_,i)=>`<span>${R0.cur[i]!=null?PUZZLE_SYM[R0.cur[i]]:'·'}</span>`).join('')}</div>
      <div class="list small">${R0.tries.map(t=>`<div class="row" style="justify-content:space-between"><span class="pzg">${t.g.map(i=>PUZZLE_SYM[i]).join(' ')}</span><span class="num">${'●'.repeat(t.ex)}${'○'.repeat(t.pa)}${t.ex+t.pa?'':'—'}</span></div>`).join('')}</div>
      ${R0.state==='win'?'<p class="notice" style="border-color:var(--good)">Механизм поддался: вы получили золотой ключ.</p>':R0.state==='lose'?`<p class="notice" style="border-color:var(--bad)">Механизм заклинило. Порядок был: ${R0.secret.map(i=>PUZZLE_SYM[i]).join(' ')}</p>`:''}
      ${R0.state!=='play'?'<button class="btn pri full" data-a="labNext" style="margin-top:8px">Дальше</button>':''}</div>`;}
  else if(R0.type==='switch'){
    const pos=i=>{const t=(i/8)*2*Math.PI-Math.PI/2;return [50+38*Math.cos(t),50+38*Math.sin(t)];};
    h+=`<div class="panel"><div class="eyebrow">${ROOMS.switch.n} · нажатий ${R0.max-R0.presses}</div>
      <p class="muted small" style="margin:4px 0 8px">Нажатие переключает сам переключатель и двух его соседей по кольцу. Зажгите все восемь. Можно решить за ${R0.opt} нажат.; на ошибки есть запас.</p>
      <div class="swring">${R0.st.map((v,i)=>{const [x,y]=pos(i);return `<button class="sw ${v?'on':''}" style="left:${x}%;top:${y}%" data-a="labSwitch" data-i="${i}" ${R0.state!=='play'?'disabled':''} aria-label="Переключатель ${i+1}">${i+1}</button>`;}).join('')}<span class="swc">${R0.st.filter(Boolean).length}/8</span></div>
      ${R0.state==='play'?'<button class="btn sm ghost full" data-a="labSwitchReset">Вернуть исходное положение (нажатия не возвращаются)</button>':''}
      ${R0.state==='win'?'<p class="notice" style="border-color:var(--good)">Все переключатели горят: вы получили золотой ключ.</p>':R0.state==='lose'?'<p class="notice" style="border-color:var(--bad)">Механизм заклинило.</p>':''}
      ${R0.state!=='play'?'<button class="btn pri full" data-a="labNext" style="margin-top:8px">Дальше</button>':''}</div>`;}
  else if(R0.type==='scales'){h+=`<div class="panel"><p class="muted">Испытание закрыто.</p><button class="btn pri full" data-a="labNext">Дальше</button></div>`;}
  else if(R0.type==='shrine'){
    h+=`<div class="panel"><div class="eyebrow">${ROOMS.shrine.n}</div>${R0.done?'<p class="muted">Благословение получено.</p><button class="btn pri full" data-a="labNext">Дальше</button>':`<div class="choice" style="margin-top:8px">${R0.opts.map(k=>`<button class="room" data-a="labShrine" data-k="${k}"><span class="ric">✦</span><span class="gt"><b>${SHRINES[k].n}</b><small>${Object.entries(SHRINES[k].s).map(([a,v])=>lbl(a,v)).join('; ')}</small></span></button>`).join('')}</div>`}</div>`;}
  else if(R0.type==='font'||R0.type==='vault'){
    h+=`<div class="panel"><div class="eyebrow">${ROOMS[R0.type].n}</div><p class="muted">${R0.type==='font'?'Вода исцеляет раны и наполняет флаконы. Комната не потрачена.':R0.got?'Внутри: '+R0.got.map(esc).join(', '):'Сундук заперт: нужен золотой ключ из ловушек или механизмов.'}</p><button class="btn pri full" data-a="labNext">Дальше</button></div>`;}
  h+=`<div class="panel"><div class="eyebrow" style="margin-bottom:4px">Летопись</div><div class="statl small">${L.log.slice().reverse().map(t=>`<span style="color:var(--muted)">${esc(t)}</span>`).join('')||'<span class="dim">Пусто</span>'}</div></div>
    <button class="btn ghost full" data-a="labLeaveAsk">Покинуть лабиринт</button></div>`;
  return h;
}

/* =========================================================

function goMain(t){C=null;screen='main';tab=t||'map';sub=null;}
function openSub(s){screen='sub';sub=s;labFailNote=s==='lab'?labFailNote:null;if(s==="auction"){aucTab="buy";aucData.buy=null;aucData.mine=null;aucData.err=null;}if(s==='dummy')dm.res=null;render();window.scrollTo(0,0);}
const ACT={
  roster(){if(C&&!C.over)return;C=null;screen='roster';delAsk=null;closeModal();render();},
  play(d){switchChar(d.id);screen='main';tab='map';sub=null;viewAct=actOfProg();TV.init=false;selNode=null;benchSel=null;render();},
  restoreChar(d){if(restoreChar(d.id)){toast('Персонаж возвращён');render();}},
  delAsk(d){delAsk=d.id;render();},delNo(){delAsk=null;render();},
  delYes(d){deleteChar(d.id);delAsk=null;screen=ACC.chars.length?'roster':'select';render();toast('Персонаж удалён');},
  newChar(){if(ACC.chars.length>=MAX_CHARS){toast('Не больше 7 персонажей');return;}screen='select';render();},
  pickCls(d){pendingCls=d.c;render();},
  begin(){if(ACC.chars.length>=MAX_CHARS)return;const n=(document.getElementById('hname').value||'').trim()||'Изгнанник';newGame(pendingCls,n);screen='main';tab='map';viewAct=0;TV.init=false;selNode=null;render();toast('Путь начинается на Солёном берегу');},
  tab(d){if(d.t==='fight'){ACT.backFight();return;}tab=d.t;screen='main';sub=null;render();window.scrollTo(0,0);},
  fightEdit(d){if(!C||C.over||C.busy)return;screen='main';tab=d.t||'tree';sub=null;closeModal();render();window.scrollTo(0,0);},
  backFight(){if(!C||C.over)return;const P=calc();C.hp=Math.min(C.hp,P.life);C.mana=Math.min(C.mana,P.mana);C.es=Math.min(C.es,P.es);
    C.fl=FLASK_SLOTS.map((s,i)=>{const it=S.equip[s];if(!it||!itemOk(it))return null;const old=C.fl.find(f=>f&&f.slot===s);return {slot:s,ch:old?old.ch:0};});
    screen='combat';selNode=null;closeModal();render();window.scrollTo(0,0);},
  mapAgain(d){const t=+d.t;if(!(S.maps[t]>0))return;window._reopen=false;closeModal();if(C)C.auto=false;offerReward(()=>invGate(()=>startMap(t)));},
  cbMove(d){const cb=cbCfg(),i=+d.i,p=cb.order.indexOf(i),q=p+(+d.d);if(q<0||q>3)return;[cb.order[p],cb.order[q]]=[cb.order[q],cb.order[p]];save();render();},
  cbHide(d,el){const cb=cbCfg(),k=d.i==='b'?'b':+d.i;if(el.checked)delete cb.hide[k];else cb.hide[k]=1;save();},
  cbMv(d,el){const cb=cbCfg(),k=d.i==='b'?'b':+d.i;if(el.checked)cb.mv[k]=1;else delete cb.mv[k];save();},
  act(d){viewAct=+d.i;render();},
  sub(d){openSub(d.s);},
  back(){screen='main';tab='map';sub=null;render();},
  go(){if(S.prog<BATTLES.length)startBattle({type:'camp',g:S.prog});},
  loc(d){const bs=BATTLES.filter(b=>b.act===+d.a2&&b.loc===+d.l);const nx=bs.find(b=>b.g===S.prog);
    startBattle({type:'camp',g:nx?nx.g:pick(bs.filter(b=>b.g<S.prog)).g});},
  mapCont(){closeModal();startBattle({type:'map',step:S.mapRun.step});},
  mapTier(d){openTier(+d.t);},
  mapOpen(d){closeModal();invGate(()=>startMap(+d.t));},
  gmapOpen(d){invGate(()=>startGMap(d.k));},
  devTab(d){devTab=d.t;render();},
  pinOpen(d){invGate(()=>startPin(d.g));},
  evGo(){evGo();},
  leaders(){openLeaders();},
  srvRetry(){srvTries=0;srvLoad();toast('Подключаемся к серверу…');setTimeout(render,2500);},
  ldrView(d){ldrView(d.u,d.id);},
  evSkip(){evSkip();},
  mapForge(d){if(forgeMaps(+d.t)){toast(`Получена карта ${+d.t+1} тира`);openTier(+d.t);render();}},
  mapBuy(){if(buyMap()){toast('Куплена карта 1 тира');render();}},
  tgt(d){if(!C)return;const e=C.enemies.find(x=>x.uid===d.u);if(e&&e.hp>0||orbAt(d.u)){C.target=d.u;render();}},
  skill(d){useSkill(+d.i);},
  hex(d){useHex(+(d.n||0));},
  mv(d){move(+d.d);},
  flask(d){useFlask(+d.k);},
  journal(){modal(vJournal());const j=document.getElementById('journal');if(j)j.scrollTop=j.scrollHeight;if(C&&C.over)window._reopen=true;},
  fleeAsk(){if(!C||C.over)return;modal(`<h2>Покинуть бой?</h2><p class="muted" style="margin:0">${C.B.type==='dng'?`Забег по подземелью закончится. Пройдено волн: ${C.wave-1}, ваш рекорд: ${S.dngBest||0}. Добыча сохранится.`:C.B.type==='map'?'Карта будет потеряна.':C.B.type==='lab'?'Лабиринт будет потерян.':'Прогресс сражения не сохранится.'}</p><div class="row"><button class="btn sp" data-a="close">Остаться</button><button class="btn sp danger" data-a="flee">Уйти</button></div>`);},
  flee(){if(C){C.auto=false;if(C.B.type==='dng')S.dng=null;if(C.B.type==='map')S.mapRun=null;if(C.B.type==='lab')S.labRun=null;}goMain();closeModal();save();render();},
  leave(){if(C)C.auto=false;window._reopen=false;closeModal();goMain();viewAct=actOfProg();render();offerReward();},
  next(d){const cont=JSON.parse(d.c);window._reopen=false;closeModal();
    if(cont.type==='labmap'){goMain();openSub('lab');return;}
    offerReward(()=>startBattle(cont));},
  ovbg(d,el,ev){if(ev.target===el&&!modalLock)ACT.close();},
  close(){closeModal();if(window._reopen&&C&&C.over){window._reopen=false;window._lastOver&&window._lastOver();}},
  takeGem(d){addGem(d.id,+d.l);save();closeModal();toast(`Получен камень: ${gdef(d.id).n}`);const f=window._afterReward;window._afterReward=null;if(f)f();else render();},
  alloc(){const p=pathTo(selNode);if(!p||!p.length||pointsFree()<p.length)return;p.forEach(id=>{if(NODES[id].attr)S.attrPick[id]=S.attrDef||mainAttr(S.cls);});S.alloc.push(...p);haptic('medium');save();render();},
  attrDef(d){S.attrDef=d.k;save();render();},
  attrSet(d){S.attrPick[selNode]=d.k;save();render();},
  mastPick(d){const N=NODES[selNode];if(!N||N.t!=='mastery')return;const i=+d.i;if(mastTaken(N,i))return;
    if(S.alloc.includes(N.id)){if(S.mast[N.id]===i)return;const c=refundCost();if(S.gold<c){toast(`Сменить свойство: нужно ${c} зол.`);return;}S.gold-=c;S.mast[N.id]=i;save();render();toast('Свойство мастерства изменено');return;}
    if(pointsFree()<1){toast('Нет свободных очков');return;}if(nodeState(N.id)!=='avail')return;S.alloc.push(N.id);S.mast[N.id]=i;haptic('medium');save();render();},
  treeNoteOk(){delete S.treeNote;save();render();},
  refund(){const id=selNode,c=refundCost();if(S.gold<c){toast('Не хватает золота');return;}if(!canRemove(id)){toast('Сначала забудьте узлы, которые держатся за этот');return;}S.gold-=c;S.alloc=S.alloc.filter(x=>x!==id);delete S.attrPick[id];delete S.mast[id];save();render();},
  refundBranch(){const br=branchOf(selNode),c=refundCost()*br.length;if(S.gold<c){toast(`Нужно ${c} зол.`);return;}
    const txt=branchText(br).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    S.gold-=c;const set=new Set(br);S.alloc=S.alloc.filter(x=>!set.has(x));br.forEach(id=>{delete S.attrPick[id];delete S.mast[id];});haptic('medium');save();render();toast(`Забыто ${br.length} узл.: ${txt}`);},
  tz(d){const box=document.getElementById('treebox');zoomAt(+d.z,box.clientWidth/2,box.clientHeight/2);},
  treeHome(){centerOn(startNode(S.cls));},
  treeSum(){showTreeSum=!showTreeSum;render();},
  treeTab(d){treeTab=d.t;render();},
  ascPick(){showAscChoice();},
  ascChoose(d){chooseAsc(d.id);closeModal();treeTab='asc';goMain('tree');render();toast('Возвышение: '+ascDef(d.id).n);},
  ascSel(d){selAsc=d.id;render();},
  ascAlloc(){if(selAsc&&ascAlloc(selAsc)){haptic('medium');render();}},
  tclose(){selNode=null;selAsc=null;render();},
  gtab(d){gemTab=d.t;render();},
  pick(d){openPicker(d);},
  insert(d){const p=window._pick;if(!p)return;
    if(p.k==='s'){const g=gem(d.u),s=S.skills[p.i].s;if(s.some((u,j)=>j!==p.j&&gem(u)&&gem(u).id===g.id)){toast('Такая поддержка уже есть в этом умении');return;}}
    if(p.k==='a')S.skills[p.i].a=d.u;else if(p.k==='s'){const s=S.skills[p.i].s;while(s.length<=p.j)s.push(null);s[p.j]=d.u;}else if(p.k==='hex'){if(p.i)S.hex2=d.u;else S.hex=d.u;}else S.auras[p.i]=d.u;
    save();closeModal();render();},
  unsock(){const p=window._pick;if(p.k==='a')S.skills[p.i].a=null;else if(p.k==='s')S.skills[p.i].s[p.j]=null;else if(p.k==='hex'){if(p.i)S.hex2=null;else S.hex=null;}else{S.auras[p.i]=null;while(S.auras.length&&S.auras[S.auras.length-1]==null)S.auras.pop();}save();closeModal();render();},

/* ---------- поиск без перерисовки: поле .qf фильтрует строки [data-qt] в списке data-for ---------- */
const QF={};
function qMatch(q,t){q=(q||'').trim().toLowerCase().replace(/ё/g,'е');if(!q)return true;t=t.replace(/ё/g,'е');return q.split('|').some(g=>{const w=g.trim().split(/\s+/).filter(Boolean);return w.length&&w.every(x=>t.includes(x));});}
function bindQ(){document.querySelectorAll('input.qf').forEach(inp=>{const k=inp.dataset.k;
  if(QF[k]==null)QF[k]=k==='shop'?(S&&S.shopQ)||'':'';inp.value=QF[k];
  const sel=document.querySelector(`select.qf[data-k="${k}"]`);
  const ap=()=>{QF[k]=inp.value;if(sel)QF[k+'Fit']=sel.value;const fit=sel?sel.value:'';let n=0;
    document.querySelectorAll(`#${inp.dataset.for} [data-qt]`).forEach(el=>{const ok=qMatch(inp.value,el.dataset.qt)&&(!fit||(' '+(el.dataset.fit||'')+' ').includes(' '+fit+' '));el.style.display=ok?'':'none';if(ok)n++;});
    const c=document.getElementById(inp.dataset.for+'_n');if(c)c.textContent=n;};
  inp.oninput=ap;if(sel)sel.onchange=ap;ap();});
  const hq=document.getElementById('heroQ');if(hq){hq.oninput=()=>{S.shopQ=hq.value;QF.shop=hq.value;save();const c=document.getElementById('heroQn');if(c)c.textContent=shopQCount();};}}
function itemQText(x){const parts=[x.name,x.base,slotLabel(x)];Object.entries(x.imp||{}).forEach(([k,v])=>parts.push(lbl(k,v)));x.mods.forEach(m=>{if(x.slot==='flask'){if(FMODS[m.k])parts.push(FMODS[m.k].d(m.v));}else parts.push(modText(m));});return parts.join(' · ').toLowerCase();}
function supFitList(sid){const SD=GEMS[sid];return ACTIVE_IDS.filter(a=>{const A=GEMS[a];if(!A)return false;if(supFits(SD,A))return true;return A.minion&&A.minion.mtags&&supFits(SD,{tags:A.minion.mtags});});}
function shopQCount(){if(!S.shopQ)return 0;return shopStock().filter(x=>qMatch(S.shopQ,itemQText(x))).length;}
/* названия свойств без чисел — для лутфильтра и подсказок */
let STAT_KEYS=null;
function statKeys(){if(STAT_KEYS)return STAT_KEYS;const m=new Map();Object.values(AFX_G).forEach(G=>G.st.forEach(st=>{if(!st)return;const k=st[0];if(!m.has(k))m.set(k,!!G.arr);}));
  STAT_KEYS=[...m.entries()].map(([k,arr])=>({k,n:statName(k,arr)})).sort((a,b)=>a.n.localeCompare(b.n,'ru'));return STAT_KEYS;}
function statName(k,arr){let t;try{t=lbl(k,arr?[1,2]:1);}catch(e){t=k;}return t.replace(/\d+(\.\d+)?/g,'#').replace(/#–#/g,'#').replace(/^\+/,'');}
function lfPropsPanel(lf){const sel=lf.props||[],keys=statKeys();
  return `<details class="lfp" ${sel.length?'open':''}><summary><b>Нужные свойства</b> <span class="dim small">${sel.length?`выбрано ${sel.length}`:'не выбраны — подбираются все'}</span></summary>
    <p class="dim small" style="margin:6px 0">Волшебные и редкие предметы (кроме флаконов) попадут в сумку, только если на них есть хотя бы одно отмеченное свойство. Остальные продадутся.</p>
    ${sel.length?`<div class="tchips">${sel.map(k=>`<button class="tchip on" data-a="lfProp" data-k="${k}">${esc((keys.find(x=>x.k===k)||{n:k}).n)} ✕</button>`).join('')}</div><button class="btn sm ghost" data-a="lfPropClr" style="margin-top:6px">Сбросить</button>`:''}
    <input class="input qf" type="search" data-k="lfp" data-for="lfpL" placeholder="Найти свойство: здоровье, огонь, крит…" style="margin-top:8px" autocomplete="off">
    <div class="tchips" id="lfpL" style="margin-top:6px;max-height:240px;overflow:auto">${keys.filter(x=>!sel.includes(x.k)).map(x=>`<button class="tchip" data-a="lfProp" data-k="${x.k}" data-qt="${esc(x.n.toLowerCase())}">${esc(x.n)}</button>`).join('')}</div></details>`;}
const HERO_CHIPS=[['Здоровье','здоровь'],['Сопротивления','сопротивлен'],['Энерг. щит','энерг'],['Броня','брон'],['Уклонение','уклонен'],['Урон чар','урону чар'],['Физ. урон','физическ'],['Урон стихий','урона огн|урона холод|урона молни'],['Крит','крит'],['Уровень камней','уровню'],['Приспешники','приспешник'],['Мана','ман']];
function heroShopPanel(){const q=S.shopQ||'';

    <p class="dim small" style="margin:0 0 8px">Составьте список свойств — торговец сразу покажет подходящие вещи. Слова через пробел — все должны быть; варианты через «|» — любой из них.</p>

/* предупреждение перед картой: сумка почти полна */
function invGate(fn){if(S.inv.length<INV_WARN){fn();return;}window._invGo=fn;
  modal(`<div class="eyebrow" style="color:var(--bad)">! Инвентарь почти заполнен</div><h2 style="margin:4px 0 8px">${S.inv.length} из ${INV_MAX}</h2>
    <p style="margin:0 0 12px">Когда инвентарь заполнится, выпавшие предметы будут <b class="bad-t">безвозвратно утеряны</b>. Освободите место у торговца или в тайнике.</p>
    <div class="row"><button class="btn sp" data-a="close">Отмена</button><button class="btn sp danger" data-a="invGo">Всё равно запустить</button></div>`);}

/* номера карт: римские цифры в кружке; 1–5 белые, 6–10 жёлтые, 11–16 красные */
function roman(n){const r=[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let o='';for(const [v,c] of r)while(n>=v){o+=c;n-=v;}return o;}
const mapTierCls=t=>t<=5?'mw':t<=10?'my':'mr';

function vDungeon(){dngFetch();
  const loc=ACC.chars.filter(c=>c.dngBest>0).sort((a,b)=>b.dngBest-a.dngBest)[0];

    <div class="panel"><div class="sheet"><div><span>Ваш рекорд</span><span class="gold-t">${S.dngBest||0} волн</span></div><div><span>Уровень монстров</span><span>с 83, растёт</span></div><div><span>Врагов в волне</span><span>3 → 15</span></div></div>
      <p class="muted small" style="margin:10px 0 0">Волны идут без конца, пока вы живы, и с каждой волной монстры сильнее. Каждая 10-я волна — с боссом. Золото, вещи и сферы с монстров — около трети от обычного, зато каждые 5 волн — награда сферами, каждые 10 — карта. Смерть здесь не отнимает опыт.</p>
      <button class="btn pri full" data-a="dngGo" style="margin-top:12px">Спуститься в подземелье</button></div></div>`;}
