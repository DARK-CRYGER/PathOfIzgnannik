  shopItem(d){const it=S.shop.items.find(x=>x.uid===d.u);if(!it)return;const p=buyPrice(it),sl=slotsFor(it);
    modal(`<div class="row"><span class="eyebrow sp">Торговец · ${slotLabel(it)}</span><button class="btn sm ghost" data-a="close">Закрыть</button></div>${itemCard(it)}
      ${it.slot!=='flask'?`<div class="panel"><div class="eyebrow" style="margin-bottom:6px">Если надеть</div>${compareWith(it,it.slot==='ring'?'ring1':sl[0])}</div>`:''}
      <button class="btn pri full" data-a="buy" data-u="${it.uid}" ${S.gold>=p&&S.inv.length<INV_MAX?'':'disabled'}>Купить · ${fmt(p)} зол.</button>`);},
  buy(d){const it=S.shop.items.find(x=>x.uid===d.u);if(!it)return;const p=buyPrice(it);if(S.gold<p)return;S.gold-=p;S.shop.items=S.shop.items.filter(x=>x!==it);it.isNew=1;S.inv.push(it);save();closeModal();render();toast(`Куплено: ${it.name}`);},
  shopRefresh(){const c=shopRefreshCost();if(S.gold<c)return;S.gold-=c;shopStock(true);save();render();},
  gemInfo(d){gemInfo(d.id);},
  buyGem(d){const p=gemPrice(d.id);if(S.gold<p)return;S.gold-=p;addGem(d.id);save();closeModal();render();toast(`Куплен камень: ${gdef(d.id).n}`);},
  resetTree(){const c=treeResetCost();if(S.gold<c)return;S.gold-=c;S.alloc=[startNode(S.cls)];S.attrPick={};save();render();toast('Древо сброшено');},
  resetAsc(){const c=ascResetCost();if(S.gold<c)return;S.gold-=c;S.ascAlloc=[];save();render();toast('Очки возвышения возвращены');},
  sellOne(d){const it=S.inv.find(x=>x.uid===d.u);if(!it)return;const v=sellPrice(it);S.gold+=v;S.inv=S.inv.filter(x=>x!==it);save();render();toast(`Продано за ${v} зол.`);},
  sellBulk(d){const g=sellGroup(d.r);let v=0;g.forEach(x=>v+=sellPrice(x));const set=new Set(g);S.inv=S.inv.filter(x=>!set.has(x));S.gold+=v;sellAllAsk=false;save();render();toast(`Продано ${g.length} шт. за ${fmt(v)} зол.`);},

  heroChip(d){const parts=(S.shopQ||'').split('|').map(x=>x.trim()).filter(Boolean),i=parts.indexOf(d.t);if(i>=0)parts.splice(i,1);else parts.push(d.t);S.shopQ=parts.join(' | ');QF.shop=S.shopQ;save();render();},

  stTab(d){stashTab=d.t;render();},

      <label class="stack" style="gap:6px"><span class="eyebrow">Цена, золото</span><input class="input num" id="aucPrice" type="number" min="1" inputmode="numeric" value="${base}"></label>
      <div class="row">${[.5,1,2,5].map(m=>`<button class="btn sm sp" data-a="aucQuick" data-v="${R(base*m)}">${fmt(R(base*m))}</button>`).join('')}</div>
      <button class="btn pri full" data-a="aucPost">Выставить</button>`);},
  aucQuick(d){const el=document.getElementById('aucPrice');if(el)el.value=d.v;},

    if(!it||p<1){toast('Укажите цену');return;}

  async aucClaim(){try{const g=await AUC.claim();S.gold+=g;save();toast(`Получено ${fmt(g)} зол.`);}catch(e){toast(e.message);}aucData.mine=null;aucLoad();render();},
  benchSel(d){benchSel=d.u||null;render();},
  benchCraft(d){const all=[...EQ_SLOTS.map(s=>S.equip[s]).filter(Boolean),...S.inv],it=all.find(x=>x.uid===benchSel);if(it&&benchCraft(it,d.k)){haptic('medium');toast('Свойство мастера добавлено');render();}},
  benchRemove(){const all=[...EQ_SLOTS.map(s=>S.equip[s]).filter(Boolean),...S.inv],it=all.find(x=>x.uid===benchSel);if(it&&benchRemove(it)){toast('Свойство мастера удалено');render();}},
  dmSkill(d){dm.i=+d.i;dm.res=null;render();},dmPreset(d){dm.preset=d.k;dm.res=null;render();},dmDist(d){dm.d=+d.i;dm.res=null;render();},

  labSwitch(d){labSwitch(+d.i);render();},
  labSwitchReset(){labSwitchReset();render();},
  labTrap(d){labTrap(+d.j);render();},
  labPz(d){labPz(+d.s);render();},
  labShrine(d){labShrine(+d.k);render();},
  labNext(){labNext();render();},
  labBoss(){if(S.labRun){S.labRun.room={type:'boss'};save();startBattle({type:'lab',boss:true});}},
  labLeaveAsk(){modal(`<h2>Покинуть лабиринт?</h2><p class="muted" style="margin:0">Прохождение будет потеряно${S.labRun&&S.labRun.n===3?', подношение не вернётся':''}.</p><div class="row"><button class="btn sp" data-a="close">Остаться</button><button class="btn sp danger" data-a="labLeave">Покинуть</button></div>`);},
  labLeave(){S.labRun=null;save();closeModal();render();},
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el||el.disabled)return;if(el.closest('#treebox')&&!el.closest('.tinfo')&&el.dataset.a!=='tz')return;const f=ACT[el.dataset.a];if(f)f(el.dataset,el,ev);});
/* последний экран итога боя — чтобы вернуться к нему после журнала */
{const sv=showVictory,sd=showDeath,sl=showLabWin;
  showVictory=(n,c)=>{window._lastOver=()=>sv(n,c);sv(n,c);};
  showDeath=l=>{window._lastOver=()=>sd(l);sd(l);};
  showLabWin=()=>{window._lastOver=()=>sl();sl();};}

/* старт */
load();
screen=S?'main':ACC.chars.length?'roster':'select';tab='map';if(S)viewAct=actOfProg();
render();

/* ---------- поиск без перерисовки: поле .qf фильтрует строки [data-qt] в списке data-for ---------- */
const QF={};
function qMatch(q,t){q=(q||'').trim().toLowerCase().replace(/ё/g,'е');if(!q)return true;t=t.replace(/ё/g,'е');return q.split('|').some(g=>{const w=g.trim().split(/\s+/).filter(Boolean);return w.length&&w.every(x=>t.includes(x));});}
function bindQ(){document.querySelectorAll('input.qf').forEach(inp=>{const k=inp.dataset.k;
  if(QF[k]==null)QF[k]=k==='shop'?(S&&S.shopQ)||'':'';inp.value=QF[k];
  const sel=document.querySelector(`select.qf[data-k="${k}"]`);
  const ap=()=>{QF[k]=inp.value;if(sel)QF[k+'Fit']=sel.value;const fit=sel?sel.value:'';let n=0;
    document.querySelectorAll(`#${inp.dataset.for} [data-qt]`).forEach(el=>{const ok=qMatch(inp.value,el.dataset.qt)&&(!fit||(' '+(el.dataset.fit||'')+' ').includes(' '+fit+' '));el.style.display=ok?'':'none';if(ok)n++;});
    const c=document.getElementById(inp.dataset.for+'_n');if(c)c.textContent=n;};
  inp.oninput=ap;if(sel)sel.onchange=ap;ap();});
  const hq=document.getElementById('heroQ');if(hq){hq.oninput=()=>{S.shopQ=hq.value;QF.shop=hq.value;save();const c=document.getElementById('heroQn');if(c)c.textContent=shopQCount();};}}
function itemQText(x){const parts=[x.name,x.base,slotLabel(x)];Object.entries(x.imp||{}).forEach(([k,v])=>parts.push(lbl(k,v)));x.mods.forEach(m=>{if(x.slot==='flask'){if(FMODS[m.k])parts.push(FMODS[m.k].d(m.v));}else parts.push(modText(m));});return parts.join(' · ').toLowerCase();}
function supFitList(sid){const SD=GEMS[sid];return ACTIVE_IDS.filter(a=>{const A=GEMS[a];if(!A)return false;if(supFits(SD,A))return true;return A.minion&&A.minion.mtags&&supFits(SD,{tags:A.minion.mtags});});}
function shopQCount(){if(!S.shopQ)return 0;return shopStock().filter(x=>qMatch(S.shopQ,itemQText(x))).length;}
/* названия свойств без чисел — для лутфильтра и подсказок */
let STAT_KEYS=null;
function statKeys(){if(STAT_KEYS)return STAT_KEYS;const m=new Map();Object.values(AFX_G).forEach(G=>G.st.forEach(st=>{if(!st)return;const k=st[0];if(!m.has(k))m.set(k,!!G.arr);}));
  STAT_KEYS=[...m.entries()].map(([k,arr])=>({k,n:statName(k,arr)})).sort((a,b)=>a.n.localeCompare(b.n,'ru'));return STAT_KEYS;}
function statName(k,arr){let t;try{t=lbl(k,arr?[1,2]:1);}catch(e){t=k;}return t.replace(/\d+(\.\d+)?/g,'#').replace(/#–#/g,'#').replace(/^\+/,'');}
function lfPropsPanel(lf){const sel=lf.props||[],keys=statKeys();
  return `<details class="lfp" ${sel.length?'open':''}><summary><b>Нужные свойства</b> <span class="dim small">${sel.length?`выбрано ${sel.length}`:'не выбраны — подбираются все'}</span></summary>
    <p class="dim small" style="margin:6px 0">Волшебные и редкие предметы (кроме флаконов) попадут в сумку, только если на них есть хотя бы одно отмеченное свойство. Остальные продадутся.</p>
    ${sel.length?`<div class="tchips">${sel.map(k=>`<button class="tchip on" data-a="lfProp" data-k="${k}">${esc((keys.find(x=>x.k===k)||{n:k}).n)} ✕</button>`).join('')}</div><button class="btn sm ghost" data-a="lfPropClr" style="margin-top:6px">Сбросить</button>`:''}
    <input class="input qf" type="search" data-k="lfp" data-for="lfpL" placeholder="Найти свойство: здоровье, огонь, крит…" style="margin-top:8px" autocomplete="off">
    <div class="tchips" id="lfpL" style="margin-top:6px;max-height:240px;overflow:auto">${keys.filter(x=>!sel.includes(x.k)).map(x=>`<button class="tchip" data-a="lfProp" data-k="${x.k}" data-qt="${esc(x.n.toLowerCase())}">${esc(x.n)}</button>`).join('')}</div></details>`;}
const HERO_CHIPS=[['Здоровье','здоровь'],['Сопротивления','сопротивлен'],['Энерг. щит','энерг'],['Броня','брон'],['Уклонение','уклонен'],['Урон чар','урону чар'],['Физ. урон','физическ'],['Урон стихий','урона огн|урона холод|урона молни'],['Крит','крит'],['Уровень камней','уровню'],['Приспешники','приспешник'],['Мана','ман']];
function heroShopPanel(){const q=S.shopQ||'';
  return `<div class="panel"><div class="ph"><h2>Поиск у торговца</h2></div>
    <p class="dim small" style="margin:0 0 8px">Составьте список свойств — торговец сразу покажет подходящие вещи. Слова через пробел — все должны быть; варианты через «|» — любой из них.</p>
    <input class="input" id="heroQ" type="search" value="${esc(q)}" placeholder="например: здоровь | сопротивлен огн" autocomplete="off">
    <div class="tchips" style="margin-top:8px">${HERO_CHIPS.map(([n,t])=>`<button class="tchip ${q.split('|').map(x=>x.trim()).includes(t)?'on':''}" data-a="heroChip" data-t="${esc(t)}">${n}</button>`).join('')}</div>
    <div class="row" style="margin-top:8px"><span class="dim small sp">Сейчас у торговца подходит: <b id="heroQn">${shopQCount()}</b></span><button class="btn sm" data-a="heroShop">К торговцу</button></div></div>`;}

/* предупреждение перед картой: сумка почти полна */
function invGate(fn){if(S.inv.length<INV_WARN){fn();return;}window._invGo=fn;
  modal(`<div class="eyebrow" style="color:var(--bad)">! Инвентарь почти заполнен</div><h2 style="margin:4px 0 8px">${S.inv.length} из ${INV_MAX}</h2>
    <p style="margin:0 0 12px">Когда инвентарь заполнится, выпавшие предметы будут <b class="bad-t">безвозвратно утеряны</b>. Освободите место у торговца или в тайнике.</p>
    <div class="row"><button class="btn sp" data-a="close">Отмена</button><button class="btn sp danger" data-a="invGo">Всё равно запустить</button></div>`);}

/* номера карт: римские цифры в кружке; 1–5 белые, 6–10 жёлтые, 11–16 красные */
function roman(n){const r=[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let o='';for(const [v,c] of r)while(n>=v){o+=c;n-=v;}return o;}
const mapTierCls=t=>t<=5?'mw':t<=10?'my':'mr';

/* ---------- экран подземелья ---------- */
function vDungeon(){dngFetch();
  const loc=ACC.chars.filter(c=>c.dngBest>0).sort((a,b)=>b.dngBest-a.dngBest)[0];
  const top=dngTop||(loc?{wave:loc.dngBest,nick:ACC.tgName?'@'+ACC.tgName:loc.name,char:loc.name}:null);
  return `<div class="stack">${subHead('Подземелье','Убежище')}
    <div class="panel framed dng"><div class="eyebrow">Dungeon master ♂</div>
      <h2 style="margin:4px 0 2px;font-size:24px">${top?esc(top.nick||top.char):'пока никого'}</h2>
      <div class="muted">${top?`${top.char&&top.nick!==top.char?esc(top.char)+' · ':''}победил <b class="gold-t">${top.wave}</b> волн${srvOn()&&dngTop?'':' <span class="dim small">(среди ваших персонажей)</span>'}`:'Станьте первым, кто спустится глубже всех'}</div></div>
    <div class="panel"><div class="sheet"><div><span>Ваш рекорд</span><span class="gold-t">${S.dngBest||0} волн</span></div><div><span>Уровень монстров</span><span>с 83, растёт</span></div><div><span>Врагов в волне</span><span>3 → 15</span></div></div>
      <p class="muted small" style="margin:10px 0 0">Волны идут без конца, пока вы живы, и с каждой волной монстры сильнее. Каждая 10-я волна — с боссом. Золото, вещи и сферы с монстров — около трети от обычного, зато каждые 5 волн — награда сферами, каждые 10 — карта. Смерть здесь не отнимает опыт.</p>
      <button class="btn pri full" data-a="dngGo" style="margin-top:12px">Спуститься в подземелье</button></div></div>`;}
